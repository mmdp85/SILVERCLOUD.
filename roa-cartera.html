// ==========================================================
// FIREBASE SYNC
// ==========================================================
function setFbStatus(s) {
  const el = document.getElementById('fb-status');
  if (!el) return;
  const labels = { connecting: 'Conectando…', online: 'Online · Sync', syncing: 'Guardando…', offline: 'Modo offline', error: 'Error de conexión' };
  el.className = `fb-status ${s}`;
  el.innerHTML = `<span class="fb-dot"></span><span>${labels[s] || s}</span>`;
}

async function initFirebase() {
  if (!window.SC_FB) return;
  state.fb.ready = true;
  const { db, doc, getDoc, setDoc, onSnapshot } = window.SC_FB;
  setFbStatus('connecting');
  try {
    const cartRef = doc(db, "silvercloud", "carteras");
    const roaRef  = doc(db, "silvercloud", "roa-config");

    const [cartSnap, roaSnap] = await Promise.all([getDoc(cartRef), getDoc(roaRef)]);

    if (cartSnap.exists()) {
      const data = cartSnap.data().data;
      if (data) state.templates = data;
    }
    if (roaSnap.exists()) {
      const data = roaSnap.data().data;
      if (data) {
        if (data.claseSelections) state.claseSelections = data.claseSelections;
        if (data.pfEstimaciones)  state.pfEstimaciones  = data.pfEstimaciones;
      }
    } else {
      // fallback localStorage
      try {
        const local = localStorage.getItem("sc-roa-config");
        if (local) {
          const parsed = JSON.parse(local);
          state.claseSelections = parsed.claseSelections || {};
          state.pfEstimaciones  = parsed.pfEstimaciones  || {};
        }
      } catch(e) {}
    }

    populateCarteras();
    render();

    // Subscribirse a cambios en carteras (para reflejar ediciones en vivo)
    onSnapshot(cartRef, (snap) => {
      if (!snap.exists()) return;
      const data = snap.data().data;
      if (!data) return;
      state.templates = data;
      render();
    }, (err) => console.warn('Sync carteras:', err));

    // Subscribirse a cambios de la config ROA
    onSnapshot(roaRef, (snap) => {
      if (!snap.exists() || state.fb.savingTimer) return;
      const data = snap.data().data;
      if (!data) return;
      state.claseSelections = data.claseSelections || {};
      state.pfEstimaciones  = data.pfEstimaciones  || {};
      render();
    }, (err) => console.warn('Sync roa-config:', err));

    setFbStatus('online');
  } catch (e) {
    console.error('Firebase init error:', e);
    setFbStatus('offline');
  }
}

function saveConfig() {
  try { localStorage.setItem("sc-roa-config", JSON.stringify({ claseSelections: state.claseSelections, pfEstimaciones: state.pfEstimaciones })); } catch(e){}
  if (!state.fb.ready || !window.SC_FB) return;
  setFbStatus('syncing');
  if (state.fb.savingTimer) clearTimeout(state.fb.savingTimer);
  state.fb.savingTimer = setTimeout(async () => {
    try {
      const { db, doc, setDoc } = window.SC_FB;
      await setDoc(doc(db, "silvercloud", "roa-config"), { data: { claseSelections: state.claseSelections, pfEstimaciones: state.pfEstimaciones }, updatedAt: Date.now() });
      setFbStatus('online');
    } catch(e) { console.warn('Save roa-config:', e); setFbStatus('offline'); }
    state.fb.savingTimer = null;
  }, 600);
}

function populateCarteras() {
  const sel = document.getElementById('cartera-select');
  sel.innerHTML = '<option value="">— Seleccionar —</option>';
  ORDER.forEach(id => {
    const meta = TEMPLATES_META[id];
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = meta.label;
    sel.appendChild(opt);
  });
}

function onCarteraChange(id) {
  state.selectedCartera = id;
  // Si la cartera es solo ARS o solo USD, fijar moneda automáticamente
  const meta = TEMPLATES_META[id];
  if (meta) {
    if (meta.moneda === "ARS") setMoneda("ARS");
    else if (meta.moneda === "USD") setMoneda("USD");
    // si es MIX, dejar la que está
  }
  render();
}

function onMfChange(val) {
  state.mf = parseFloat(val) || 0;
  render();
}

function setMoneda(m) {
  state.moneda = m;
  document.getElementById('moneda-ars').classList.toggle('active', m === 'ARS');
  document.getElementById('moneda-usd').classList.toggle('active', m === 'USD');
  render();
}

function setClase(fciId, claseName) {
  state.claseSelections[fciId] = claseName;
  saveConfig();
  render();
}

function setPfEstimacion(fciId, val) {
  const num = parseFloat(val);
  if (isNaN(num) || num < 0) state.pfEstimaciones[fciId] = 0;
  else state.pfEstimaciones[fciId] = num;
  saveConfig();
  render();
}

function getFeeFor(activoId) {
  // Devuelve { fee: %, label: string para mostrar, isFci: bool, hasOptions: bool }
  const fciData = FCI_CLASES[activoId];
  if (fciData) {
    // Es FCI
    if (fciData.notFound) {
      return { fee: fciData.defaultFee, label: `${fciData.defaultFee.toFixed(2)}% (retro estimada)`, isFci: true, hasOptions: false };
    }
    const clases = fciData.clases;
    const selected = state.claseSelections[activoId] || clases[0].n;
    const claseObj = clases.find(c => c.n === selected) || clases[0];
    return { fee: claseObj.f, label: `${claseObj.f.toFixed(2)}%`, isFci: true, hasOptions: true, clases, selectedClase: claseObj.n };
  }
  // Es activo directo
  const a = ALL_ACTIVOS[activoId];
  if (a) {
    const cat = CATEGORIES[a.category];
    if (cat && cat.direct) {
      return { fee: cat.fee, label: `${cat.fee.toFixed(2)}% (retro broker)`, isFci: false, hasOptions: false };
    }
  }
  return { fee: 0, label: "—", isFci: false, hasOptions: false };
}

function fmtMoney(amount, moneda) {
  if (amount === 0) return '0';
  const sym = moneda === 'USD' ? 'US$' : '$';
  return sym + ' ' + amount.toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function fmtPct(p) {
  return p.toFixed(3) + '%';
}

function render() {
  const content = document.getElementById('content');
  const id = state.selectedCartera;
  if (!id) {
    content.innerHTML = `<div class="card"><div class="empty-state">
      <div class="empty-state-icon">📊</div>
      Seleccioná una cartera modelo, ingresá el MF del cliente y elegí la moneda de cálculo para ver el ROA.
    </div></div>`;
    return;
  }
  const tpl = state.templates[id];
  if (!tpl) {
    content.innerHTML = `<div class="card"><div class="empty-state">
      <div class="empty-state-icon">⚠</div>
      No se encontraron datos para esta cartera. Verificá que la cartera esté armada en el módulo Carteras Modelo.
    </div></div>`;
    return;
  }
  const blocks = tpl.blocks || {};
  const entries = Object.entries(blocks).filter(([, v]) => Number(v) > 0);
  if (entries.length === 0) {
    content.innerHTML = `<div class="card"><div class="empty-state">
      <div class="empty-state-icon">📭</div>
      La cartera "${TEMPLATES_META[id].label}" está vacía. Andá a Carteras Modelo y agregá activos primero.
    </div></div>`;
    return;
  }

  // Ordenar por categoría
  const catOrder = Object.keys(CATEGORIES);
  entries.sort((a, b) => {
    const ca = ALL_ACTIVOS[a[0]]?.category;
    const cb = ALL_ACTIVOS[b[0]]?.category;
    const oa = catOrder.indexOf(ca);
    const ob = catOrder.indexOf(cb);
    if (oa !== ob) return oa - ob;
    return Number(b[1]) - Number(a[1]);
  });

  // Construir tabla de activos
  let lastCat = null;
  let rowsHtml = '';
  let totalMfFee = 0;
  let totalPfFee = 0;
  const fondosPF = []; // FCIs con performance fee presentes en cartera

  entries.forEach(([activoId, peso]) => {
    const a = ALL_ACTIVOS[activoId];
    const cat = a ? CATEGORIES[a.category] : null;
    if (a && a.category !== lastCat && cat) {
      rowsHtml += `<tr class="cat-subheader"><td colspan="5"><span class="cat-subheader-dot" style="background:${cat.color};"></span>${cat.label}</td></tr>`;
      lastCat = a.category;
    }
    const feeInfo = getFeeFor(activoId);
    const pesoNum = Number(peso);
    const montoActivo = (state.mf * pesoNum) / 100;
    const mfAnual = (montoActivo * feeInfo.fee) / 100;
    totalMfFee += mfAnual;

    // Check si tiene PF
    if (PERF_FEES[activoId]) {
      fondosPF.push({ id: activoId, name: a ? a.name : activoId, peso: pesoNum, monto: montoActivo, pfRate: PERF_FEES[activoId] });
    }

    let feeCell;
    if (feeInfo.hasOptions) {
      const opts = feeInfo.clases.map(c =>
        `<option value="${c.n}" ${c.n === feeInfo.selectedClase ? 'selected' : ''}>${c.n} — ${c.f.toFixed(2)}%</option>`
      ).join('');
      feeCell = `<select class="clase-select" onchange="setClase('${activoId}', this.value)">${opts}</select>`;
    } else {
      feeCell = `<span class="fee-fixed">${feeInfo.label}</span>`;
    }

    const pfBadge = PERF_FEES[activoId] ? `<span class="pf-badge">+ PF ${PERF_FEES[activoId]}%</span>` : '';

    rowsHtml += `<tr>
      <td><span class="activo-dot" style="background:${cat ? cat.color : '#888'};"></span><span class="activo-name">${a ? a.name : activoId}</span>${pfBadge}${a && a.subgroup ? `<div class="activo-sub">${a.subgroup}</div>` : ''}</td>
      <td class="right">${pesoNum}%</td>
      <td>${feeCell}</td>
      <td class="right"><span class="fee-value">${fmtPct(feeInfo.fee)}</span></td>
      <td class="right"><span class="roa-amount">${fmtMoney(mfAnual, state.moneda)}</span></td>
    </tr>`;
  });

  // Tabla principal
  let html = `<div class="card">
    <div class="card-title">📋 ${TEMPLATES_META[id].label} — Detalle por activo</div>
    <table class="activos-tabla">
      <thead><tr>
        <th>Activo</th>
        <th class="right">Peso</th>
        <th>Clase / Retro</th>
        <th class="right">Retro anual</th>
        <th class="right">ROA</th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  </div>`;

  // Bloque Performance Fee
  if (fondosPF.length > 0) {
    let pfRows = '';
    fondosPF.forEach(f => {
      const rendEst = state.pfEstimaciones[f.id] !== undefined ? state.pfEstimaciones[f.id] : 0;
      const pfMonto = (f.monto * rendEst / 100) * (f.pfRate / 100);
      totalPfFee += pfMonto;
      pfRows += `<div class="pf-row">
        <div>
          <div class="pf-row-name">${f.name}</div>
          <div class="pf-row-sub">Peso ${f.peso}% · MF ${fmtMoney(f.monto, state.moneda)} · PF ${f.pfRate}% sobre máximo</div>
        </div>
        <div class="pf-cell-right">
          <div class="pf-label-mini">Rendim. estimado</div>
          <div class="pf-input-wrap" style="justify-content:flex-end;">
            <input type="number" class="pf-input" min="0" step="0.5" value="${rendEst}" oninput="setPfEstimacion('${f.id}', this.value)"> <span style="color:var(--text-dim);font-size:13px;">%</span>
          </div>
        </div>
        <div class="pf-cell-right">
          <div class="pf-label-mini">Tasa PF</div>
          <div style="font-weight:600;color:var(--text-bright);font-family:'Libre Baskerville',serif;">${f.pfRate}%</div>
        </div>
        <div class="pf-cell-right">
          <div class="pf-label-mini">ROA por PF</div>
          <div class="roa-amount">${fmtMoney(pfMonto, state.moneda)}</div>
        </div>
      </div>`;
    });
    html += `<div class="pf-section">
      <div class="pf-title">⚡ Performance Fee (estimado)</div>
      <div class="pf-row-header">
        <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;">Fondo</div>
        <div class="pf-cell-right" style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;">Estimación</div>
        <div class="pf-cell-right" style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;">Tasa</div>
        <div class="pf-cell-right" style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;">ROA estimado</div>
      </div>
      ${pfRows}
      <div style="font-size:11px;color:var(--text-dim);margin-top:12px;line-height:1.5;font-style:italic;">
        El PF se cobra solo cuando el fondo alcanza un nuevo máximo histórico. Ingresá el rendimiento estimado del fondo sobre su último máximo para calcular el ROA esperado.
      </div>
    </div>`;
  }

  // Cuadro resumen
  const feeTotal = state.mf > 0 ? (totalMfFee / state.mf) * 100 : 0;
  const totalGeneral = totalMfFee + totalPfFee;
  const totalMensual = totalGeneral / 12;

  // Calcular %s sobre monto cartera (si MF > 0)
  const pctRetroAnual   = state.mf > 0 ? (totalMfFee   / state.mf) * 100 : 0;
  const pctPfAnual      = state.mf > 0 ? (totalPfFee   / state.mf) * 100 : 0;
  const pctTotalAnual   = state.mf > 0 ? (totalGeneral / state.mf) * 100 : 0;

  html += `<div class="summary-card">
    <div class="summary-title">💰 ROA Estimado</div>

    <div class="summary-row">
      <span class="lbl">Monto cartera</span>
      <span class="val">${fmtMoney(state.mf, state.moneda)}</span>
    </div>
    <div class="summary-row">
      <span class="lbl">Cartera</span>
      <span class="val muted">${TEMPLATES_META[id].label}</span>
    </div>

    <div class="summary-row section">
      <span class="lbl">▸ Retro (comisión devuelta por fondos/broker)</span>
      <span class="val muted">${fmtPct(feeTotal)} anual ponderado</span>
    </div>
    <div class="summary-row">
      <span class="lbl sub">ROA por retro anual</span>
      <span class="val">${fmtMoney(totalMfFee, state.moneda)} <span style="color:var(--text-dim);font-size:12px;font-weight:400;margin-left:6px;">(${fmtPct(pctRetroAnual)})</span></span>
    </div>
    <div class="summary-row">
      <span class="lbl sub">ROA por retro mensual</span>
      <span class="val muted">${fmtMoney(totalMfFee/12, state.moneda)}</span>
    </div>

    ${fondosPF.length > 0 ? `
    <div class="summary-row section">
      <span class="lbl">▸ Performance Fee (estimado)</span>
      <span class="val muted">${fondosPF.length} fondo${fondosPF.length === 1 ? '' : 's'} con PF</span>
    </div>
    <div class="summary-row">
      <span class="lbl sub">ROA por PF anual</span>
      <span class="val">${fmtMoney(totalPfFee, state.moneda)} <span style="color:var(--text-dim);font-size:12px;font-weight:400;margin-left:6px;">(${fmtPct(pctPfAnual)})</span></span>
    </div>
    ` : ''}

    <div class="summary-total">
      <div class="summary-row">
        <span class="lbl">ROA TOTAL ANUAL</span>
        <span class="val">${fmtPct(pctTotalAnual)}</span>
      </div>
      <div class="summary-row mensual">
        <span class="lbl">ROA mensual promedio</span>
        <span class="val">${fmtPct(pctTotalAnual/12)}</span>
      </div>
    </div>
  </div>`;

  content.innerHTML = html;
}

// ==========================================================
// INIT
// ==========================================================
if (window.SC_FB) initFirebase();
else window.addEventListener('sc-firebase-ready', initFirebase, { once: true });

// Si Firebase no responde, igual mostrar la UI con localStorage
setTimeout(() => {
  if (!state.fb.ready) {
    setFbStatus('offline');
    // Intentar cargar templates desde localStorage
    try {
      const local = localStorage.getItem("sc-carteras-modelo");
      if (local) state.templates = JSON.parse(local);
      const localRoa = localStorage.getItem("sc-roa-config");
      if (localRoa) {
        const parsed = JSON.parse(localRoa);
        state.claseSelections = parsed.claseSelections || {};
        state.pfEstimaciones  = parsed.pfEstimaciones  || {};
      }
    } catch(e) {}
    populateCarteras();
    render();
  }
}, 8000);

// Render inicial (con datos vacíos hasta que llegue Firebase)
populateCarteras();
render();
</script>

</body>
</html>
