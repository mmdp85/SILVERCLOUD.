// Exporta la tabla de clientes a un CSV que abre directo en Excel (es-AR)
function exportClientesCSV() {
  const fx = Number(state.clientes.fx) || 0;
  const rows = (state.clientes.rows || []).slice();
  if (!rows.length) { alert('No hay clientes cargados para exportar.'); return; }

  const numAR = (n) => (Number(n) || 0).toLocaleString('es-AR', { useGrouping: false, maximumFractionDigits: 2 });
  const cell = (v) => {
    let s = (v === null || v === undefined) ? '' : String(v);
    if (/[";\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const cartLabel = (r) => {
    const cid = carteraIdDe(r);
    return cid && state.templates[cid] ? state.templates[cid].label : (r.cartera || '');
  };

  // Ordenar igual que en pantalla: perfil, moneda, nombre
  rows.sort((a, b) => {
    const ka = grupoKeyDe(a), kb = grupoKeyDe(b);
    const [pa, ma, ca] = ka.split('||'), [pb, mb, cb] = kb.split('||');
    const ia = PERFIL_ORDER.indexOf(pa), ib = PERFIL_ORDER.indexOf(pb);
    const va = ia === -1 ? 999 : ia, vb = ib === -1 ? 999 : ib;
    if (va !== vb) return va - vb;
    const oa = MONEDA_ORDER[ma] === undefined ? 9 : MONEDA_ORDER[ma];
    const ob = MONEDA_ORDER[mb] === undefined ? 9 : MONEDA_ORDER[mb];
    if (oa !== ob) return oa - ob;
    const sa = subGrupoOrden(ca), sb = subGrupoOrden(cb);
    if (sa !== sb) return sa - sb;
    return (a.nombre || '').localeCompare(b.nombre || '');
  });

  const headers = ['Nombre', 'Comitente', 'ALyC', 'Cartera', 'Perfil', 'Moneda', 'Monto', 'En USD', 'Estado', 'Comentarios'];
  const lines = [headers.map(cell).join(';')];
  let totalUSD = 0;
  rows.forEach(r => {
    const u = clienteUSD(r, fx);
    if (u != null) totalUSD += u;
    lines.push([
      cell(r.nombre || ''),
      cell(r.comitente || ''),
      cell(r.alyc || ''),
      cell(cartLabel(r)),
      cell(perfilDe(r) || 'Sin asignar'),
      cell(r.moneda || ''),
      cell(numAR(r.monto)),
      cell(u == null ? '' : numAR(u)),
      cell((r.estado === 'OK') ? 'OK' : 'Pendiente'),
      cell(r.comentario || '')
    ].join(';'));
  });
  lines.push('');
  lines.push(['TOTAL administrado (USD)', '', '', '', '', '', '', cell(numAR(totalUSD)), '', ''].join(';'));
  lines.push(['Dólar usado (ARS→USD)', '', '', '', '', '', '', cell(numAR(fx)), '', ''].join(';'));
  lines.push(['Exportado', '', '', '', '', '', '', cell(new Date().toLocaleString('es-AR')), '', ''].join(';'));

  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `silvercloud-clientes-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderClientesInto() {
  const content = document.getElementById('content');
  if (content) content.innerHTML = renderClientes();
}

function toggleCliente(id) {
  if (!state.clientes.expanded) state.clientes.expanded = {};
  state.clientes.expanded[id] = !state.clientes.expanded[id];
  renderClientesInto();
}

function carteraIdDe(r) {
  if (!r || !r.cartera) return null;
  if (ORDER.includes(r.cartera)) return r.cartera;
  const found = ORDER.find(id => state.templates[id] && state.templates[id].label === r.cartera);
  return found || null;
}

const PERFIL_ORDER = ["PRESERVACIÓN", "MODERADA", "AGRESIVA", "PARA VIVIR", "RETORNO TOTAL"];

function perfilDe(r) {
  const cid = carteraIdDe(r);
  if (cid && state.templates[cid] && state.templates[cid].perfil) return state.templates[cid].perfil;
  return null;
}

const MONEDA_LABEL = { ARS: "Pesos", USD: "Dólar", MIX: "Mixto" };
const MONEDA_ORDER = { ARS: 0, USD: 1, MIX: 2 };

// Moneda de la cartera modelo asignada (para separar Pesos vs Dólar en los grupos)
function monedaDeGrupo(r) {
  const cid = carteraIdDe(r);
  if (cid && state.templates[cid] && state.templates[cid].moneda) return state.templates[cid].moneda;
  return r.moneda === "USD" ? "USD" : "ARS";
}

// Clave de grupo = perfil + moneda (ej. "MODERADA||ARS")
// Para carteras MIX (Retorno Total 70/30 y 50/50) se agrega la cartera como
// tercer nivel para que cada modelo tenga su propio grupo.
function grupoKeyDe(r) {
  const p = perfilDe(r);
  if (!p) return "__none__";
  const m = monedaDeGrupo(r);
  if (m === "MIX") {
    const cid = carteraIdDe(r);
    if (cid) return p + "||" + m + "||" + cid;
  }
  return p + "||" + m;
}

// Orden del subgrupo segun el orden de definicion de las carteras modelo
function subGrupoOrden(cid) {
  if (!cid) return 999;
  const i = Object.keys(state.templates).indexOf(cid);
  return i === -1 ? 999 : i;
}

function grupoLabelDe(key) {
  if (key === "__none__") return "Sin asignar";
  const [p, m, cid] = key.split("||");
  if (m === "MIX") {
    if (cid && state.templates[cid]) {
      const lbl = state.templates[cid].label || "";
      const idx = lbl.indexOf("·");
      const suf = idx !== -1 ? lbl.slice(idx + 1).trim() : lbl;
      return suf ? p + " · " + suf : p;
    }
    return p;
  }
  if (!m) return p;
  return p + " · " + (MONEDA_LABEL[m] || m);
}

function renderClienteDetalle(r) {
  const cid = carteraIdDe(r);
  if (!cid) return `<div class="cli-det-empty">Asign&aacute; una cartera a este cliente para ver los fondos sugeridos.</div>`;
  const entries = ordenesEntries(cid);
  const cartLabel = state.templates[cid] ? state.templates[cid].label : cid;
  if (!entries.length) return `<div class="cli-det-empty">La cartera &ldquo;${escCli(cartLabel)}&rdquo; todav&iacute;a no tiene activos cargados.</div>`;

  const monto = Number(r.monto) || 0;
  const moneda = r.moneda === 'USD' ? 'USD' : 'ARS';
  let rows = '', lastCat = null, totalPct = 0, totalM = 0;
  entries.forEach(([aid, pct]) => {
    const a = ACTIVOS_BY_ID[aid];
    const name = a ? a.name : aid;
    const p = Number(pct) || 0;
    const m = monto * p / 100;
    totalPct += p; totalM += m;
    if (a && a.category !== lastCat) {
      const cat = CATEGORIES[a.category];
      rows += `<tr class="cli-det-cat"><td colspan="3"><span class="cli-dot" style="background:${cat.color};"></span>${cat.label}</td></tr>`;
      lastCat = a.category;
    }
    rows += `<tr>
      <td><span class="cli-dot" style="background:${getActivoColor(aid)};"></span>${escCli(name)}</td>
      <td class="cli-r">${p.toFixed(1)}%</td>
      <td class="cli-r cli-det-m">${monto > 0 ? fmtPesos(m, moneda) : '&mdash;'}</td>
    </tr>`;
  });

  let warn = '';
  if (Math.abs(totalPct - 100) >= 0.01) {
    warn = `<div class="cli-det-warn">&#9888; La cartera pondera ${totalPct.toFixed(1)}% (no 100%). Balance&aacute;la al 100% para asignar todo el monto.</div>`;
  }

  return `
    <div class="cli-det">
      <div class="cli-det-h">${escCli(cartLabel)} &middot; objetivo sobre ${monto > 0 ? fmtPesos(monto, moneda) : '(cargá el monto del cliente)'}</div>
      <table class="cli-det-tbl">
        <thead><tr><th>Activo / Fondo</th><th class="cli-r">Pond.</th><th class="cli-r">Monto</th></tr></thead>
        <tbody>
          ${rows}
          <tr class="cli-det-tot"><td>TOTAL</td><td class="cli-r">${totalPct.toFixed(1)}%</td><td class="cli-r">${monto > 0 ? fmtPesos(totalM, moneda) : '&mdash;'}</td></tr>
        </tbody>
      </table>
      ${warn}
    </div>`;
}

// ===================== RENDIMIENTOS (track record) =====================
/* Los retornos viven en Firestore (silvercloud/rendimientos) con forma:
   { "p-cons": { "2020-01": 8.3301, ... }, ... }   ← números planos, sin arrays anidados.
   Se cargan a mano desde esta pestaña. El factsheet los lee en vivo. */

const RD_MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function rdSerie(id) { return state.rendimientos.data[id] || {}; }
function rdKeys(id) { return Object.keys(rdSerie(id)).sort(); }
function rdHasTrack(id) { return rdKeys(id).length > 0; }

function rdYears() {
  const ys = new Set();
  for (const id in state.rendimientos.data) {
    for (const k in state.rendimientos.data[id]) ys.add(+k.slice(0, 4));
  }
  if (!ys.size) ys.add(new Date().getFullYear());
  return [...ys].sort((a, b) => a - b);
}
function rdLastYear() {
  const ys = rdYears();
  return ys[ys.length - 1];
}

// Compone los meses de un año: (1+r1)(1+r2)... - 1
function rdAnual(id, year) {
  const s = rdSerie(id);
  let p = 1, n = 0;
  for (let m = 1; m <= 12; m++) {
    const v = s[`${year}-${String(m).padStart(2, '0')}`];
    if (v === undefined || v === null || v === '') continue;
    p *= (1 + v / 100); n++;
  }
  return n ? { ret: (p - 1) * 100, meses: n } : null;
}

function rdAcum(id) {
  const s = rdSerie(id), ks = rdKeys(id);
  if (!ks.length) return null;
  let p = 1;
  ks.forEach(k => p *= (1 + s[k] / 100));
  const ret = (p - 1) * 100;
  const ann = (Math.pow(p, 12 / ks.length) - 1) * 100;
  return { ret, ann, n: ks.length, desde: ks[0], hasta: ks[ks.length - 1] };
}

function saveRendimientos() {
  const payload = state.rendimientos.data;
  try { localStorage.setItem("sc-rendimientos", JSON.stringify(payload)); }
  catch (e) { console.warn(e); }
  if (state.fb.ready && window.SC_FB) {
    setFbStatus('syncing');
    if (state.fb.savingTimer) clearTimeout(state.fb.savingTimer);
    state.fb.savingTimer = setTimeout(async () => {
      try {
        const { db, doc, setDoc } = window.SC_FB;
        await setDoc(doc(db, "silvercloud", "rendimientos"), { data: payload, updatedAt: Date.now() });
        setFbStatus('online');
      } catch (e) {
        console.warn('Save rendimientos error:', e);
        setFbStatus('offline');
      }
      state.fb.savingTimer = null;
    }, 600);
  }
}

// Guardrails: rango raro → confirma. Pisar un mes ya cargado → confirma.
function rdSet(id, ym, raw, el) {
  const s = state.rendimientos.data[id] || (state.rendimientos.data[id] = {});
  const prev = s[ym];
  const txt = String(raw).trim().replace(',', '.');

  if (txt === '') {
    if (prev !== undefined) {
      if (!confirm(`¿Borrar el rendimiento de ${ym}?\n\nValor actual: ${prev}%`)) { renderRendimientosInto(); return; }
      delete s[ym];
      saveRendimientos();
    }
    renderRendimientosInto();
    return;
  }

  const v = parseFloat(txt);
  if (isNaN(v)) { alert('Valor inválido. Poné un número, por ejemplo 2.5 (= +2,5%).'); renderRendimientosInto(); return; }

  if (Math.abs(v) > 60) {
    if (!confirm(`⚠ ${v}% es un rendimiento mensual muy grande.\n\n¿Seguro que no quisiste poner ${(v / 100).toFixed(2)}%?\n\nAceptar = guardar ${v}%`)) { renderRendimientosInto(); return; }
  }
  if (prev !== undefined && Math.abs(prev - v) > 0.0001) {
    if (!confirm(`Este mes ya tenía un valor cargado.\n\n${ym}:  ${prev}%  →  ${v}%\n\n¿Confirmás el cambio?`)) { renderRendimientosInto(); return; }
  }

  s[ym] = Math.round(v * 10000) / 10000;
  saveRendimientos();
  renderRendimientosInto();
}

function rdSetYear(y) { state.rendimientos.year = +y; renderRendimientosInto(); }

function rdCls(v) { return v > 0.0001 ? 'rd-pos' : v < -0.0001 ? 'rd-neg' : 'rd-zero'; }
function rdPct(v, d) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  d = (d === undefined) ? (Math.abs(v) >= 100 ? 0 : 1) : d;
  return (v > 0 ? '+' : '') + v.toFixed(d) + '%';
}

function renderRendimientos() {
  const year = state.rendimientos.year || rdLastYear();
  const years = rdYears();
  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth() + 1;

  const yearBtns = years.map(y =>
    `<button class="rd-yr ${y === year ? 'active' : ''}" onclick="rdSetYear(${y})">${y}</button>`
  ).join('');

  // ── Grilla editable: carteras × meses del año elegido ──
  const rows = ORDER.map(id => {
    const t = state.templates[id];
    const label = id.startsWith('rt-') ? `RT · ${(t.label.split('·')[1] || '').trim()}` : `${t.moneda} · ${t.perfil}`;
    const cells = RD_MESES.map((_, i) => {
      const m = i + 1;
      const ym = `${year}-${String(m).padStart(2, '0')}`;
      const v = rdSerie(id)[ym];
      const future = (year > curY) || (year === curY && m > curM);
      const has = v !== undefined && v !== null;
      return `<td class="rd-cell ${future ? 'rd-future' : ''} ${has ? rdCls(v) : ''}">
        <input type="text" inputmode="decimal" value="${has ? v : ''}" placeholder="${future ? '' : '·'}"
          ${future ? 'disabled' : ''}
          onchange="rdSet('${id}','${ym}', this.value, this)"
          onfocus="this.select()">
      </td>`;
    }).join('');
    const a = rdAnual(id, year);
    const partial = a && a.meses < 12;
    return `<tr>
      <td class="rd-name">${label}</td>
      ${cells}
      <td class="rd-year ${a ? rdCls(a.ret) : ''}">${a ? rdPct(a.ret) : '—'}${partial ? `<span class="rd-n">${a.meses}m</span>` : ''}</td>
    </tr>`;
  }).join('');

  // ── Resumen: retorno por año + acumulado ──
  const sumHead = years.map(y => `<th>${y}</th>`).join('');
  const sumRows = ORDER.map(id => {
    const t = state.templates[id];
    const label = id.startsWith('rt-') ? `RT · ${(t.label.split('·')[1] || '').trim()}` : `${t.moneda} · ${t.perfil}`;
    if (!rdHasTrack(id)) {
      return `<tr><td class="rd-name">${label}</td><td colspan="${years.length + 2}" class="rd-empty-row">Sin track record cargado</td></tr>`;
    }
    const cells = years.map(y => {
      const a = rdAnual(id, y);
      if (!a) return `<td class="rd-zero">—</td>`;
      const partial = a.meses < 12;
      return `<td class="${rdCls(a.ret)}">${rdPct(a.ret)}${partial ? `<span class="rd-n">${a.meses}m</span>` : ''}</td>`;
    }).join('');
    const ac = rdAcum(id);
    return `<tr>
      <td class="rd-name">${label}</td>
      ${cells}
      <td class="rd-acum ${rdCls(ac.ret)}">${rdPct(ac.ret, 0)}</td>
      <td class="rd-acum ${rdCls(ac.ann)}">${rdPct(ac.ann, 1)}</td>
    </tr>`;
  }).join('');

  const conTrack = ORDER.filter(rdHasTrack).length;

  return `
  <div class="overview-section">
    <h3>📊 Rendimientos · track record de las carteras modelo</h3>
    <p class="sg-help">Cargá el rendimiento del mes que cerró y se recalcula todo solo: el retorno anual, el YTD, el acumulado y el factsheet. Los valores van en <strong>%</strong> (poné <strong>2.5</strong> para +2,5%, <strong>-1.2</strong> para -1,2%). Se guarda en Firestore al salir de la celda: <strong>no hace falta tocar ningún archivo ni subir nada a GitHub</strong>.</p>

    <div class="rd-bar">
      <div class="rd-years">${yearBtns}</div>
      <div class="rd-meta">${conTrack} de ${ORDER.length} carteras con track record</div>
    </div>

    <div class="rd-scroll">
      <table class="rd-table">
        <thead>
          <tr>
            <th class="rd-name">Cartera</th>
            ${RD_MESES.map(m => `<th>${m}</th>`).join('')}
            <th class="rd-year-h">${year}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>

  <div class="overview-section">
    <h3>Resumen histórico</h3>
    <div class="rd-scroll">
      <table class="rd-table rd-sum">
        <thead>
          <tr>
            <th class="rd-name">Cartera</th>
            ${sumHead}
            <th class="rd-year-h">Acumulado</th>
            <th class="rd-year-h">Anualizado</th>
          </tr>
        </thead>
        <tbody>${sumRows}</tbody>
      </table>
    </div>
    <p class="sg-help" style="margin-top:14px">Los años con menos de 12 meses cargados muestran cuántos meses incluyen (ej. <strong>6m</strong>). El año en curso es el YTD. El acumulado y el anualizado se calculan sobre todos los meses cargados de cada cartera.</p>
  </div>
  `;
}

function renderRendimientosInto() {
  const content = document.getElementById('content');
  if (content) content.innerHTML = renderRendimientos();
}

// ===================== /RENDIMIENTOS =====================

function renderTabs() {
  const tabsHtml = [
    `<button class="main-tab ${state.current === 'overview' ? 'active' : ''}" onclick="selectTab('overview')">⊞ Overview</button>`,
    `<button class="main-tab ${state.current === 'seguimiento' ? 'active' : ''}" onclick="selectTab('seguimiento')">📈 Seguimiento</button>`,
    `<button class="main-tab ${state.current === 'rendimientos' ? 'active' : ''}" onclick="selectTab('rendimientos')">📊 Rendimientos</button>`,
    ...ORDER.map(id => {
      const t = state.templates[id];
      const edited = isEdited(id);
      let tabLabel;
      if (id.startsWith('rt-')) {
        const suffix = (t.label.split('·')[1] || '').trim();
        tabLabel = `RT · ${suffix}`;
      } else {
        tabLabel = `${t.moneda} · ${t.perfil}`;
      }
      return `<button class="main-tab ${state.current === id ? 'active' : ''}" onclick="selectTab('${id}')">
        ${tabLabel}${edited ? ' <span class="edit-dot">●</span>' : ''}
      </button>`;
    }),
    `<button class="main-tab ${state.current === 'tacticas' ? 'active' : ''}" onclick="selectTab('tacticas')">⚡ Tácticas</button>`,
    `<button class="main-tab ${state.current === 'clientes' ? 'active' : ''}" onclick="selectTab('clientes')">👥 Clientes</button>`
  ].join("");
  document.getElementById("main-tabs").innerHTML = tabsHtml;
}

function selectTab(tab) {
  state.current = tab;
  state.modal = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (tab === 'tacticas' && state.tacticasPrices.status === 'idle') {
    fetchTacticasPrices();
  }
  if (tab === 'seguimiento' && state.seguimiento.iol.status === 'idle') {
    fetchSeguimientoPrices();
  }
}

function render() {
  renderTabs();
  const content = document.getElementById("content");
  if (state.current === "overview") content.innerHTML = renderOverview();
  else if (state.current === "seguimiento") content.innerHTML = renderSeguimiento();
  else if (state.current === "rendimientos") content.innerHTML = renderRendimientos();
  else if (state.current === "tacticas") content.innerHTML = renderTacticas();
  else if (state.current === "clientes") content.innerHTML = renderClientes();
  else content.innerHTML = renderPortfolio(state.current);
  renderModal();
}

loadState();
render();
setInterval(() => {
  if (state.current === 'tacticas' && (state.tacticasPicks.ar.length + state.tacticasPicks.cedears.length) > 0) {
    fetchTacticasPrices();
  }
  if (state.current === 'seguimiento') {
    fetchSeguimientoPrices();
  }
}, 60000);
</script>
