<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SilverCloud Advisors — Carteras Modelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* DARK THEME con paleta SilverCloud */
    --bg: #0d1117;
    --bg-soft: #161b22;
    --bg-card: #1a2030;
    --bg-card-2: #1c2330;
    --border: #2a3343;
    --border-soft: #1e2533;
    --text: #d8dee9;
    --text-bright: #f0f6fc;
    --text-dim: #8b95a8;
    --text-light: #6b748a;

    /* Colores institucionales adaptados a dark */
    --navy: #5b86c7;        /* navy original aclarado para legibilidad */
    --navy-deep: #243656;   /* original para acentos / fondos */
    --violet: #a37bc7;      /* violet original aclarado */
    --violet-deep: #3F2854;
    --gray-light: #B5C1CC;
    --gray-inst: #5E666F;

    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;

    /* Paleta de bloques (más saturada para dark) */
    --b-liquidez: #8b95a8;
    --b-lecap: #3fb950;
    --b-dual: #56d4dd;
    --b-cer-corto: #d29922;
    --b-cer-largo: #b07418;
    --b-hd: #5b86c7;
    --b-bopreal: #a37bc7;
    --b-on-usd: #79c0ff;
    --b-treasury: #7ee787;
    --b-fci-usd: #4a9eff;
    --b-equity-usa: #d2a8ff;
    --b-equity-ar: #ff7b72;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Open Sans', sans-serif;
    font-weight: 300;
    font-size: 14px;
    line-height: 1.6;
    padding: 24px;
  }

  .container { max-width: 1200px; margin: 0 auto; }

  /* BACK LINK */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Open Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    text-decoration: none;
    margin-bottom: 16px;
    transition: color 0.15s;
    font-weight: 400;
  }
  .back-link:hover { color: var(--navy); }

  .header {
    border-bottom: 2px solid var(--navy);
    padding-bottom: 20px;
    margin-bottom: 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header-brand h1 {
    margin: 0;
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 26px;
    color: var(--text-bright);
  }
  .header-brand h1 strong {
    color: var(--navy);
    font-weight: 700;
  }
  .header-brand .brand-line {
    font-weight: 300;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    font-family: 'Open Sans', sans-serif;
    font-weight: 400;
    font-size: 11px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .btn:hover { background: var(--navy); color: white; border-color: var(--navy); }
  .btn-warn:hover { background: var(--yellow); border-color: var(--yellow); color: #1a1a1a; }
  .btn-danger:hover { background: var(--red); border-color: var(--red); color: white; }

  .main-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .main-tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    padding: 12px 18px;
    font-family: 'Open Sans', sans-serif;
    font-weight: 400;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
    margin-bottom: -1px;
  }
  .main-tab:hover { color: var(--text-bright); }
  .main-tab.active {
    color: var(--navy);
    border-bottom-color: var(--navy);
    font-weight: 600;
  }
  .main-tab .edit-dot {
    color: var(--violet);
    margin-left: 6px;
    font-size: 10px;
  }

  /* OVERVIEW */
  .overview-section { margin-bottom: 32px; }
  .overview-section h3 {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    color: var(--text-bright);
    font-size: 18px;
    font-weight: 400;
    margin: 0 0 18px 0;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .moneda-pill {
    font-style: normal;
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 2px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .moneda-pill.ars { background: var(--violet); color: var(--bg); }
  .moneda-pill.usd { background: var(--navy); color: white; }

  .overview-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 28px;
  }
  @media (max-width: 800px) { .overview-grid { grid-template-columns: 1fr; } }
  .overview-column { display: flex; flex-direction: column; gap: 20px; }

  .overview-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .overview-card:hover {
    border-color: var(--navy);
    background: var(--bg-card-2);
    box-shadow: 0 4px 16px rgba(91, 134, 199, 0.15);
    transform: translateY(-2px);
  }
  .overview-card svg { width: 100%; max-width: 200px; height: auto; margin: 0 auto; display: block; }
  .overview-card .perfil {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .overview-card .nombre {
    font-family: 'Libre Baskerville', serif;
    font-size: 16px;
    color: var(--text-bright);
    font-weight: 400;
    margin-bottom: 14px;
  }

  .legend {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
  }
  .legend-item { display: flex; align-items: center; gap: 10px; font-size: 11px; }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-val { color: var(--text-bright); font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px;
    margin-bottom: 16px;
  }

  .portfolio-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .portfolio-title { flex: 1; min-width: 280px; }
  .portfolio-title h2 {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    margin: 10px 0 0 0;
    font-size: 22px;
    color: var(--text-bright);
    font-weight: 400;
  }
  .portfolio-title .description {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 8px;
    max-width: 600px;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-right: 6px;
    text-transform: uppercase;
  }
  .badge-pesos { background: var(--violet); color: var(--bg); }
  .badge-usd { background: var(--navy); color: white; }
  .badge-conservador { background: var(--gray-light); color: #1a1a1a; }
  .badge-moderado { background: var(--yellow); color: var(--bg); }
  .badge-agresivo { background: var(--red); color: white; }
  .badge-edited { background: transparent; color: var(--violet); border: 1px solid var(--violet); margin-left: 6px; }

  .portfolio-actions { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }

  .main-grid {
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
    gap: 28px;
    margin-bottom: 20px;
  }
  @media (max-width: 800px) { .main-grid { grid-template-columns: 1fr; } }

  .donut-wrapper { display: flex; flex-direction: column; align-items: center; }
  .donut-wrapper svg { width: 100%; max-width: 320px; height: auto; }

  .meta-line { margin-top: 14px; text-align: center; font-size: 11px; color: var(--text-dim); line-height: 1.8; }
  .meta-line strong { color: var(--text-bright); font-weight: 600; }

  table.bloques { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.bloques thead th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 6px;
    border-bottom: 1px solid var(--border);
  }
  table.bloques thead th.right { text-align: right; }
  table.bloques td {
    padding: 10px 6px;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: middle;
  }
  table.bloques td.right { text-align: right; font-variant-numeric: tabular-nums; }

  .block-row { cursor: default; }
  .block-row.expandable .block-info { cursor: pointer; }
  .block-row.expandable .block-info:hover .block-name { color: var(--violet); }

  .block-toggle {
    display: inline-block;
    width: 14px;
    color: var(--text-light);
    font-size: 10px;
    transition: transform 0.15s;
    margin-right: 4px;
  }
  .block-toggle.open { transform: rotate(90deg); color: var(--navy); }

  .block-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 10px;
    vertical-align: middle;
  }
  .block-name { color: var(--text-bright); font-weight: 600; font-size: 13px; transition: color 0.15s; }
  .block-desc { color: var(--text-dim); font-size: 11px; margin-top: 3px; font-weight: 300; padding-left: 24px; }

  .activos-row { background: var(--bg-soft); }
  .activos-row td {
    padding: 0 !important;
    border-bottom: 1px solid var(--border) !important;
  }
  .activos-wrapper { padding: 16px 20px; }
  .activos-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .activos-header h4 {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    color: var(--text-bright);
    margin: 0;
    font-size: 14px;
    font-weight: 400;
  }
  .activos-meta {
    font-size: 10px;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .activos-meta.loading { color: var(--yellow); }
  .activos-meta.error { color: var(--red); }
  .activos-meta.ok { color: var(--green); }

  table.activos {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.activos thead th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
  }
  table.activos thead th.right { text-align: right; }
  table.activos tbody td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--bg-card);
  }
  table.activos tbody td.right { text-align: right; font-variant-numeric: tabular-nums; }
  table.activos tbody tr:hover td { background: var(--bg-card-2); }

  .ticker {
    color: var(--navy);
    font-weight: 600;
    font-family: 'Open Sans', sans-serif;
    font-size: 12px;
  }
  .var-pos { color: var(--green); font-weight: 600; }
  .var-neg { color: var(--red); font-weight: 600; }
  .var-zero { color: var(--text-dim); }

  .fci-card {
    padding: 10px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 2px;
    margin-bottom: 6px;
  }
  .fci-card .fci-name {
    color: var(--text-bright);
    font-weight: 600;
    font-size: 12px;
    margin-bottom: 3px;
  }
  .fci-card .fci-meta {
    color: var(--text-dim);
    font-size: 10px;
  }
  .fci-card .fci-objetivo {
    color: var(--text);
    font-size: 11px;
    margin-top: 4px;
    font-style: italic;
  }

  .pct-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: 'Open Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-align: right;
    padding: 5px 10px;
    width: 70px;
    border-radius: 2px;
    transition: all 0.15s;
    font-variant-numeric: tabular-nums;
  }
  .pct-input:hover { border-color: var(--text-dim); }
  .pct-input:focus { outline: none; border-color: var(--navy); background: var(--bg-card-2); box-shadow: 0 0 0 2px rgba(91, 134, 199, 0.15); }
  .pct-suffix { color: var(--text-dim); font-size: 12px; margin-left: 3px; }

  .btn-remove {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-light);
    width: 24px; height: 24px;
    cursor: pointer;
    border-radius: 2px;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    transition: all 0.15s;
    margin-left: 8px;
  }
  .btn-remove:hover { border-color: var(--red); color: var(--red); background: rgba(248, 81, 73, 0.1); }

  tr.add-row td {
    border-bottom: none;
    padding: 14px 6px 4px 6px;
  }
  .add-block-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: var(--bg-soft);
    border: 1px dashed var(--border);
    border-radius: 2px;
  }
  .add-block-select {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    font-size: 12px;
    border-radius: 2px;
    cursor: pointer;
    font-family: inherit;
  }
  .add-block-select:focus { outline: none; border-color: var(--navy); }

  tr.total-row td {
    border-top: 2px solid var(--navy);
    border-bottom: none;
    padding-top: 14px;
  }
  .total-value {
    font-family: 'Libre Baskerville', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text-bright);
  }
  .total-value.error { color: var(--red); }
  .total-value.warning { color: var(--yellow); }
  .total-value.ok { color: var(--green); }
  .total-status {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .total-status.error { color: var(--red); }
  .total-status.warning { color: var(--yellow); }
  .total-status.ok { color: var(--green); }

  .editor-help {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-left: 3px solid var(--navy);
    border-radius: 0 2px 2px 0;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 14px;
    line-height: 1.7;
  }
  .editor-help kbd {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2px 6px;
    font-size: 10px;
    color: var(--navy);
    font-weight: 600;
  }

  .footer-note {
    color: var(--text-light);
    font-size: 10px;
    text-align: center;
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .footer-note .firm-name {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    color: var(--navy);
    font-size: 11px;
  }

  .price-status {
    font-size: 10px;
    padding: 5px 10px;
    border-radius: 2px;
    background: var(--bg-soft);
    color: var(--text-dim);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
  }
  .price-status.live { color: var(--green); border-color: var(--green); }
  .price-status.cached { color: var(--yellow); border-color: var(--yellow); }
  .price-status.error { color: var(--red); border-color: var(--red); }
</style>
</head>

</div>

let state = {
  current: "overview",
  templates: {},
  expanded: {},
  prices: {},
  pricesUpdated: null,
  pricesLoading: false,
};

function loadState() {
  try {
    const saved = localStorage.getItem("sc-carteras-modelo");
    if (saved) {
      state.templates = JSON.parse(saved);
      for (const id in TEMPLATES_BASE) {
        if (!state.templates[id]) {
          state.templates[id] = JSON.parse(JSON.stringify(TEMPLATES_BASE[id]));
        } else {
          for (const k of ["label","perfil","moneda","badges","title","description","horizon","drawdown","target"]) {
            if (state.templates[id][k] === undefined) state.templates[id][k] = TEMPLATES_BASE[id][k];
          }
        }
      }
      return;
    }
  } catch (e) { console.warn(e); }
  state.templates = JSON.parse(JSON.stringify(TEMPLATES_BASE));
}

function saveState() {
  try { localStorage.setItem("sc-carteras-modelo", JSON.stringify(state.templates)); }
  catch (e) { console.warn(e); }
}

function isEdited(id) {
  const current = state.templates[id]?.blocks || {};
  const base = TEMPLATES_BASE[id]?.blocks || {};
  if (Object.keys(current).length !== Object.keys(base).length) return true;
  for (const k in current) if (current[k] !== base[k]) return true;
  for (const k in base) if (current[k] === undefined) return true;
  return false;
}

function resetPortfolio(id) {
  if (!confirm(`¿Resetear "${TEMPLATES_BASE[id].label}" al template original?`)) return;
  state.templates[id] = JSON.parse(JSON.stringify(TEMPLATES_BASE[id]));
  saveState(); render();
}

function resetAll() {
  if (!confirm("¿Resetear las 6 carteras al template original?")) return;
  state.templates = JSON.parse(JSON.stringify(TEMPLATES_BASE));
  saveState(); render();
}

function exportAllJSON() {
  const blob = new Blob([JSON.stringify(state.templates, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `silvercloud-carteras-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm("¿Reemplazar las carteras actuales?")) return;
      state.templates = data;
      saveState(); render();
    } catch (err) { alert("Error: " + err.message); }
  };
  reader.readAsText(file);
  event.target.value = "";
}

async function fetchTicker(simbolo, mercado = "bCBA") {
  const url = `${PROXY_URL}?action=cotizacion&simbolo=${simbolo}&mercado=${mercado}`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } catch (e) {
    console.warn("Error fetching", simbolo, e);
    return null;
  }
}

async function refreshAllPrices() {
  if (state.pricesLoading) return;
  state.pricesLoading = true;
  updatePriceStatus("loading", "Cargando precios...");

  const tickers = new Set();
  for (const blockKey in CATALOGO) {
    const cat = CATALOGO[blockKey];
    if (cat.type === "bonos" || cat.type === "acciones" || cat.type === "cedears") {
      (cat.tickers || []).forEach(t => tickers.add(t));
    }
  }

  const list = [...tickers];
  const results = {};
  let okCount = 0, errCount = 0;

  const BATCH = 6;
  for (let i = 0; i < list.length; i += BATCH) {
    const slice = list.slice(i, i + BATCH);
    const promises = slice.map(t => fetchTicker(t).then(d => ({ ticker: t, data: d })));
    const batch = await Promise.all(promises);
    batch.forEach(({ ticker, data }) => {
      if (data && (data.ultimoPrecio !== undefined || data.precio !== undefined)) {
        results[ticker] = data;
        okCount++;
      } else {
        errCount++;
      }
    });
    if (i + BATCH < list.length) await new Promise(r => setTimeout(r, 300));
  }

  state.prices = results;
  state.pricesUpdated = new Date();
  state.pricesLoading = false;

  if (okCount === 0) {
    updatePriceStatus("error", "Error al cargar precios");
  } else if (errCount > 0) {
    updatePriceStatus("cached", `${okCount}/${list.length} OK · ${new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'})}`);
  } else {
    updatePriceStatus("live", `Live · ${new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'})}`);
  }

  if (state.current !== "overview") render();
}

function updatePriceStatus(type, msg) {
  const el = document.getElementById("price-status");
  if (!el) return;
  el.className = "price-status " + (type === "loading" ? "" : type);
  el.textContent = "Precios: " + msg;
}

function fmtNum(n, dec = 2) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString("es-AR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function fmtVar(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const cls = n > 0 ? "var-pos" : (n < 0 ? "var-neg" : "var-zero");
  const sign = n > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${fmtNum(n, 2)}%</span>`;
}

function buildDonut(blocks, opts = {}) {
  const { size = 320, showCenter = true } = opts;
  const entries = Object.entries(blocks).filter(([k, v]) => Number(v) > 0);
  const total = entries.reduce((s, [, v]) => s + Number(v), 0);

  const cx = size/2, cy = size/2;
  const rOut = size * 0.41;
  const rIn = size * 0.25;

  if (total === 0) {
    return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
      <circle cx="${cx}" cy="${cy}" r="${rOut}" fill="none" stroke="#2a3343" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="11" fill="#6b748a">SIN DATOS</text>
    </svg>`;
  }

  let acc = -90;
  const paths = entries.map(([key, val]) => {
    const sweep = (Number(val) / total) * 360;
    const start = acc, end = acc + sweep;
    acc = end;
    const r1 = (start * Math.PI) / 180, r2 = (end * Math.PI) / 180;
    const x1 = cx + rOut * Math.cos(r1), y1 = cy + rOut * Math.sin(r1);
    const x2 = cx + rOut * Math.cos(r2), y2 = cy + rOut * Math.sin(r2);
    const x3 = cx + rIn * Math.cos(r2), y3 = cy + rIn * Math.sin(r2);
    const x4 = cx + rIn * Math.cos(r1), y4 = cy + rIn * Math.sin(r1);
    const largeArc = sweep > 180 ? 1 : 0;
    const color = BLOCKS[key]?.color || "#888";
    if (entries.length === 1) {
      return `<path d="M ${cx},${cy-rOut} A ${rOut},${rOut} 0 1,1 ${cx-0.01},${cy-rOut} L ${cx-0.01},${cy-rIn} A ${rIn},${rIn} 0 1,0 ${cx},${cy-rIn} Z" fill="${color}"/>`;
    }
    return `<path d="M ${x1.toFixed(2)},${y1.toFixed(2)} A ${rOut},${rOut} 0 ${largeArc},1 ${x2.toFixed(2)},${y2.toFixed(2)} L ${x3.toFixed(2)},${y3.toFixed(2)} A ${rIn},${rIn} 0 ${largeArc},0 ${x4.toFixed(2)},${y4.toFixed(2)} Z" fill="${color}"/>`;
  });

  const totalColor = Math.abs(total - 100) < 0.01 ? "#3fb950" : (total > 100 ? "#f85149" : "#d29922");
  let center = "";
  if (showCenter) {
    center = `
      <circle cx="${cx}" cy="${cy}" r="${rIn - 2}" fill="var(--bg-card)"/>
      <text x="${cx}" y="${cy - 8}" text-anchor="middle" font-size="${size*0.034}" fill="#8b95a8" style="letter-spacing: 1px;">TOTAL</text>
      <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="${size*0.075}" font-weight="700" fill="${totalColor}" style="font-family: 'Libre Baskerville', serif;">${total.toFixed(1)}%</text>
    `;
  }

  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${paths.join('')}${center}</svg>`;
}

function buildLegend(blocks) {
  const blockOrder = Object.keys(BLOCKS);
  const items = blockOrder
    .filter(k => blocks[k] !== undefined && Number(blocks[k]) > 0)
    .sort((a, b) => Number(blocks[b]) - Number(blocks[a]))
    .map(k => {
      const def = BLOCKS[k];
      return `<div class="legend-item">
        <span class="legend-dot" style="background: ${def.color};"></span>
        <span class="legend-name">${def.name}</span>
        <span class="legend-val">${Number(blocks[k])}%</span>
      </div>`;
    }).join("");
  return `<div class="legend">${items}</div>`;
}

function renderOverviewCard(id) {

      <div class="overview-column">${arsCards}</div>

function renderActivosBloque(blockKey) {
  const cat = CATALOGO[blockKey];
  if (!cat) return `<div class="activos-wrapper"><div style="color:var(--text-dim);font-size:12px;">No hay activos definidos para este bloque.</div></div>`;

  if (cat.type === "fci") {
    if (!cat.items || cat.items.length === 0) {
      return `<div class="activos-wrapper"><div style="color:var(--text-dim);font-size:12px;">No hay FCIs cargados aún. Pasame los nombres y los agrego al catálogo.</div></div>`;
    }
    const cards = cat.items.map(f => `
      <div class="fci-card">
        <div class="fci-name">${f.name}</div>
        <div class="fci-meta">${f.sociedad} · ${f.moneda} · Liquidez ${f.liquidez}</div>
        <div class="fci-objetivo">${f.objetivo}</div>
      </div>
    `).join("");
    return `<div class="activos-wrapper">
      <div class="activos-header">
        <h4>FCIs disponibles</h4>
        <span class="activos-meta">${cat.items.length} fondo${cat.items.length === 1 ? '' : 's'}</span>
      </div>
      ${cards}
    </div>`;
  }

  if (!cat.tickers || cat.tickers.length === 0) {
    return `<div class="activos-wrapper"><div style="color:var(--text-dim);font-size:12px;">No hay tickers cargados aún. Pasame las listas y los agrego al catálogo.</div></div>`;
  }

  const hasPrices = Object.keys(state.prices).length > 0;
  const isPesos = ["lecap", "dual", "cerCorto", "cerLargo", "equityAr"].includes(blockKey);
  const cur = isPesos ? "$" : "USD ";

  const rows = cat.tickers.map(t => {
    const p = state.prices[t];
    if (!p) {
      return `<tr>
        <td><span class="ticker">${t}</span></td>
        <td class="right" colspan="4" style="color: var(--text-light); font-size: 11px;">${hasPrices ? 'Sin datos' : 'Pendiente carga'}</td>
      </tr>`;
    }
    const last = p.ultimoPrecio ?? p.precio ?? null;
    const variacion = p.variacion ?? p.variacionPorcentual ?? null;
    const volumen = p.volumen ?? p.volumenNominal ?? null;
    const apertura = p.apertura ?? null;
    return `<tr>
      <td><span class="ticker">${t}</span></td>
      <td class="right">${last !== null ? cur + fmtNum(last) : '—'}</td>
      <td class="right">${fmtVar(variacion)}</td>
      <td class="right" style="color: var(--text-dim); font-size: 11px;">${volumen ? fmtNum(volumen, 0) : '—'}</td>
      <td class="right" style="color: var(--text-dim); font-size: 11px;">${apertura !== null ? cur + fmtNum(apertura) : '—'}</td>
    </tr>`;
  }).join("");

  const statusMsg = hasPrices
    ? (state.pricesUpdated ? `Última: ${state.pricesUpdated.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'})}` : 'En cache')
    : 'Click "↻ Actualizar precios" arriba';

  return `<div class="activos-wrapper">
    <div class="activos-header">
      <h4>${cat.tickers.length} activo${cat.tickers.length === 1 ? '' : 's'} disponibles</h4>
      <span class="activos-meta ${hasPrices ? 'ok' : ''}">${statusMsg}</span>
    </div>
    <table class="activos">
      <thead>
        <tr>
          <th>Ticker</th>
          <th class="right">Último</th>
          <th class="right">Var %</th>
          <th class="right">Volumen</th>
          <th class="right">Apertura</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function buildTable(id) {
  const t = state.templates[id];
  const blocks = t.blocks;
  const blockOrder = Object.keys(BLOCKS);

  const rows = blockOrder
    .filter(k => blocks[k] !== undefined)
    .map(k => {
      const def = BLOCKS[k];
      const val = blocks[k] ?? 0;
      const expandKey = `${id}:${k}`;
      const isExpanded = state.expanded[expandKey];
      const cat = CATALOGO[k];
      const hasActivos = cat && ((cat.type === "fci" && cat.items?.length > 0) || (cat.tickers?.length > 0));
      const expandable = hasActivos;

      const blockRow = `
        <tr class="block-row ${expandable ? 'expandable' : ''}">
          <td>
            <div class="block-info" ${expandable ? `onclick="toggleBlock('${id}', '${k}')"` : ''}>
              ${expandable ? `<span class="block-toggle ${isExpanded ? 'open' : ''}">▶</span>` : '<span class="block-toggle"> </span>'}
              <span class="block-dot" style="background: ${def.color};"></span>
              <span class="block-name">${def.name}</span>
            </div>
            <div class="block-desc">${def.desc}</div>
          </td>
          <td class="right">
            <input type="number" class="pct-input"
                   value="${val}"
                   min="0" max="100" step="0.5"
                   onchange="updateBlock('${id}', '${k}', this.value)"
                   onkeydown="if(event.key==='Enter')this.blur();">
            <span class="pct-suffix">%</span>
            <button class="btn-remove" onclick="removeBlock('${id}', '${k}')" title="Quitar bloque">×</button>
          </td>
        </tr>
      `;

      const activosRow = isExpanded
        ? `<tr class="activos-row"><td colspan="2">${renderActivosBloque(k)}</td></tr>`
        : '';

      return blockRow + activosRow;
    }).join("");

  const availableBlocks = blockOrder.filter(k => blocks[k] === undefined);
  let addRow = "";
  if (availableBlocks.length > 0) {
    const options = availableBlocks.map(k => `<option value="${k}">${BLOCKS[k].name}</option>`).join("");
    addRow = `<tr class="add-row"><td colspan="2">
      <div class="add-block-wrapper">
        <select class="add-block-select" id="add-select-${id}">
          <option value="">+ Agregar bloque...</option>${options}
        </select>
        <button class="btn" onclick="addBlock('${id}')">Agregar</button>
      </div>
    </td></tr>`;
  }

  const total = Object.values(blocks).reduce((s, v) => s + (Number(v) || 0), 0);
  const totalStatus = Math.abs(total - 100) < 0.01
    ? { cls: "ok", msg: "✓ Cartera balanceada" }
    : total > 100 ? { cls: "error", msg: `Excede ${(total - 100).toFixed(1)}%` }
    : { cls: "warning", msg: `Falta ${(100 - total).toFixed(1)}%` };

  return `<table class="bloques">
    <thead><tr><th>Bloque</th><th class="right">Ponderación</th></tr></thead>
    <tbody>
      ${rows}
      ${addRow}
      <tr class="total-row">
        <td>
          <strong style="color: var(--text-bright); font-family: 'Libre Baskerville', serif; font-size: 14px; letter-spacing: 1px;">TOTAL</strong>
          <div class="total-status ${totalStatus.cls}">${totalStatus.msg}</div>
        </td>
        <td class="right"><span class="total-value ${totalStatus.cls}">${total.toFixed(1)}%</span></td>
      </tr>
    </tbody>
  </table>
  <div class="editor-help">
    Click en <kbd>%</kbd> para editar · <kbd>▶</kbd> al lado del nombre del bloque expande la lista de activos · <kbd>×</kbd> quita el bloque
  </div>`;
}

function toggleBlock(id, blockKey) {
  const key = `${id}:${blockKey}`;
  state.expanded[key] = !state.expanded[key];
  render();
}

function updateBlock(id, blockKey, value) {
  const num = parseFloat(value);
  if (isNaN(num) || num < 0) return;
  state.templates[id].blocks[blockKey] = num;
  saveState(); render();
}

function addBlock(id) {
  const select = document.getElementById(`add-select-${id}`);
  const blockKey = select.value;
  if (!blockKey) return;
  state.templates[id].blocks[blockKey] = 0;
  saveState(); render();
}

function removeBlock(id, blockKey) {
  const val = state.templates[id].blocks[blockKey] || 0;
  if (val > 0 && !confirm(`Quitar "${BLOCKS[blockKey].name}" (${val}%)?`)) return;
  delete state.templates[id].blocks[blockKey];
  delete state.expanded[`${id}:${blockKey}`];
  saveState(); render();
}

function renderPortfolio(id) {
  const t = state.templates[id];
  const edited = isEdited(id);
  const editedBadge = edited ? `<span class="badge badge-edited">✎ MODIFICADA</span>` : "";

  return `<div class="card">
    <div class="portfolio-header">
      <div class="portfolio-title">
        <div>
          ${t.badges.map(([cls, txt]) => `<span class="badge ${cls}">${txt}</span>`).join("")}
          ${editedBadge}
        </div>
        <h2>${t.title}</h2>
        <div class="description">${t.description}</div>
      </div>
      <div class="portfolio-actions">
        <button class="btn" onclick="selectTab('overview')">← Overview</button>
        ${edited ? `<button class="btn btn-warn" onclick="resetPortfolio('${id}')">↺ Reset</button>` : ""}
      </div>
    </div>

    <div class="main-grid">
      <div class="donut-wrapper">
        ${buildDonut(t.blocks)}
        <div class="meta-line">
          <strong>Horizonte:</strong> ${t.horizon} ·
          <strong>DD:</strong> ${t.drawdown} ·
          <strong>Target:</strong> ${t.target}
        </div>
      </div>
      <div>${buildTable(id)}</div>
    </div>
  </div>`;
}

function renderTabs() {
  const tabsHtml = [
    `<button class="main-tab ${state.current === 'overview' ? 'active' : ''}" onclick="selectTab('overview')">⊞ Overview</button>`,
    ...ORDER.map(id => {
      const t = state.templates[id];
      const edited = isEdited(id);
      return `<button class="main-tab ${state.current === id ? 'active' : ''}" onclick="selectTab('${id}')">
        ${t.moneda} · ${t.perfil}${edited ? ' <span class="edit-dot">●</span>' : ''}
      </button>`;
    })
  ].join("");
  document.getElementById("main-tabs").innerHTML = tabsHtml;
}

function selectTab(tab) {
  state.current = tab;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  renderTabs();
  const content = document.getElementById("content");
  if (state.current === "overview") {
    content.innerHTML = renderOverview();
  } else {
    content.innerHTML = renderPortfolio(state.current);
  }
}

loadState();
render();
</script>

</body>
</html>
