             <option value="USD" ${r.moneda==='USD'?'selected':''}>USD</option></select></td>
        <td class="cli-r"><input class="cli-inp cli-inp-num" type="text" inputmode="decimal" value="${escCli(montoDisp)}" placeholder="0"
             onchange="updateCliente('${r.id}','monto',this.value)"></td>
        <td class="cli-r cli-usd">${usdCell}</td>
        <td class="cli-c"><button class="cli-estado ${estadoCls}" onclick="toggleEstado('${r.id}')" title="Clic para cambiar">${estado}</button></td>
        <td>${comCell}</td>
        <td class="cli-c"><button class="cli-del" title="Borrar" onclick="deleteCliente('${r.id}')">&#10005;</button></td>
      </tr>${detalle}`;
  };

  // agrupar por perfil de cuenta
  const groups = {};
  rows.forEach(r => { const p = perfilDe(r) || '__none__'; (groups[p] = groups[p] || []).push(r); });
  const gkeys = Object.keys(groups).sort((a, b) => {
    if (a === '__none__') return 1;
    if (b === '__none__') return -1;
    const ia = PERFIL_ORDER.indexOf(a), ib = PERFIL_ORDER.indexOf(b);
    const va = ia === -1 ? 999 : ia, vb = ib === -1 ? 999 : ib;
    if (va !== vb) return va - vb;
    return a.localeCompare(b);
  });

  let filas;
  if (!rows.length) {
    filas = `<tr><td colspan="10" class="cli-empty">Todav&iacute;a no cargaste clientes. Toc&aacute; &ldquo;+ Agregar cliente&rdquo;.</td></tr>`;
  } else {
    filas = gkeys.map(gk => {
      const grp = groups[gk];
      const label = gk === '__none__' ? 'Sin asignar' : gk;
      let subUSD = 0, subPend = 0;
      grp.forEach(r => { const u = clienteUSD(r, fx); if (u == null) subPend++; else subUSD += u; });
      const subTxt = (subPend > 0 && subUSD === 0) ? '&mdash;' : fmtPesos(subUSD, 'USD');
      const head = `<tr class="cli-group-head">
        <td colspan="6"><span class="cli-group-name">${escCli(label)}</span><span class="cli-group-count">${grp.length} cuenta${grp.length === 1 ? '' : 's'}</span></td>
        <td class="cli-r cli-group-sub">${subTxt}</td>
        <td colspan="3"></td>
      </tr>`;
      return head + grp.map(filaHTML).join('');
    }).join('');
  }

  return `
  <style>
    .cli-wrap{max-width:1100px;margin:0 auto;}
    .cli-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px;margin-bottom:18px;}
    .cli-title{font-size:22px;font-weight:700;color:var(--text-bright);}
    .cli-fx{display:flex;flex-direction:column;gap:4px;}
    .cli-fx label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
    .cli-fx input{width:130px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-bright);
      border-radius:8px;padding:8px 10px;font-size:15px;text-align:right;}
    .cli-summary{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
    .cli-aum{font-size:13px;color:var(--text-dim);}
    .cli-aum b{font-size:20px;color:var(--yellow);font-weight:700;margin-left:6px;}
    .cli-aum-meta{color:var(--text-light);font-size:12px;}
    .cli-group-head td{background:var(--bg);border-top:2px solid var(--border);
      border-bottom:1px solid var(--border-soft);padding:12px 8px 8px;}
    .cli-group-name{color:var(--navy);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;}
    .cli-group-count{color:var(--text-light);font-size:11px;margin-left:10px;font-weight:400;}
    .cli-group-sub{color:var(--text-bright);font-weight:700;font-variant-numeric:tabular-nums;}
    .cli-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;}
    .cli-chip{background:var(--bg-card);border:1px solid var(--border);border-radius:999px;
      padding:3px 10px;font-size:12px;color:var(--text);}
    .cli-chip-k{color:var(--text-dim);margin-right:4px;}
    .cli-table{width:100%;border-collapse:collapse;background:var(--bg-card);border:1px solid var(--border);
      border-radius:10px;overflow:hidden;}
    .cli-table th{background:var(--bg-soft);color:var(--text-dim);font-size:11px;text-transform:uppercase;
      letter-spacing:.5px;text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-weight:600;}
    .cli-table td{padding:5px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
    .cli-table tr:last-child td{border-bottom:none;}
    .cli-inp,.cli-sel{width:100%;background:transparent;border:1px solid transparent;color:var(--text-bright);
      border-radius:6px;padding:7px 8px;font-size:14px;font-family:inherit;}
    .cli-inp:hover,.cli-sel:hover{border-color:var(--border);}
    .cli-inp:focus,.cli-sel:focus{outline:none;border-color:var(--navy);background:var(--bg);}
    .cli-sel{cursor:pointer;}
    .cli-sel option{background:var(--bg-card);color:var(--text-bright);}
    .cli-inp-sm{max-width:90px;}
    .cli-sel-sm{max-width:80px;}
    .cli-inp-num{text-align:right;}
    .cli-r{text-align:right;}
    .cli-c{text-align:center;}
    .cli-usd{color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap;}
    .cli-warn{color:var(--yellow);}
    .cli-del{background:transparent;border:none;color:var(--text-light);cursor:pointer;font-size:14px;
      padding:4px 8px;border-radius:6px;}
    .cli-del:hover{color:var(--red);background:var(--bg-soft);}
    .cli-add{margin-top:14px;background:var(--bg-card);border:1px dashed var(--border);color:var(--text);
      border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;width:100%;}
    .cli-add:hover{border-color:var(--navy);color:var(--text-bright);}
    .cli-empty{padding:30px;text-align:center;color:var(--text-dim);font-size:14px;}
    .cli-foot{margin-top:10px;font-size:12px;color:var(--text-light);}
    .cli-name-cell{display:flex;align-items:center;gap:6px;}
    .cli-caret{flex-shrink:0;background:transparent;border:none;color:var(--text-light);cursor:pointer;
      font-size:10px;padding:4px;border-radius:4px;transition:transform .15s,color .15s;line-height:1;}
    .cli-caret:hover{color:var(--navy);}
    .cli-caret.open{transform:rotate(90deg);color:var(--navy);}
    .cli-row-open > td{border-bottom:none;background:var(--bg-soft);}
    .cli-detail-row > td{background:var(--bg-soft);padding:0 8px 14px 8px;border-bottom:1px solid var(--border-soft);}
    .cli-det{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-left:24px;}
    .cli-det-h{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:600;}
    .cli-det-tbl{width:100%;border-collapse:collapse;font-size:13px;}
    .cli-det-tbl th{text-align:left;color:var(--text-light);font-size:10px;text-transform:uppercase;
      letter-spacing:.5px;padding:6px 4px;border-bottom:1px solid var(--border-soft);font-weight:600;}
    .cli-det-tbl td{padding:6px 4px;border-bottom:1px solid var(--border-soft);color:var(--text);}
    .cli-det-cat td{color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:1px;
      font-weight:600;padding-top:12px;background:transparent;}
    .cli-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;}
    .cli-det-m{color:var(--text-bright);font-weight:600;font-variant-numeric:tabular-nums;}
    .cli-det-tot td{border-top:1px solid var(--border);border-bottom:none;padding-top:10px;
      font-weight:700;color:var(--text-bright);}
    .cli-det-warn{color:var(--yellow);font-size:11px;margin-top:10px;line-height:1.5;}
    .cli-det-empty{color:var(--text-dim);font-size:13px;font-style:italic;padding:8px 0 4px 24px;}
    .cli-estado{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:999px;
      padding:4px 11px;font-size:10.5px;font-weight:700;letter-spacing:.4px;cursor:pointer;white-space:nowrap;
      text-transform:uppercase;font-family:inherit;transition:filter .12s;}
    .cli-estado::before{content:"";width:7px;height:7px;border-radius:50%;flex-shrink:0;}
    .cli-estado.ok{background:rgba(63,185,80,.12);color:var(--green);border-color:rgba(63,185,80,.4);}
    .cli-estado.ok::before{background:var(--green);}
    .cli-estado.pend{background:rgba(210,153,34,.13);color:var(--yellow);border-color:rgba(210,153,34,.45);}
    .cli-estado.pend::before{background:var(--yellow);}
    .cli-estado:hover{filter:brightness(1.18);}
    .cli-com{display:inline-flex;align-items:center;background:transparent;border:1px solid var(--border);
      color:var(--text-light);cursor:pointer;border-radius:6px;padding:5px 9px;font-size:13px;line-height:1;
      font-family:inherit;max-width:200px;}
    .cli-com:hover{border-color:var(--navy);color:var(--text-bright);}
    .cli-com.has{border-color:var(--yellow);color:var(--yellow);background:rgba(210,153,34,.08);}
    .cli-com-preview{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      vertical-align:middle;margin-left:7px;font-size:12px;color:var(--text);font-weight:400;}
    .cli-pend-meta{color:var(--yellow);font-size:12px;}
  </style>
  <div class="cli-wrap">
    <div class="cli-head">
      <div class="cli-title">&#128101; Clientes</div>
      <div class="cli-fx">
        <label>D&oacute;lar (ARS&rarr;USD)</label>
        <input type="text" inputmode="decimal" value="${fxDisplay}" placeholder="ej. 1300,00"
          onchange="setClientesFx(this.value)">
      </div>
      <div class="cli-summary">
        <div class="cli-aum">Total administrado <b>${fmtPesos(totalUSD,'USD')}</b><span class="cli-aum-meta"> &middot; ${rows.length} cuenta${rows.length===1?'':'s'}</span>${pendientes>0?` <span class="cli-warn">(${pendientes} sin d&oacute;lar)</span>`:''}</div>
        ${alycChips ? `<div class="cli-chips">${alycChips}</div>` : ''}
        ${pendEstado > 0 ? `<div class="cli-pend-meta">&#9679; ${pendEstado} cuenta${pendEstado===1?'':'s'} pendiente${pendEstado===1?'':'s'} de ajuste</div>` : ''}
      </div>
    </div>

    <table class="cli-table">
      <thead>
        <tr>
          <th>Nombre</th><th>Comitente</th><th>ALyC</th><th>Cartera</th>
          <th>Moneda</th><th class="cli-r">Monto</th><th class="cli-r">En USD</th><th class="cli-c">Estado</th><th>Comentarios</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${filas}
      </tbody>
    </table>

    <button class="cli-add" onclick="addCliente()">+ Agregar cliente</button>
    <div class="cli-foot">Los montos en pesos se convierten a USD con el d&oacute;lar de arriba. El monto se carga en la moneda original de la cuenta.</div>
  </div>`;
}

// ===================== /CLIENTES =====================

function renderTabs() {
  const tabsHtml = [
    `<button class="main-tab ${state.current === 'overview' ? 'active' : ''}" onclick="selectTab('overview')">⊞ Overview</button>`,
    `<button class="main-tab ${state.current === 'seguimiento' ? 'active' : ''}" onclick="selectTab('seguimiento')">📈 Seguimiento</button>`,
    ...ORDER.map(id => {
      const t = state.templates[id];
      const edited = isEdited(id);
      let tabLabel;
      if (id.startsWith('rt-')) {
        const suffix = (t.label.split('·')[1] || '').trim();
        tabLabel = `RT · ${suffix}`;
      } else {
        tabLabel = `${t.moneda} · ${t.perfil}`;
      }
      return `<button class="main-tab ${state.current === id ? 'active' : ''}" onclick="selectTab('${id}')">
        ${tabLabel}${edited ? ' <span class="edit-dot">●</span>' : ''}
      </button>`;
    }),
    `<button class="main-tab ${state.current === 'tacticas' ? 'active' : ''}" onclick="selectTab('tacticas')">⚡ Tácticas</button>`,
    `<button class="main-tab ${state.current === 'clientes' ? 'active' : ''}" onclick="selectTab('clientes')">👥 Clientes</button>`
  ].join("");
  document.getElementById("main-tabs").innerHTML = tabsHtml;
}

function selectTab(tab) {
  state.current = tab;
  state.modal = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (tab === 'tacticas' && state.tacticasPrices.status === 'idle') {
    fetchTacticasPrices();
  }
  if (tab === 'seguimiento' && state.seguimiento.iol.status === 'idle') {
    fetchSeguimientoPrices();
  }
}

function render() {
  renderTabs();
  const content = document.getElementById("content");
  if (state.current === "overview") content.innerHTML = renderOverview();
  else if (state.current === "seguimiento") content.innerHTML = renderSeguimiento();
  else if (state.current === "tacticas") content.innerHTML = renderTacticas();
  else if (state.current === "clientes") content.innerHTML = renderClientes();
  else content.innerHTML = renderPortfolio(state.current);
  renderModal();
}

loadState();
render();
setInterval(() => {
  if (state.current === 'tacticas' && (state.tacticasPicks.ar.length + state.tacticasPicks.cedears.length) > 0) {
    fetchTacticasPrices();
  }
  if (state.current === 'seguimiento') {
    fetchSeguimientoPrices();
  }
}, 60000);
</script>

</body>
