<style>

const ACTIVO_COLORS = (() => {
  const CAT_HSL = {
    liquidez: { h: 210, s: 15, l: 75 }, lecap: { h: 215, s: 50, l: 57 },
    dual: { h: 215, s: 45, l: 48 }, cer: { h: 210, s: 12, l: 64 },
    hd: { h: 215, s: 50, l: 33 }, equityAr: { h: 0, s: 50, l: 56 },
    equityUsa: { h: 275, s: 35, l: 63 }, etfs: { h: 275, s: 30, l: 45 },
    fciMM: { h: 270, s: 22, l: 84 }, fciTasa: { h: 210, s: 12, l: 64 },
    fciCer: { h: 270, s: 20, l: 78 }, fciDlk: { h: 275, s: 30, l: 55 },
    fciUsd: { h: 280, s: 33, l: 35 }, fciAcciones: { h: 275, s: 100, l: 82 },
    fciPymes: { h: 0, s: 50, l: 56 },
  };
  const colors = {};
  const byCat = {};
  ACTIVOS.forEach(a => {
    if (!byCat[a.category]) byCat[a.category] = [];
    byCat[a.category].push(a.id);
  });
  Object.keys(byCat).forEach(cat => {
    const base = CAT_HSL[cat] || { h: 220, s: 30, l: 50 };
    const ids = byCat[cat];
    const n = ids.length;
    ids.forEach((id, i) => {
      const hueOffset = ((i / Math.max(n - 1, 1)) - 0.5) * 50;
      const lumOffset = ((i / Math.max(n - 1, 1)) - 0.5) * 25;
      const h = (base.h + hueOffset + 360) % 360;
      const l = Math.max(30, Math.min(85, base.l + lumOffset));
      colors[id] = `hsl(${h.toFixed(0)}, ${base.s}%, ${l.toFixed(0)}%)`;
    });
  });
  return colors;
})();

}

function templatesForFirestore(templates) {

  for (const id in templates) {
    const t = templates[id];
    out[id] = {
      blocks: t.blocks || {},
      ...(t.rationale ? { rationale: t.rationale } : {}),
      ...(t.description ? { description: t.description } : {})
    };
  }
  return out;
}

            if (state.templates[id][k] === undefined || TEMPLATES_BASE[id][k] !== undefined) state.templates[id][k] = TEMPLATES_BASE[id][k];
          }
          if (state.templates[id].description === undefined) state.templates[id].description = TEMPLATES_BASE[id].description;
          if (!state.templates[id].blocks) state.templates[id].blocks = {};
        }
      }
    } else {
      state.templates = JSON.parse(JSON.stringify(TEMPLATES_BASE));
    }
  } catch (e) { console.warn(e); state.templates = JSON.parse(JSON.stringify(TEMPLATES_BASE)); }

  try {
    const tac = localStorage.getItem("sc-tacticas");
    if (tac) {
      const parsed = JSON.parse(tac);
      if (parsed.ar) state.tacticasPicks.ar = parsed.ar;
      if (parsed.cedears) state.tacticasPicks.cedears = parsed.cedears;
    }
  } catch (e) { console.warn(e); }

  try {
    const m = localStorage.getItem("sc-cm-montos");
    if (m) state.montos = JSON.parse(m) || {};
  } catch (e) { console.warn(e); state.montos = {}; }

  try {
    const rb = localStorage.getItem("sc-cm-rebal");
    if (rb != null) state.rebal.raw = rb;
    const rbc = localStorage.getItem("sc-cm-rebal-cash");
    if (rbc != null) state.rebal.cash = parseFloat(rbc) || 0;
  } catch (e) { console.warn(e); }

  try {
    const sg = localStorage.getItem("sc-seguimiento");
    if (sg) {
      const parsed = JSON.parse(sg);
      state.seguimiento.base = parsed.base || {};
      state.seguimiento.vcp = parsed.vcp || {};
      state.seguimiento.mkt = parsed.mkt || {};
      state.seguimiento.extra = parsed.extra || [];
    } else {
      state.seguimiento.base = { ...SEGUIMIENTO_SEED.base };
      state.seguimiento.vcp = { ...SEGUIMIENTO_SEED.vcp };
      state.seguimiento.mkt = {};
      state.seguimiento.extra = [];
    }
  } catch (e) { console.warn(e); }

  try {
    const cl = localStorage.getItem("sc-clientes");
    if (cl) {
      const parsed = JSON.parse(cl);
      state.clientes.fx = parsed.fx || 0;
      state.clientes.rows = Array.isArray(parsed.rows) ? parsed.rows : [];
    }
  } catch (e) { console.warn(e); state.clientes = { fx: 0, rows: [] }; }

  if (window.SC_FB) initFirebaseSync();
  else window.addEventListener('sc-firebase-ready', initFirebaseSync, { once: true });
  setTimeout(() => {
    if (state.fb && !state.fb.ready) setFbStatus('offline');
  }, 8000);
}

async function initFirebaseSync() {
  if (!window.SC_FB) return;
  state.fb.ready = true;
  const { db, doc, getDoc, setDoc, onSnapshot } = window.SC_FB;
  setFbStatus('connecting');

  try {
    const cartRef = doc(db, "silvercloud", "carteras");
    const tacRef = doc(db, "silvercloud", "tacticas");
    const segRef = doc(db, "silvercloud", "seguimiento");
    const cliRef = doc(db, "silvercloud", "clientes");

    const [cartSnap, tacSnap, segSnap, cliSnap] = await Promise.all([getDoc(cartRef), getDoc(tacRef), getDoc(segRef), getDoc(cliRef)]);

    if (!cartSnap.exists() && Object.values(state.templates).some(t => t.blocks && Object.keys(t.blocks).length > 0)) {
      await setDoc(cartRef, { data: templatesForFirestore(state.templates), updatedAt: Date.now() });
      console.log('Migrado carteras de localStorage a Firestore');
    } else if (cartSnap.exists()) {
      const data = cartSnap.data().data;
      if (data) {
        state.templates = templatesFromFirestore(data);
        try { localStorage.setItem("sc-carteras-modelo", JSON.stringify(state.templates)); } catch (e) {}
      }
    }

    if (!tacSnap.exists() && (state.tacticasPicks.ar.length > 0 || state.tacticasPicks.cedears.length > 0)) {
      await setDoc(tacRef, { data: state.tacticasPicks, updatedAt: Date.now() });
      console.log('Migrado tácticas de localStorage a Firestore');
    } else if (tacSnap.exists()) {
      const data = tacSnap.data().data;
      if (data) {
        state.tacticasPicks = { ar: data.ar || [], cedears: data.cedears || [] };
        try { localStorage.setItem("sc-tacticas", JSON.stringify(state.tacticasPicks)); } catch (e) {}
      }
    }

    if (!segSnap.exists() && (Object.keys(state.seguimiento.base).length > 0 || Object.keys(state.seguimiento.vcp).length > 0)) {
      await setDoc(segRef, { data: { base: state.seguimiento.base, vcp: state.seguimiento.vcp, mkt: state.seguimiento.mkt, extra: state.seguimiento.extra }, updatedAt: Date.now() });
      console.log('Migrado seguimiento de localStorage a Firestore');
    } else if (segSnap.exists()) {
      const data = segSnap.data().data;
      if (data) {
        state.seguimiento.base = data.base || {};
        state.seguimiento.vcp = data.vcp || {};
        state.seguimiento.mkt = data.mkt || {};
        state.seguimiento.extra = data.extra || [];
        try { localStorage.setItem("sc-seguimiento", JSON.stringify({ base: state.seguimiento.base, vcp: state.seguimiento.vcp, mkt: state.seguimiento.mkt, extra: state.seguimiento.extra })); } catch (e) {}
      }
    }

    if (!cliSnap.exists() && state.clientes.rows.length > 0) {
      await setDoc(cliRef, { data: { fx: state.clientes.fx, rows: state.clientes.rows }, updatedAt: Date.now() });
      console.log('Migrado clientes de localStorage a Firestore');
    } else if (cliSnap.exists()) {
      const data = cliSnap.data().data;
      if (data) {
        state.clientes.fx = data.fx || 0;
        state.clientes.rows = Array.isArray(data.rows) ? data.rows : [];
        try { localStorage.setItem("sc-clientes", JSON.stringify(state.clientes)); } catch (e) {}
      }
    }

    render();

    state.fb.unsubCarteras = onSnapshot(cartRef, (snap) => {
      if (!snap.exists() || state.fb.savingTimer) return;
      const data = snap.data().data;
      if (!data) return;
      const incoming = JSON.stringify(data);
      const currentSerialized = JSON.stringify(templatesForFirestore(state.templates));
      if (currentSerialized === incoming) return;
      state.templates = templatesFromFirestore(data);
      try { localStorage.setItem("sc-carteras-modelo", JSON.stringify(state.templates)); } catch (e) {}
      render();
    }, (err) => { console.warn('Sync carteras error:', err); setFbStatus('error'); });

    state.fb.unsubTacticas = onSnapshot(tacRef, (snap) => {
      if (!snap.exists() || state.fb.savingTimer) return;
      const data = snap.data().data;
      if (!data) return;
      const current = JSON.stringify(state.tacticasPicks);
      const incoming = JSON.stringify(data);
      if (current === incoming) return;
      state.tacticasPicks = { ar: data.ar || [], cedears: data.cedears || [] };
      try { localStorage.setItem("sc-tacticas", JSON.stringify(state.tacticasPicks)); } catch (e) {}
      render();
    }, (err) => { console.warn('Sync tácticas error:', err); setFbStatus('error'); });

    state.fb.unsubSeguimiento = onSnapshot(segRef, (snap) => {
      if (!snap.exists() || state.fb.savingTimer) return;
      const data = snap.data().data;
      if (!data) return;
      const current = JSON.stringify({ base: state.seguimiento.base, vcp: state.seguimiento.vcp, mkt: state.seguimiento.mkt, extra: state.seguimiento.extra });
      const incoming = JSON.stringify({ base: data.base || {}, vcp: data.vcp || {}, mkt: data.mkt || {}, extra: data.extra || [] });
      if (current === incoming) return;
      state.seguimiento.base = data.base || {};
      state.seguimiento.vcp = data.vcp || {};
      state.seguimiento.mkt = data.mkt || {};
      state.seguimiento.extra = data.extra || [];
      try { localStorage.setItem("sc-seguimiento", JSON.stringify({ base: state.seguimiento.base, vcp: state.seguimiento.vcp, mkt: state.seguimiento.mkt, extra: state.seguimiento.extra })); } catch (e) {}
      render();
    }, (err) => { console.warn('Sync seguimiento error:', err); setFbStatus('error'); });

    state.fb.unsubClientes = onSnapshot(cliRef, (snap) => {
      if (!snap.exists() || state.fb.savingTimer) return;
      const data = snap.data().data;
      if (!data) return;
      const current = JSON.stringify({ fx: state.clientes.fx, rows: state.clientes.rows });
      const incoming = JSON.stringify({ fx: data.fx || 0, rows: Array.isArray(data.rows) ? data.rows : [] });
      if (current === incoming) return;
      state.clientes.fx = data.fx || 0;
      state.clientes.rows = Array.isArray(data.rows) ? data.rows : [];
      try { localStorage.setItem("sc-clientes", JSON.stringify(state.clientes)); } catch (e) {}
      render();
    }, (err) => { console.warn('Sync clientes error:', err); setFbStatus('error'); });

    setFbStatus('online');
  } catch (e) {
    console.error('Firebase init error:', e);
    setFbStatus('offline');
  }
}

function saveState() {

  catch (e) { console.warn(e); }
  if (state.fb.ready && window.SC_FB) {
    setFbStatus('syncing');
    if (state.fb.savingTimer) clearTimeout(state.fb.savingTimer);
    state.fb.savingTimer = setTimeout(async () => {
      try {
        const { db, doc, setDoc } = window.SC_FB;
        await setDoc(doc(db, "silvercloud", "carteras"), { data: templatesForFirestore(state.templates), updatedAt: Date.now() });

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  a.href = url;
  a.download = `silvercloud-carteras-${new Date().toISOString().slice(0,10)}.json`;
  a.click();

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm("¿Reemplazar los datos actuales?")) return;
      if (data.templates) state.templates = data.templates;
      else state.templates = data;
      if (data.tacticasPicks) state.tacticasPicks = data.tacticasPicks;
      saveState(); saveTacticas(); render();
    } catch (err) { alert("Error: " + err.message); }
  };
  reader.readAsText(file);
  event.target.value = "";
}
function buildDonut(blocks, opts = {}) {
  const { size = 320, showCenter = true } = opts;
  const entries = Object.entries(blocks).filter(([k, v]) => Number(v) > 0);
  const total = entries.reduce((s, [, v]) => s + Number(v), 0);
  const cx = size/2, cy = size/2;
  const rOut = size * 0.41;
  const rIn = size * 0.25;
  if (total === 0) {
    return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
      <circle cx="${cx}" cy="${cy}" r="${rOut}" fill="none" stroke="#2a3343" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="11" fill="#6b748a">SIN ACTIVOS</text>
    </svg>`;
  }
  let acc = -90;
  const paths = entries.map(([activoId, val]) => {
    const sweep = (Number(val) / total) * 360;
    const start = acc, end = acc + sweep;
    acc = end;
    const r1 = (start * Math.PI) / 180, r2 = (end * Math.PI) / 180;
    const x1 = cx + rOut * Math.cos(r1), y1 = cy + rOut * Math.sin(r1);
    const x2 = cx + rOut * Math.cos(r2), y2 = cy + rOut * Math.sin(r2);
    const x3 = cx + rIn * Math.cos(r2), y3 = cy + rIn * Math.sin(r2);
    const x4 = cx + rIn * Math.cos(r1), y4 = cy + rIn * Math.sin(r1);
    const largeArc = sweep > 180 ? 1 : 0;
    const color = getActivoColor(activoId);
    if (entries.length === 1) {
      return `<path d="M ${cx},${cy-rOut} A ${rOut},${rOut} 0 1,1 ${cx-0.01},${cy-rOut} L ${cx-0.01},${cy-rIn} A ${rIn},${rIn} 0 1,0 ${cx},${cy-rIn} Z" fill="${color}"/>`;
    }
    return `<path d="M ${x1.toFixed(2)},${y1.toFixed(2)} A ${rOut},${rOut} 0 ${largeArc},1 ${x2.toFixed(2)},${y2.toFixed(2)} L ${x3.toFixed(2)},${y3.toFixed(2)} A ${rIn},${rIn} 0 ${largeArc},0 ${x4.toFixed(2)},${y4.toFixed(2)} Z" fill="${color}"/>`;
  });
  const totalColor = Math.abs(total - 100) < 0.01 ? "#3fb950" : (total > 100 ? "#f85149" : "#d29922");
  let center = "";
  if (showCenter) {
    center = `
      <circle cx="${cx}" cy="${cy}" r="${rIn - 2}" fill="var(--bg-card)"/>
      <text x="${cx}" y="${cy - 8}" text-anchor="middle" font-size="${size*0.034}" fill="#8b95a8" style="letter-spacing: 1px;">TOTAL</text>
      <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="${size*0.075}" font-weight="700" fill="${totalColor}" style="font-family: 'Libre Baskerville', serif;">${total.toFixed(1)}%</text>
    `;
  }
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${paths.join('')}${center}</svg>`;
}

function buildLegend(blocks) {
  const items = Object.entries(blocks)
    .filter(([k, v]) => Number(v) > 0)
    .sort((a, b) => Number(b[1]) - Number(a[1]))
    .map(([activoId, val]) => {
      const activo = ACTIVOS_BY_ID[activoId];
      if (!activo) return "";
      const color = getActivoColor(activoId);
      return `<div class="legend-item">
        <span class="legend-dot" style="background: ${color};"></span>
        <span class="legend-name">${activo.name}</span>
        <span class="legend-val">${Number(val)}%</span>
      </div>`;
    }).join("");
  return `<div class="legend">${items}</div>`;
}

function renderOverviewCard(id) {
  const t = state.templates[id];
  const edited = isEdited(id);

  const nombre = (t.label.split('·')[1] || t.label).trim();
  return `<div class="overview-card" onclick="selectTab('${id}')">

    <div class="nombre">${nombre}${edited ? ' <span style="color: var(--violet); font-size: 11px;">●</span>' : ''}</div>
    ${buildDonut(t.blocks, { size: 200 })}
    ${isEmpty ? '<div class="empty">Click para armar la cartera</div>' : buildLegend(t.blocks)}

}

function buildTable(id) {
  const t = state.templates[id];
  const blocks = t.blocks;
  const entries = Object.entries(blocks);
  let rowsHtml;
  if (entries.length === 0) {
    rowsHtml = `<tr class="empty-row"><td colspan="2">
      Esta cartera está vacía. Click en <strong style="color: var(--violet);">"+ Agregar activo"</strong> abajo para empezar.
    </td></tr>`;
  } else {
    const catOrder = Object.keys(CATEGORIES);
    entries.sort((a, b) => {
      const ca = ACTIVOS_BY_ID[a[0]]?.category;
      const cb = ACTIVOS_BY_ID[b[0]]?.category;
      const oa = catOrder.indexOf(ca);
      const ob = catOrder.indexOf(cb);
      if (oa !== ob) return oa - ob;
      return Number(b[1]) - Number(a[1]);
    });
    rowsHtml = "";
    let lastCategory = null;
    entries.forEach(([activoId, val]) => {
      const activo = ACTIVOS_BY_ID[activoId];
      if (!activo) {
        rowsHtml += `<tr><td>
          <span class="activo-dot" style="background: #888;"></span>
          <span class="activo-name">${activoId}</span>
          <span style="color: var(--red); font-size: 10px; margin-left: 8px;">⚠ ID desconocido</span>
        </td>
        <td class="right">
          <input type="number" class="pct-input" value="${val}" min="0" max="100" step="0.5"
                 onchange="updateActivo('${id}', '${activoId}', this.value)"
                 onkeydown="if(event.key==='Enter')this.blur();">
          <span class="pct-suffix">%</span>
          <button class="btn-remove" onclick="removeActivo('${id}', '${activoId}')" title="Quitar">×</button>
        </td></tr>`;
        return;
      }
      const cat = CATEGORIES[activo.category];
      if (activo.category !== lastCategory) {
        rowsHtml += `<tr class="cat-subheader"><td colspan="2">
          <span class="cat-subheader-dot" style="background: ${cat.color};"></span>
          ${cat.label}
        </td></tr>`;
        lastCategory = activo.category;
      }
      rowsHtml += `<tr>
        <td>
          <span class="activo-dot" style="background: ${getActivoColor(activoId)};"></span>
          <span class="activo-name">${activo.name}</span>
          ${activo.subgroup ? `<div class="activo-cat">${activo.subgroup}</div>` : ''}
        </td>
        <td class="right">
          <input type="number" class="pct-input" value="${val}" min="0" max="100" step="0.5"
                 onchange="updateActivo('${id}', '${activoId}', this.value)"
                 onkeydown="if(event.key==='Enter')this.blur();">
          <span class="pct-suffix">%</span>
          <button class="btn-remove" onclick="removeActivo('${id}', '${activoId}')" title="Quitar">×</button>
        </td>
      </tr>`;
    });
  }
  const total = entries.reduce((s, [, v]) => s + (Number(v) || 0), 0);
  const totalStatus = Math.abs(total - 100) < 0.01
    ? { cls: "ok", msg: "✓ Cartera balanceada" }
    : total > 100 ? { cls: "error", msg: `Excede ${(total - 100).toFixed(1)}%` }
    : entries.length === 0 ? { cls: "warning", msg: "Cartera vacía" }
    : { cls: "warning", msg: `Falta ${(100 - total).toFixed(1)}%` };
  return `<table class="activos-tabla">
    <thead><tr><th>Activo</th><th class="right">Ponderación</th></tr></thead>
    <tbody>
      ${rowsHtml}
      <tr class="add-row"><td colspan="2">
        <div class="add-cta" onclick="openAddModal('${id}')">
          <span class="add-cta-icon">+</span>
          <span>Agregar activo</span>
        </div>
      </td></tr>
      <tr class="total-row">
        <td>
          <strong style="color: var(--text-bright); font-family: 'Libre Baskerville', serif; font-size: 14px; letter-spacing: 1px;">TOTAL</strong>
          <div class="total-status ${totalStatus.cls}">${totalStatus.msg}</div>
        </td>
        <td class="right"><span class="total-value ${totalStatus.cls}">${total.toFixed(1)}%</span></td>
      </tr>
    </tbody>
  </table>
  <div class="editor-help">
    Click en <kbd>+ Agregar activo</kbd> para sumar uno · Click en <kbd>%</kbd> para editar peso · <kbd>×</kbd> quita el activo
  </div>`;
}

function updateActivo(portfolioId, activoId, value) {
  const num = parseFloat(value);
  if (isNaN(num) || num < 0) return;
  state.templates[portfolioId].blocks[activoId] = num;
  saveState(); render();
}

function removeActivo(portfolioId, activoId) {
  const val = state.templates[portfolioId].blocks[activoId] || 0;
  const activo = ACTIVOS_BY_ID[activoId];
  const name = activo ? activo.name : activoId;
  if (val > 0 && !confirm(`Quitar "${name}" (${val}%)?`)) return;
  delete state.templates[portfolioId].blocks[activoId];
  saveState(); render();
}

function openAddModal(portfolioId) {
  state.modal = { portfolioId, view: "categories", category: null, search: "" };
  render();
}

function openModalCategory(catKey) {
  if (state.modal) { state.modal.view = "list"; state.modal.category = catKey; render(); }
}

function backToCategories() {
  if (state.modal) { state.modal.view = "categories"; state.modal.category = null; state.modal.search = ""; render(); }
}

function closeAddModal() { state.modal = null; render(); }

function setModalSearch(value) {
  if (state.modal) {
    state.modal.search = value;
    if (value.trim().length > 0 && state.modal.view === "categories") {
      state.modal.view = "search"; state.modal.category = null;
    } else if (value.trim().length === 0 && state.modal.view === "search") {
      state.modal.view = "categories";
    }
    renderModal();
  }
}

function addActivo(activoId) {
  const m = state.modal;
  if (!m) return;
  if (m.seguimiento) {
    if (!state.seguimiento.extra) state.seguimiento.extra = [];
    if (!state.seguimiento.extra.includes(activoId)) {
      state.seguimiento.extra.push(activoId);
      saveSeguimiento();
    }
    render();
    return;
  }
  const blocks = state.templates[m.portfolioId].blocks;
  if (blocks[activoId] !== undefined) return;
  blocks[activoId] = 0;
  saveState(); render();
}

function renderModalItem(a, blocks) {
  const cat = CATEGORIES[a.category];
  const isAdded = blocks[a.id] !== undefined;
  const meta = a.type === "fci"
    ? `${a.sociedad} · ${a.moneda} · ${a.liquidez} · ${a.objetivo}`
    : `${cat.label}${a.subgroup ? ' · ' + a.subgroup : ''}`;
  const onClick = isAdded ? '' : `onclick="addActivo('${a.id}')"`;
  return `
    <div class="activo-pick-item ${isAdded ? 'disabled' : ''}" ${onClick}>
      <span class="activo-pick-dot" style="background: ${cat.color};"></span>
      <div class="activo-pick-info">
        <div class="activo-pick-name">${a.name}</div>
        <div class="activo-pick-meta">${meta}</div>
      </div>
      ${isAdded ? '<span class="activo-pick-added">✓ Ya agregado</span>' : '<span class="activo-pick-cat">+</span>'}
    </div>
  `;
}

function renderModal() {
  const container = document.getElementById("modal-container");

  if (state.tacticasEdit) {
    renderTacticasEditModal();
    return;
  }

  if (!state.modal) { container.innerHTML = ""; return; }
  const { portfolioId, view, category, search, seguimiento } = state.modal;
  const portfolio = seguimiento ? null : state.templates[portfolioId];
  const blocks = seguimiento
    ? Object.fromEntries((state.seguimiento.extra || []).map(id => [id, 0]))
    : portfolio.blocks;
  const portfolioName = seguimiento ? 'Seguimiento' : portfolio.title;
  const searchLower = search.toLowerCase().trim();

  let body = "";
  let backHtml = "";

  if (view === "categories") {
    const showDirecto = !seguimiento || seguimiento === 'mkt';
    const showFci = !seguimiento || seguimiento === 'fci';
    const directoGrid = `
      <div class="cat-section-title">Activos Directos</div>
      <div class="cat-grid">
        ${Object.keys(CATEGORIES).filter(k => CATEGORIES[k].group === "directo").map(catKey => {
          const cat = CATEGORIES[catKey];
          const count = ACTIVOS.filter(a => a.category === catKey).length;
          const usedCount = ACTIVOS.filter(a => a.category === catKey && blocks[a.id] !== undefined).length;
          return `
            <div class="cat-card" onclick="openModalCategory('${catKey}')">
              <div class="cat-card-dot" style="background: ${cat.color};"></div>
              <div class="cat-card-info">
                <div class="cat-card-name">${cat.label}</div>
                <div class="cat-card-meta">${count} activo${count === 1 ? '' : 's'}${usedCount > 0 ? ` · <span style="color: var(--violet);">${usedCount} ${seguimiento ? 'en seguimiento' : 'en cartera'}</span>` : ''}</div>
              </div>
              <div class="cat-card-arrow">→</div>
            </div>`;
        }).join("")}
      </div>`;
    const fciGrid = `
      <div class="cat-section-title">Fondos Comunes (FCI)</div>
      <div class="cat-grid">
        ${Object.keys(CATEGORIES).filter(k => CATEGORIES[k].group === "fci").map(catKey => {
          const cat = CATEGORIES[catKey];
          const count = ACTIVOS.filter(a => a.category === catKey).length;
          const usedCount = ACTIVOS.filter(a => a.category === catKey && blocks[a.id] !== undefined).length;
          return `
            <div class="cat-card ${count === 0 ? 'cat-card-empty' : ''}" ${count > 0 ? `onclick="openModalCategory('${catKey}')"` : ''}>
              <div class="cat-card-dot" style="background: ${cat.color};"></div>
              <div class="cat-card-info">
                <div class="cat-card-name">${cat.label}</div>
                <div class="cat-card-meta">${count === 0 ? 'Sin fondos cargados aún' : `${count} fondo${count === 1 ? '' : 's'}${usedCount > 0 ? ` · <span style="color: var(--violet);">${usedCount} ${seguimiento ? 'en seguimiento' : 'en cartera'}</span>` : ''}`}</div>
              </div>
              ${count > 0 ? '<div class="cat-card-arrow">→</div>' : ''}
            </div>`;
        }).join("")}
      </div>`;
    body = (showDirecto ? directoGrid : '') + (showFci ? fciGrid : '');
  } else if (view === "search") {
    const filtered = ACTIVOS.filter(a =>
      a.name.toLowerCase().includes(searchLower) ||
      a.id.toLowerCase().includes(searchLower) ||
      (a.sociedad && a.sociedad.toLowerCase().includes(searchLower)) ||
      (a.objetivo && a.objetivo.toLowerCase().includes(searchLower)) ||
      CATEGORIES[a.category].label.toLowerCase().includes(searchLower)
    );
    if (filtered.length === 0) {
      body = `<div style="padding: 40px 24px; text-align: center; color: var(--text-dim); font-style: italic;">No hay activos que coincidan con "${search}".</div>`;
    } else {
      const grouped = {};
      filtered.forEach(a => {
        if (!grouped[a.category]) grouped[a.category] = [];
        grouped[a.category].push(a);
      });
      Object.keys(CATEGORIES).forEach(catKey => {
        const arr = grouped[catKey];
        if (!arr) return;
        const cat = CATEGORIES[catKey];
        body += `<div class="modal-subgroup-header">${cat.label} <span style="color: var(--text-light); font-weight: 400; margin-left: 6px;">· ${arr.length}</span></div>`;
        body += arr.map(a => renderModalItem(a, blocks)).join("");
      });
    }
  } else if (view === "list") {
    const cat = CATEGORIES[category];
    const catActivos = ACTIVOS.filter(a => a.category === category);
    backHtml = `<button class="modal-back" onclick="backToCategories()">← Categorías</button>`;
    if (cat.subgroups) {
      cat.subgroups.forEach(sg => {
        const sgActivos = catActivos.filter(a => a.subgroup === sg);
        if (sgActivos.length === 0) return;
        body += `<div class="modal-subgroup-header">${sg} <span style="color: var(--text-light); font-weight: 400; margin-left: 6px;">· ${sgActivos.length}</span></div>`;
        body += sgActivos.map(a => renderModalItem(a, blocks)).join("");
      });
      const sinSg = catActivos.filter(a => !a.subgroup);
      if (sinSg.length > 0) body += sinSg.map(a => renderModalItem(a, blocks)).join("");
    } else {
      body += catActivos.map(a => renderModalItem(a, blocks)).join("");
    }
  }

  let titleText, subtitleText;
  if (view === "categories") { titleText = "Agregar activo"; subtitleText = `a ${portfolioName}`; }
  else if (view === "search") { titleText = `Búsqueda: "${search}"`; subtitleText = `a ${portfolioName}`; }
  else if (view === "list") { titleText = CATEGORIES[category].label; subtitleText = `a ${portfolioName}`; }

  container.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeAddModal()">
      <div class="modal">
        <div class="modal-header">
          <div style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;">
            ${backHtml}
            <div style="min-width: 0;">
              <div class="modal-title">${titleText}</div>
              <div style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${subtitleText}</div>
            </div>
          </div>
          <button class="modal-close" onclick="closeAddModal()">×</button>
        </div>
        <div class="modal-search">
          <input type="text" placeholder="Buscar por ticker, nombre, sociedad..." value="${search}" oninput="setModalSearch(this.value)" autofocus>
        </div>
        <div class="modal-body">${body}</div>
      </div>
    </div>`;
}
function generateAutoSummary(portfolioId) {

  const rfPct = pct(rfTotal);

  const dd = t.drawdown || "el drawdown esperado";
  const target = t.target || "el target definido";
  let gestionDesc = "";
  if (fciTotal > 70) gestionDesc = `con gestión predominantemente delegada (${fciPct}% vía FCIs)`;
  else if (fciTotal > 40) gestionDesc = `con balance entre selección directa de activos y gestión delegada (FCIs ${fciPct}%)`;
  else if (fciTotal > 0) gestionDesc = `con gestión predominantemente activa en activos directos, complementada con FCIs (${fciPct}%)`;
  else gestionDesc = `con gestión 100% activa en activos directos`;
  const monedaLbl = moneda === "MIX" ? "mixto ARS/USD" : moneda;
  const p4 = `Perfil recomendado: inversor con mandato ${monedaLbl}, horizonte ${horizonte}, tolerancia a drawdowns de ${dd} y objetivo de rendimiento ${target}, ${gestionDesc}.`;

  return [p1, p2, p3, p4].filter(x => x).join("\n\n");
}

function getActivoAporte(activoId) {
  const a = ACTIVOS_BY_ID[activoId];
  if (!a) return null;
  if (a.aporte) return a.aporte;
  if (APORTES[activoId]) return APORTES[activoId];
  if (a.type === "fci" && a.objetivo) return a.objetivo;
  return null;

function buildAnalysis(portfolioId) {
  const t = state.templates[portfolioId];
  const blocks = t.blocks;
  const entries = Object.entries(blocks).filter(([, v]) => Number(v) > 0);
  if (entries.length === 0) {
    return `<div class="analysis-section">
      <div class="analysis-title"><span class="analysis-title-icon">📊</span> Análisis de cartera</div>
      <div style="color: var(--text-dim); font-style: italic; padding: 20px; text-align: center;">
        Agregá activos a la cartera para ver el análisis.
      </div>
    </div>`;
  }
  const total = entries.reduce((s, [, v]) => s + Number(v), 0);
  const userRationale = t.rationale;
  const autoSummary = generateAutoSummary(portfolioId);
  const isEditing = state.editingRationale === portfolioId;
  const summaryText = userRationale || autoSummary;
  let summaryHtml;
  if (isEditing) {
    summaryHtml = `<div class="analysis-summary editing">
      <textarea id="rationale-edit-${portfolioId}" placeholder="Escribí el racional de la cartera...">${userRationale || autoSummary}</textarea>
      <div class="analysis-edit-actions">
        <button class="analysis-edit-btn reset" onclick="resetRationale('${portfolioId}')">Auto-generar</button>
        <button class="analysis-edit-btn" onclick="cancelEditRationale()">Cancelar</button>
        <button class="analysis-edit-btn" onclick="saveRationale('${portfolioId}')">💾 Guardar</button>
      </div>
    </div>`;
  } else {
    const editBtn = `<button class="analysis-edit-btn" onclick="startEditRationale('${portfolioId}')">✎ ${userRationale ? 'Editar' : 'Editar racional'}</button>`;
    const sourceTag = userRationale
      ? '<span style="color: var(--violet); font-size: 9px;">EDITADO MANUALMENTE</span>'
      : '<span style="color: var(--text-light); font-size: 9px;">AUTO-GENERADO</span>';
    summaryHtml = `
      <div class="analysis-block-header">
        <span>Resumen ejecutivo</span>
        <span style="display:flex;align-items:center;gap:10px;">${sourceTag}${editBtn}</span>
      </div>
      <div class="analysis-summary">${summaryText}</div>`;
  }
  const byCat = {};
  entries.forEach(([id, val]) => {
    const a = ACTIVOS_BY_ID[id];
    if (!a) return;
    if (!byCat[a.category]) byCat[a.category] = 0;
    byCat[a.category] += Number(val);
  });
  const sortedCats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const barsHtml = sortedCats.map(([catKey, val]) => {
    const cat = CATEGORIES[catKey];
    if (!cat) return "";
    const pct = (val / total) * 100;
    return `<div class="bar-row">
      <span class="bar-label">${cat.label}</span>
      <div class="bar-container"><div class="bar-fill" style="width: ${pct.toFixed(1)}%; background: ${cat.color};"></div></div>
      <span class="bar-val">${val.toFixed(1)}%</span>
    </div>`;
  }).join("");
  const catOrder = Object.keys(CATEGORIES);
  const sortedEntries = [...entries].sort((a, b) => {
    const ca = ACTIVOS_BY_ID[a[0]]?.category;
    const cb = ACTIVOS_BY_ID[b[0]]?.category;
    const oa = catOrder.indexOf(ca);
    const ob = catOrder.indexOf(cb);
    if (oa !== ob) return oa - ob;
    return Number(b[1]) - Number(a[1]);
  });
  const aporteHtml = sortedEntries.map(([id, val]) => {
    const a = ACTIVOS_BY_ID[id];
    if (!a) {
      return `<div class="aporte-item">
        <span class="aporte-dot" style="background:#888;"></span>
        <div class="aporte-content">
          <div class="aporte-head">${id}</div>
          <div class="aporte-empty">⚠ Activo no encontrado en catálogo</div>
        </div>
        <span class="aporte-pct">${val}%</span>
      </div>`;
    }
    const cat = CATEGORIES[a.category];
    const aporte = getActivoAporte(id);
    const catLabel = `${cat.label}${a.subgroup ? ' · ' + a.subgroup : ''}`;
    return `<div class="aporte-item">
      <span class="aporte-dot" style="background: ${getActivoColor(id)};"></span>
      <div class="aporte-content">
        <div class="aporte-head">${a.name}</div>
        <div class="aporte-cat">${catLabel}</div>
        ${aporte ? `<div class="aporte-text">${aporte}</div>` : `<div class="aporte-empty">Sin descripción cargada</div>`}
      </div>
      <span class="aporte-pct">${val}%</span>
    </div>`;
  }).join("");
  const equityCats = ["equityAr","equityUsa","etfs","fciAcciones"];
  const equityTotal = sortedCats.filter(([k]) => equityCats.includes(k)).reduce((s, [, v]) => s + v, 0);
  const equityPct = ((equityTotal / total) * 100).toFixed(0);
  const rfPct = (100 - Number(equityPct)).toFixed(0);
  const splitHtml = `
    <div class="split-bar">
      <div class="split-side rf" style="flex: ${rfPct};">
        <div class="split-pct">${rfPct}%</div>
        <div class="split-label">Renta Fija</div>
      </div>
      <div class="split-side eq" style="flex: ${equityPct};">
        <div class="split-pct">${equityPct}%</div>
        <div class="split-label">Equity</div>
      </div>
    </div>`;
  return `<div class="analysis-section">
    <div class="analysis-title"><span class="analysis-title-icon">📊</span> Análisis de cartera</div>
    ${splitHtml}
    <div class="analysis-block">${summaryHtml}</div>
    <div class="analysis-block">
      <div class="analysis-block-header"><span>Composición por categoría</span></div>
      <div class="bar-chart">${barsHtml}</div>
    </div>
    <div class="analysis-block">
      <div class="analysis-block-header"><span>Aporte por activo</span></div>
      <div class="aporte-list">${aporteHtml}</div>
    </div>
  </div>`;
}

function startEditRationale(portfolioId) {
  state.editingRationale = portfolioId;
  render();
  setTimeout(() => {
    const el = document.getElementById(`rationale-edit-${portfolioId}`);
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 50);
}

function cancelEditRationale() { state.editingRationale = null; render(); }

function saveRationale(portfolioId) {
  const el = document.getElementById(`rationale-edit-${portfolioId}`);
  if (!el) return;
  const text = el.value.trim();
  if (text) state.templates[portfolioId].rationale = text;
  else delete state.templates[portfolioId].rationale;
  state.editingRationale = null;
  saveState(); render();
}

function resetRationale(portfolioId) {
  if (!confirm("¿Volver al resumen auto-generado? Se perderá tu texto editado.")) return;
  delete state.templates[portfolioId].rationale;
  saveState();
  render();
}

function editDescription(id) {
  const actual = state.templates[id].description || "";
  const nuevo = prompt("Editá la descripción de la cartera:", actual);
  if (nuevo === null) return;
  state.templates[id].description = nuevo.trim();
  saveState();
  render();
}

// ============================================
// CALCULADORA DE ÓRDENES — monto a invertir → desglose por activo
// ============================================
function parseMontoAR(str) {
  if (str === null || str === undefined) return 0;
  str = String(str).trim().replace(/\$/g, '').replace(/US/gi, '').replace(/\s/g, '');
  if (!str) return 0;
  // Formato AR: punto = miles, coma = decimal
  if (str.includes(',')) str = str.replace(/\./g, '').replace(',', '.');
  else str = str.replace(/\./g, '');
  const n = parseFloat(str);
  return (isNaN(n) || n < 0) ? 0 : n;
}

function fmtPesos(n, moneda) {
  const sym = moneda === 'USD' ? 'US$' : '$';
  return sym + ' ' + Math.round(n).toLocaleString('es-AR');
}

function setMontoInversion(id, value) {
  state.montos[id] = parseMontoAR(value);
  try { localStorage.setItem('sc-cm-montos', JSON.stringify(state.montos)); } catch (e) {}
  render();
}

function ordenesEntries(id) {
  const t = state.templates[id];
  const catOrder = Object.keys(CATEGORIES);
  const entries = Object.entries(t.blocks).filter(([, v]) => Number(v) > 0);
  entries.sort((a, b) => {
    const oa = catOrder.indexOf(ACTIVOS_BY_ID[a[0]]?.category);
    const ob = catOrder.indexOf(ACTIVOS_BY_ID[b[0]]?.category);
    if (oa !== ob) return oa - ob;
    return Number(b[1]) - Number(a[1]);
  });
  return entries;
}

function buildOrdenes(id) {
  const t = state.templates[id];
  const moneda = t.moneda === 'USD' ? 'USD' : 'ARS';
  const sym = moneda === 'USD' ? 'US$' : '$';
  const curLabel = moneda === 'USD' ? 'Monto a invertir (USD)' : 'Monto a invertir (ARS)';
  const monto = state.montos[id] || 0;
  const montoDisplay = monto > 0 ? monto.toLocaleString('es-AR') : '';

  const inputBlock = `
    <div class="ordenes-input-wrap">
      <span class="ordenes-input-label">${curLabel}</span>
      <span class="ordenes-cur">${sym}</span>
      <input type="text" inputmode="decimal" class="ordenes-monto-input" value="${montoDisplay}"
             placeholder="0"
             onchange="setMontoInversion('${id}', this.value)"
             onkeydown="if(event.key==='Enter')this.blur();">
    </div>`;

  const entries = ordenesEntries(id);
  if (entries.length === 0) {
    return `<div class="ordenes-section">
      <div class="ordenes-head"><h3>🧮 Órdenes a aplicar</h3>${inputBlock}</div>
      <div class="ordenes-empty">Agregá activos a la cartera para calcular el desglose.</div>
    </div>`;
  }

  let rows = "", lastCat = null, totalPct = 0, totalMonto = 0;
  entries.forEach(([activoId, pct]) => {
    const activo = ACTIVOS_BY_ID[activoId];
    const name = activo ? activo.name : activoId;
    const p = Number(pct) || 0;
    const m = monto * p / 100;
    totalPct += p; totalMonto += m;
    if (activo && activo.category !== lastCat) {
      const cat = CATEGORIES[activo.category];
      rows += `<tr class="orden-cat-subheader"><td colspan="3">
        <span class="cat-subheader-dot" style="background:${cat.color};"></span>${cat.label}</td></tr>`;
      lastCat = activo.category;
    }
    rows += `<tr>
      <td><span class="activo-dot" style="background:${getActivoColor(activoId)};"></span><span class="activo-name">${name}</span></td>
      <td class="right"><span class="orden-pct">${p.toFixed(1)}%</span></td>
      <td class="right"><span class="orden-monto">${monto > 0 ? fmtPesos(m, moneda) : '—'}</span></td>
    </tr>`;
  });

  let warn = "";
  if (Math.abs(totalPct - 100) >= 0.01) {
    warn = `<div class="orden-warn">⚠ La cartera pondera ${totalPct.toFixed(1)}% (no 100%). Cada activo se calcula sobre su propio %, así que el total asignado ${totalPct < 100 ? 'queda por debajo del' : 'supera el'} monto ingresado. Balanceá la cartera al 100% para asignar todo.</div>`;
  }

  const copyBtn = monto > 0 ? `<button class="btn" onclick="copyOrdenes('${id}')">⧉ Copiar órdenes</button>` : '';

  return `<div class="ordenes-section">
    <div class="ordenes-head"><h3>🧮 Órdenes a aplicar</h3>${inputBlock}</div>
    <table class="ordenes-tabla">
      <thead><tr><th>Activo / Fondo</th><th class="right">Pond.</th><th class="right">Monto a enviar</th></tr></thead>
      <tbody>
        ${rows}
        <tr class="orden-total">
          <td><span class="orden-total-label">TOTAL ASIGNADO</span></td>
          <td class="right"><span class="orden-pct">${totalPct.toFixed(1)}%</span></td>
          <td class="right"><span class="orden-total-val">${monto > 0 ? fmtPesos(totalMonto, moneda) : '—'}</span></td>
        </tr>
      </tbody>
    </table>
    ${warn}
    ${copyBtn ? `<div class="orden-actions">${copyBtn}</div>` : ''}
  </div>`;
}

function copyOrdenes(id) {
  const t = state.templates[id];
  const moneda = t.moneda === 'USD' ? 'USD' : 'ARS';
  const monto = state.montos[id] || 0;
  if (monto <= 0) return;
  const entries = ordenesEntries(id);
  const lines = [t.title, 'Monto total: ' + fmtPesos(monto, moneda), '────────────────────'];
  let lastCat = null, totalMonto = 0;
  entries.forEach(([activoId, pct]) => {
    const activo = ACTIVOS_BY_ID[activoId];
    const name = activo ? activo.name : activoId;
    const p = Number(pct) || 0;
    const m = monto * p / 100;
    totalMonto += m;
    if (activo && activo.category !== lastCat) {
      lines.push('');
      lines.push('· ' + CATEGORIES[activo.category].label);
      lastCat = activo.category;
    }
    lines.push(`   ${name} — ${p.toFixed(1)}% — ${fmtPesos(m, moneda)}`);
  });
  lines.push('────────────────────');
  lines.push('TOTAL ASIGNADO: ' + fmtPesos(totalMonto, moneda));
  const text = lines.join('\n');
  const done = () => alert('Órdenes copiadas al portapapeles.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { alert('No se pudo copiar automáticamente.'); }
  document.body.removeChild(ta);
}

// Alias de fondos: código IOL / nombre comercial -> id del activo
const REBAL_ALIASES = {
  '24936': 'galileo-multimercado-4',
  'galileo multimercado iv': 'galileo-multimercado-4',
  'galileo multimercado ii': 'galileo-multimercado-2',
  'galileo acciones': 'galileo-acciones',
  'bcacca': 'galileo-acciones',
  'galileo event driven': 'galileo-event-driven',
  'galileo income': 'galileo-income',
  'galileo ahorro plus': 'galileo-ahorro-plus',
  'galileo ahorro': 'galileo-ahorro',
  'galileo renta fija': 'galileo-renta-fija',
  'galileo pesos': 'galileo-pesos',
  'galileo premium': 'galileo-premium',
  '4896': 'consultatio-deuda-arg',
  'consultatio deuda argentina': 'consultatio-deuda-arg',
  'consultatio deuda arg': 'consultatio-deuda-arg'
};

function rebalNorm(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\b(fci|clase|cl|esc|cta|fondo|abierto|ars|usd|de|del|la|el)\b/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

// Parser numérico tolerante (acepta formato AR 1.000,50 y US 1,000.50)
function rebalNum(raw) {
  let s = String(raw).replace(/[^\d.,]/g, '');
  if (!s) return NaN;
  const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  let dec = -1;
  if (lastComma > -1 && lastDot > -1) dec = Math.max(lastComma, lastDot);
  else if (lastComma > -1) { const after = s.length - lastComma - 1, cnt = (s.match(/,/g) || []).length; dec = (cnt === 1 && after !== 3) ? lastComma : -1; }
  else if (lastDot > -1) { const after = s.length - lastDot - 1, cnt = (s.match(/\./g) || []).length; dec = (cnt === 1 && after !== 3) ? lastDot : -1; }
  let intp, frac = '';
  if (dec > -1) { intp = s.slice(0, dec).replace(/[.,]/g, ''); frac = s.slice(dec + 1).replace(/[.,]/g, ''); }
  else intp = s.replace(/[.,]/g, '');
  const n = parseFloat(intp + (frac ? '.' + frac : ''));
  return isNaN(n) ? NaN : n;
}

// Resuelve un activo a partir de una línea pegada
function rebalResolveAsset(line, tokens) {
  // 1) ticker directo (bonos, lecaps, acciones, cedears, etfs)
  for (const tk of tokens) {
    const up = tk.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (up && ACTIVOS_BY_ID[up]) return up;
  }
  const norm = rebalNorm(line);
  // 2) alias por código o nombre comercial
  for (const tk of tokens) {
    const k = tk.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (REBAL_ALIASES[k]) return REBAL_ALIASES[k];
  }
  for (const k in REBAL_ALIASES) {
    if (k.indexOf(' ') > -1 && norm.indexOf(rebalNorm(k)) > -1) return REBAL_ALIASES[k];
  }
  // 3) match por nombre contra el universo (sobre todo FCIs)
  let best = null, bestLen = 0;
  for (const a of ACTIVOS) {
    const an = rebalNorm(a.name);
    if (an.length < 4) continue;
    if (norm.indexOf(an) > -1 && an.length > bestLen) { best = a.id; bestLen = an.length; }
  }
  return best;
}

function parseRebal(raw) {
  const lines = (raw || '').split(/\r?\n/);
  const holdings = {}; // id -> monto (o pct)
  const unmatched = [];
  let sawValue = false;
  const parsed = [];
  let pctVotes = 0, montoVotes = 0;
  for (let line of lines) {
    line = line.trim();
    if (!line) continue;
    if (!/\d/.test(line)) continue; // encabezados sin números
    // ignora solo filas que claramente NO son tenencia (órdenes y encabezado de liquidez proyectada de IOL)
    if (/ejecuci[oó]n|cancelad|liquidez proyectada|exportar a excel|\b(venta|compra)\s+24/i.test(line)) continue;
    const tokens = line.split(/[\s\t]+/).filter(Boolean);
    const id = rebalResolveAsset(line, tokens);
    const pctMatch = line.match(/([\d.,]+)\s*%/);
    const pct = pctMatch ? rebalNum(pctMatch[1]) : NaN;
    // números que NO llevan % (para detectar el "Valor Actual")
    const lineForNums = line.replace(/[\d.,]+\s*%/g, ' ');
    const nums = (lineForNums.match(/[\d][\d.,]*/g) || []).map(rebalNum).filter(n => !isNaN(n) && n > 0);
    const monto = nums.length ? Math.max(...nums) : NaN;
    // clasifica la línea: "% suelto" (ej. TX26 3.14%) vs fila con montos (grilla IOL)
    let kind = 'none';
    if (!isNaN(pct) && nums.length <= 1) kind = 'pct';
    else if (!isNaN(monto)) kind = 'monto';
    else if (!isNaN(pct)) kind = 'pct';
    parsed.push({ id, line, pct, monto, kind });
    if (id) { if (kind === 'pct') pctVotes++; else if (kind === 'monto') montoVotes++; }
  }
  const pctMode = pctVotes > montoVotes;
  for (const p of parsed) {
    if (!p.id) { if (!isNaN(p.monto) || !isNaN(p.pct)) unmatched.push(p.line); continue; }
    let val = pctMode ? p.pct : (!isNaN(p.monto) ? p.monto : p.pct);
    if (isNaN(val)) { unmatched.push(p.line); continue; }
    holdings[p.id] = (holdings[p.id] || 0) + val;
    sawValue = true;
  }
  let totalMonto = 0;
  if (!pctMode) { for (const k in holdings) totalMonto += holdings[k]; }
  // a porcentajes
  const pctMap = {};
  if (pctMode) { for (const k in holdings) pctMap[k] = holdings[k]; }
  else if (totalMonto > 0) { for (const k in holdings) pctMap[k] = holdings[k] / totalMonto * 100; }
  return { pctMap, montoMap: pctMode ? null : holdings, totalMonto: pctMode ? 0 : totalMonto, unmatched, pctMode, has: sawValue };
}

// ---- Importación de archivos (Excel/CSV/PDF) e imagen (OCR) ----
const _rebalScriptCache = {};
function rebalLoadScript(url) {
  if (_rebalScriptCache[url]) return _rebalScriptCache[url];
  _rebalScriptCache[url] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.onload = () => res(); s.onerror = () => rej(new Error('No se pudo cargar la librería'));
    document.head.appendChild(s);
  });
  return _rebalScriptCache[url];
}

function rebalSetStatus(msg) { state.rebal.status = msg; render(); }

function rebalApplyText(text, src) {
  text = (text || '').trim();
  if (!text) { rebalSetStatus('No encontré datos legibles en ' + src + '.'); return; }
  state.rebal.raw = text;
  try { localStorage.setItem('sc-cm-rebal', state.rebal.raw); } catch (e) {}
  const r = parseRebal(state.rebal.raw);
  const n = Object.keys(r.pctMap).length;
  state.rebal.status = n ? ('Listo — leí ' + n + ' activo' + (n > 1 ? 's' : '') + ' de ' + src + '. Revisá los valores en el cuadro.') : ('Leí ' + src + ' pero no reconocí activos. Revisá/editá el texto del cuadro.');
  render();
}

async function rebalExtractSheet(file) {
  await rebalLoadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const out = [];
  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, blankrows: false, raw: false });
    rows.forEach(row => { if (row && row.length) out.push(row.map(c => c == null ? '' : String(c)).join('\t')); });
  });
  return out.join('\n');
}

async function rebalExtractPdf(file) {
  await rebalLoadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const byY = {};
    tc.items.forEach(it => { if (!it.str) return; const y = Math.round(it.transform[5]); (byY[y] = byY[y] || []).push(it); });
    Object.keys(byY).map(Number).sort((a, b) => b - a).forEach(y => {
      const items = byY[y].sort((a, b) => a.transform[4] - b.transform[4]);
      const ln = items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
      if (ln) lines.push(ln);
    });
  }
  return lines.join('\n');
}

async function rebalExtractImage(file) {
  await rebalLoadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const out = await Tesseract.recognize(file, 'eng');
  return out && out.data && out.data.text ? out.data.text : '';
}

async function rebalImportFile(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const name = (file.name || '').toLowerCase();
  try {
    rebalSetStatus('Leyendo ' + file.name + '…');
    let text;
    if (name.endsWith('.pdf')) text = await rebalExtractPdf(file);
    else text = await rebalExtractSheet(file);
    rebalApplyText(text, file.name);
  } catch (e) {
    rebalSetStatus('No pude leer el archivo (' + (e && e.message ? e.message : e) + '). Probá copiando el texto a mano.');
  }
}

async function rebalImportImage(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  try {
    rebalSetStatus('Leyendo imagen con OCR (puede tardar unos segundos)…');
    const text = await rebalExtractImage(file);
    rebalApplyText(text, file.name);
    state.rebal.status = '⚠ Imagen leída por OCR — verificá bien los números antes de usar el plan.';
    render();
  } catch (e) {
    rebalSetStatus('No pude leer la imagen (' + (e && e.message ? e.message : e) + '). Probá con Excel/PDF o copiando el texto.');
  }
}

function buildRebalanceo(id) {
  const t = state.templates[id];
  const moneda = t.moneda === 'USD' ? 'USD' : 'ARS';
  const raw = state.rebal.raw || '';
  const ph = 'Pegá la cartera del cliente — un activo por línea: ticker y monto (o %).\nEj:\nTX26 514904\nS30N6 47293\nGALILEO MULTIMERCADO IV 3172206\nConsultatio Deuda Arg 4384166';
  const status = state.rebal.status || '';
  const cashVal = state.rebal.cash || 0;
  const cashDisplay = cashVal > 0 ? cashVal.toLocaleString('es-AR') : '';

  const importBar = `
    <div class="rebal-import">
      <label class="btn rebal-import-btn">📄 Subir Excel / CSV / PDF
        <input type="file" accept=".xlsx,.xls,.csv,.pdf" onchange="rebalImportFile(this)">
      </label>
      <label class="btn rebal-import-btn">🖼️ Subir imagen<span class="rebal-beta">beta</span>
        <input type="file" accept="image/*" onchange="rebalImportImage(this)">
      </label>
      ${raw.trim() ? `<button class="btn btn-warn" onclick="setRebalInput('')">🗑 Limpiar</button>` : ''}
      ${status ? `<span class="rebal-import-status">${status.replace(/</g, '&lt;')}</span>` : ''}
    </div>`;

  const inputBlock = `
    <p class="rebal-sub">Pegá la posición del cliente (de cualquier ALyC) o subí el archivo, y te digo qué <strong style="color:var(--red)">vender</strong>, qué <strong style="color:var(--green)">comprar</strong> y cómo ponderar para llegar a este modelo (<strong>${t.perfil}</strong>). Funciona con <code>TICKER monto</code> o <code>TICKER %</code>.</p>
    ${importBar}
    <textarea class="rebal-input" placeholder="${ph.replace(/"/g, '&quot;')}" onchange="setRebalInput(this.value)">${raw.replace(/</g, '&lt;')}</textarea>
    <div class="rebal-cash-wrap">
      <span class="rebal-cash-label">💵 Efectivo / disponible sin invertir</span>
      <span class="ordenes-cur">${moneda === 'USD' ? 'US$' : '$'}</span>
      <input type="text" inputmode="decimal" class="rebal-cash-input" value="${cashDisplay}" placeholder="0"
             onchange="setRebalCash(this.value)" onkeydown="if(event.key==='Enter')this.blur();">
      <span class="rebal-cash-hint">Se suma al total y se reparte en las compras</span>
    </div>`;

  if (!raw.trim()) {
    return `<div class="rebal-section">
      <div class="rebal-head"><h3>🔄 ¿Qué vender y qué comprar?</h3></div>
      ${inputBlock}
      <div class="rebal-empty">Cuando pegues la cartera, acá aparece el plan de rebalanceo contra esta cartera modelo.</div>
    </div>`;
  }

  const res = parseRebal(raw);
  const target = t.blocks || {};
  // contempla el efectivo disponible: se suma al total y baja la ponderación de cada activo
  const cash = state.rebal.cash || 0;
  let pctMap = res.pctMap, totalMonto = res.totalMonto, montoMap = res.montoMap, cashPct = 0;
  if (!res.pctMode && cash > 0) {
    const eff = res.totalMonto + cash;
    totalMonto = eff;
    pctMap = {};
    for (const k in res.montoMap) pctMap[k] = res.montoMap[k] / eff * 100;
    cashPct = eff > 0 ? cash / eff * 100 : 0;
  }
  const ids = new Set([...Object.keys(pctMap), ...Object.keys(target).filter(k => Number(target[k]) > 0)]);
  const THR = 0.5;
  const groups = { vender: [], reducir: [], nuevo: [], aumentar: [], mantener: [] };
  let sumCur = 0, sumTgt = 0;

  ids.forEach(aid => {
    const cur = pctMap[aid] || 0;
    const tgt = Number(target[aid]) || 0;
    sumCur += cur; sumTgt += tgt;
    const diff = tgt - cur;
    const row = { aid, cur, tgt, diff };
    if (cur > 0.001 && tgt === 0) groups.vender.push(row);
    else if (tgt > 0 && cur <= 0.001) groups.nuevo.push(row);
    else if (diff <= -THR) groups.reducir.push(row);
    else if (diff >= THR) groups.aumentar.push(row);
    else groups.mantener.push(row);
  });

  const fmtPp = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + ' pp';
  const moneyOf = pp => montoMap ? (pp / 100 * totalMonto) : null;

  function groupTable(rows, color, label, sortDesc) {
    if (!rows.length) return '';
    rows.sort((a, b) => sortDesc ? Math.abs(b.diff) - Math.abs(a.diff) : (b.tgt - a.tgt) || (b.cur - a.cur));
    let body = '';
    rows.forEach(r => {
      const a = ACTIVOS_BY_ID[r.aid];
      const name = a ? a.name : r.aid;
      const cat = a && CATEGORIES[a.category] ? CATEGORIES[a.category].label : '';
      const money = moneyOf(r.diff);
      const cls = r.diff >= 0 ? 'rebal-pos' : 'rebal-neg';
      let moneyCell = '—';
      if (money != null && Math.abs(money) >= 1) moneyCell = `<span class="rebal-money ${cls}">${money >= 0 ? '+' : '−'}${fmtPesos(Math.abs(money), moneda)}</span>`;
      body += `<tr>
        <td><span class="activo-dot" style="background:${getActivoColor(r.aid)};"></span><span class="rebal-name">${name}</span><div class="rebal-cat">${cat}</div></td>
        <td class="right"><span class="rebal-flow"><b>${r.cur.toFixed(1)}%</b> → <b>${r.tgt.toFixed(1)}%</b></span></td>
        <td class="right"><span class="rebal-delta ${cls}">${fmtPp(r.diff)}</span></td>
        <td class="right">${moneyCell}</td>
      </tr>`;
    });
    return `<div class="rebal-group">
      <div class="rebal-group-head" style="color:${color};"><span class="rebal-group-dot" style="background:${color};"></span>${label}<span class="rebal-group-count">· ${rows.length}</span></div>
      <table class="rebal-tabla"><tbody>${body}</tbody></table>
    </div>`;
  }

  const sections =
    groupTable(groups.vender, 'var(--red)', 'Vender (no va en este modelo)', false) +
    groupTable(groups.reducir, 'var(--yellow)', 'Reducir (estás sobre-ponderado)', true) +
    groupTable(groups.nuevo, 'var(--green)', 'Comprar (falta en la cartera)', false) +
    groupTable(groups.aumentar, 'var(--navy)', 'Aumentar (estás por debajo del target)', true) +
    groupTable(groups.mantener, 'var(--text-dim)', 'Mantener (ya está en target)', false);

  let warn = '';
  if (res.pctMode && Math.abs(sumCur - 100) >= 1) {
    warn += `<div class="rebal-warn">⚠ La cartera pegada suma ${sumCur.toFixed(1)}% (no 100%). Revisá que estén todos los activos.</div>`;
  }
  if (Math.abs(sumTgt - 100) >= 1) {
    warn += `<div class="rebal-warn">⚠ El modelo ${t.perfil} pondera ${sumTgt.toFixed(1)}% (no 100%). Balanceá la cartera modelo al 100% para que los montos cierren.</div>`;
  }

  let unmatched = '';
  if (res.unmatched.length) {
    const list = res.unmatched.slice(0, 8).map(l => l.length > 60 ? l.slice(0, 60) + '…' : l).join(' · ');
    unmatched = `<div class="rebal-unmatched"><strong>No reconocí ${res.unmatched.length} línea${res.unmatched.length > 1 ? 's' : ''}:</strong> ${list}. Probá poniendo el ticker exacto (ej. TX26) o el nombre del fondo.</div>`;
  }

  const meta = `<div class="rebal-meta">
    <span>Modelo: <strong>${t.perfil}</strong></span>
    ${totalMonto > 0 ? `<span>Total cartera: <strong>${fmtPesos(totalMonto, moneda)}</strong></span>` : ''}
    ${cash > 0 && !res.pctMode ? `<span>Efectivo: <strong>${fmtPesos(cash, moneda)} (${cashPct.toFixed(1)}%)</strong></span>` : ''}
    <span>Activos leídos: <strong>${Object.keys(pctMap).length}</strong></span>
  </div>`;

  let cashNote = '';
  if (cash > 0 && !res.pctMode) {
    cashNote = `<div class="rebal-cashnote">💵 El efectivo (${fmtPesos(cash, moneda)}) ya está contemplado en el total y se reparte en las compras de arriba para llegar al modelo.</div>`;
  } else if (res.pctMode && sumCur < 99) {
    cashNote = `<div class="rebal-cashnote">💵 Cargaste %: lo que falta para 100% (${(100 - sumCur).toFixed(1)}%) se toma como efectivo a invertir y se reparte en las compras.</div>`;
  }

  const hasAny = groups.vender.length || groups.reducir.length || groups.nuevo.length || groups.aumentar.length || groups.mantener.length;
  const copyBtn = hasAny ? `<button class="btn" onclick="copyRebalanceo('${id}')">⧉ Copiar plan</button>` : '';

  return `<div class="rebal-section">
    <div class="rebal-head"><h3>🔄 ¿Qué vender y qué comprar?</h3></div>
    ${inputBlock}
    ${meta}
    ${cashNote}
    ${sections || '<div class="rebal-empty">No encontré diferencias para mostrar.</div>'}
    ${warn}
    ${unmatched}
    ${copyBtn ? `<div class="rebal-actions">${copyBtn}</div>` : ''}
  </div>`;
}

function copyRebalanceo(id) {
  const t = state.templates[id];
  const moneda = t.moneda === 'USD' ? 'USD' : 'ARS';
  const res = parseRebal(state.rebal.raw || '');
  const target = t.blocks || {};
  const cash = state.rebal.cash || 0;
  let pctMap = res.pctMap, totalMonto = res.totalMonto, montoMap = res.montoMap;
  if (!res.pctMode && cash > 0) {
    const eff = res.totalMonto + cash;
    totalMonto = eff; pctMap = {};
    for (const k in res.montoMap) pctMap[k] = res.montoMap[k] / eff * 100;
  }
  const ids = new Set([...Object.keys(pctMap), ...Object.keys(target).filter(k => Number(target[k]) > 0)]);
  const THR = 0.5;
  const g = { vender: [], reducir: [], nuevo: [], aumentar: [], mantener: [] };
  ids.forEach(aid => {
    const cur = pctMap[aid] || 0, tgt = Number(target[aid]) || 0, diff = tgt - cur;
    const row = { aid, cur, tgt, diff };
    if (cur > 0.001 && tgt === 0) g.vender.push(row);
    else if (tgt > 0 && cur <= 0.001) g.nuevo.push(row);
    else if (diff <= -THR) g.reducir.push(row);
    else if (diff >= THR) g.aumentar.push(row);
    else g.mantener.push(row);
  });
  const nm = aid => (ACTIVOS_BY_ID[aid] ? ACTIVOS_BY_ID[aid].name : aid);
  const moneyOf = pp => montoMap ? (pp / 100 * totalMonto) : null;
  const lines = ['Rebalanceo → ' + t.title, 'Modelo: ' + t.perfil];
  if (totalMonto > 0) lines.push('Total cartera: ' + fmtPesos(totalMonto, moneda));
  if (cash > 0 && !res.pctMode) lines.push('Efectivo disponible: ' + fmtPesos(cash, moneda));
  lines.push('────────────────────');
  const block = (rows, title) => {
    if (!rows.length) return;
    lines.push(''); lines.push(title.toUpperCase());
    rows.forEach(r => {
      const money = moneyOf(r.diff);
      const mtxt = (money != null && Math.abs(money) >= 1) ? '  (' + (money >= 0 ? '+' : '−') + fmtPesos(Math.abs(money), moneda) + ')' : '';
      lines.push('   ' + nm(r.aid) + ' — ' + r.cur.toFixed(1) + '% → ' + r.tgt.toFixed(1) + '%' + mtxt);
    });
  };
  block(g.vender, 'Vender'); block(g.reducir, 'Reducir'); block(g.nuevo, 'Comprar'); block(g.aumentar, 'Aumentar'); block(g.mantener, 'Mantener');
  const text = lines.join('\n');
  const done = () => alert('Plan de rebalanceo copiado.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}

const IOL_PROXY = 'https://silvercloud-api.vercel.app/api/iol';

async function fetchTacticasPrices() {
  const allPicks = [...state.tacticasPicks.ar, ...state.tacticasPicks.cedears];
  if (allPicks.length === 0) {
    state.tacticasPrices.status = 'idle';
    if (state.current === 'tacticas') render();
    return;
  }
  state.tacticasPrices.status = 'loading';
  if (state.current === 'tacticas') render();
  try {
    const [accionesRes, cedearsRes] = await Promise.all([
      fetch(IOL_PROXY + '/v2/Cotizaciones/acciones/argentina/Todos').then(r => r.json()).catch(() => ({titulos:[]})),
      fetch(IOL_PROXY + '/v2/Cotizaciones/cedears/argentina/Todos').then(r => r.json()).catch(() => ({titulos:[]})),
    ]);
    const prices = {};
    (accionesRes.titulos || []).forEach(t => {
      if (t.simbolo) prices[t.simbolo] = { precio: t.ultimoPrecio, variacion: t.variacionPorcentual };
    });
    (cedearsRes.titulos || []).forEach(t => {
      if (t.simbolo) prices[t.simbolo] = { precio: t.ultimoPrecio, variacion: t.variacionPorcentual };
    });
    state.tacticasPrices.data = prices;
    state.tacticasPrices.status = 'ok';
    state.tacticasPrices.lastUpdate = new Date();
  } catch (e) {
    console.error('IOL fetch error:', e);
    state.tacticasPrices.status = 'error';
  }
  if (state.current === 'tacticas') render();
}

function calcYTD(pick, isCedear) {
  const price = state.tacticasPrices.data[pick.ticker];
  if (!price || !price.precio) return null;
  const precio31 = parseFloat(pick.precio31);
  if (isNaN(precio31) || precio31 <= 0) return null;
  if (isCedear) {
    const ratio = CEDEAR_RATIOS[pick.ticker];
    if (!ratio) return null;
    return ((price.precio - precio31) / precio31 * 100);
  }
  return ((price.precio - precio31) / precio31 * 100);
}

function formatYTD(ytd) {
  if (ytd === null || isNaN(ytd)) return { txt: '—', cls: 'neutral' };
  const sign = ytd >= 0 ? '+' : '';
  const cls = ytd >= 0 ? 'positive' : 'negative';
  return { txt: `${sign}${ytd.toFixed(1)}%`, cls };
}

function sgCarteraAssets() {
  const used = [];
  const seen = {};
  for (const id of ORDER) {
    const blocks = (state.templates[id] && state.templates[id].blocks) || {};
    for (const [aid, w] of Object.entries(blocks)) {
      if (Number(w) > 0 && !seen[aid]) { seen[aid] = true; used.push(aid); }
    }
  }
  return used;
}

function sgUsedAssets() {
  const used = sgCarteraAssets();
  const seen = {};
  used.forEach(a => seen[a] = true);
  // Sumar los agregados manualmente que no estén ya en una cartera
  for (const aid of (state.seguimiento.extra || [])) {
    if (!seen[aid]) { seen[aid] = true; used.push(aid); }
  }
  return used;
}

function sgIsExtra(activoId) {
  return (state.seguimiento.extra || []).includes(activoId) && !sgCarteraAssets().includes(activoId);
}

function openSgAdd(kind) {
  // kind: 'fci' (Fondos) o 'mkt' (Mercado)
  state.modal = { seguimiento: kind, view: 'categories', category: null, search: '' };
  render();
}

function removeSgExtra(activoId) {
  state.seguimiento.extra = (state.seguimiento.extra || []).filter(id => id !== activoId);
  saveSeguimiento();
  if (state.current === 'seguimiento') renderSeguimientoInto();
}

function sgBasePrice(activoId) {
  const b = state.seguimiento.base[activoId];
  return (b != null && !isNaN(b) && Number(b) > 0) ? Number(b) : null;
}

// ¿El activo es en dólares? (hard-dollar AR, CEDEARs/equity USA, ETFs, o moneda USD)
function sgIsUsd(activoId) {
  const a = ACTIVOS_BY_ID[activoId];
  if (!a) return false;
  if (a.moneda === 'USD') return true;
  return ['hd', 'etfs', 'equityUsa'].includes(a.category);
}

// ¿Se carga a mano (manual) o se toma de IOL?
// FCI -> siempre manual. Mercado -> override explícito si existe; si no, por defecto:
// dólares = manual, pesos = IOL.
function sgIsManual(activoId) {
  const a = ACTIVOS_BY_ID[activoId];
  if (a && a.type === 'fci') return true;
  const ov = state.seguimiento.mkt[activoId];
  if (ov === 'manual' || ov === true) return true;
  if (ov === 'iol') return false;
  return sgIsUsd(activoId);
}

function sgCurrentPrice(activoId, a) {
  if (sgIsManual(activoId)) {
    const v = state.seguimiento.vcp[activoId];
    return (v != null && !isNaN(v) && Number(v) > 0) ? Number(v) : null;
  }
  const p = state.seguimiento.iol.data[activoId];
  return (p && p.precio) ? Number(p.precio) : null;
}

function toggleSgMkt(activoId) {
  // Guarda el modo explícito (invierte el actual), así persiste tanto IOL como manual.
  state.seguimiento.mkt[activoId] = sgIsManual(activoId) ? 'iol' : 'manual';
  saveSeguimiento();
  if (state.current === 'seguimiento') renderSeguimientoInto();
}

function computeCarteraIndex(id) {
  const t = state.templates[id];
  const blocks = (t && t.blocks) || {};
  const entries = Object.entries(blocks).filter(([, v]) => Number(v) > 0);
  let totalW = 0, coveredW = 0, acc = 0;
  const rows = [];
  for (const [activoId, w] of entries) {
    const weight = Number(w);
    totalW += weight;
    const a = ACTIVOS_BY_ID[activoId];
    const base = sgBasePrice(activoId);
    const cur = sgCurrentPrice(activoId, a);
    let ret = null;
    if (base != null && cur != null) {
      const factor = cur / base;
      ret = factor - 1;
      acc += weight * factor;
      coveredW += weight;
    }
    rows.push({ activoId, name: a ? a.name : activoId, type: a ? a.type : '?', weight, base, cur, ret });
  }
  const index = coveredW > 0 ? acc / coveredW : null;
  const ret = index != null ? index - 1 : null;
  const coverage = totalW > 0 ? coveredW / totalW : 0;
  return { index, ret, coverage, totalW, coveredW, rows, hasBlocks: entries.length > 0 };
}

async function fetchSeguimientoPrices() {
  state.seguimiento.iol.status = 'loading';
  if (state.current === 'seguimiento') renderSeguimientoInto();
  try {
    const [acc, ced, tit, ltr] = await Promise.all([
      fetch(IOL_PROXY + '/v2/Cotizaciones/acciones/argentina/Todos').then(r => r.json()).catch(() => ({ titulos: [] })),
      fetch(IOL_PROXY + '/v2/Cotizaciones/cedears/argentina/Todos').then(r => r.json()).catch(() => ({ titulos: [] })),
      fetch(IOL_PROXY + '/v2/Cotizaciones/titulosPublicos/argentina/Todos').then(r => r.json()).catch(() => ({ titulos: [] })),
      fetch(IOL_PROXY + '/v2/Cotizaciones/letras/argentina/Todos').then(r => r.json()).catch(() => ({ titulos: [] })),
    ]);
    const prices = {};
    [acc, ced, tit, ltr].forEach(res => {
      (res.titulos || []).forEach(t => {
        if (t.simbolo) prices[t.simbolo] = { precio: t.ultimoPrecio, variacion: t.variacionPorcentual };
      });
    });
    state.seguimiento.iol.data = prices;
    state.seguimiento.iol.status = 'ok';
    state.seguimiento.iol.lastUpdate = new Date();
  } catch (e) {
    console.error('IOL seguimiento error:', e);
    state.seguimiento.iol.status = 'error';
  }
  if (state.current === 'seguimiento') renderSeguimientoInto();
}

function setSgBase(activoId, val) {
  const num = parseFloat(String(val).replace(/\./g, '').replace(',', '.'));
  const direct = parseFloat(String(val).replace(',', '.'));
  const use = !isNaN(direct) ? direct : num;
  if (val === '' || isNaN(use) || use <= 0) delete state.seguimiento.base[activoId];
  else state.seguimiento.base[activoId] = use;
  saveSeguimiento();
  if (state.current === 'seguimiento') renderSeguimientoInto();
}

function setSgVcp(activoId, val) {
  const direct = parseFloat(String(val).replace(',', '.'));
  if (val === '' || isNaN(direct) || direct <= 0) delete state.seguimiento.vcp[activoId];
  else state.seguimiento.vcp[activoId] = direct;
  saveSeguimiento();
  if (state.current === 'seguimiento') renderSeguimientoInto();
}

function sgFmt(n, dec) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function sgPct(r) {
  if (r == null || isNaN(r)) return { txt: '—', cls: 'sg-neutral' };
  const sign = r >= 0 ? '+' : '';
  return { txt: `${sign}${(r * 100).toFixed(2).replace('.', ',')}%`, cls: r >= 0 ? 'sg-pos' : 'sg-neg' };
}

function renderSgSummary() {
  let rows = '';
  for (const id of ORDER) {
    const t = state.templates[id];
    const r = computeCarteraIndex(id);
    const monClass = t.moneda === 'USD' ? 'usd' : t.moneda === 'MIX' ? 'mix' : 'ars';
    let idxCell, retCell, covCell;
    if (!r.hasBlocks) {
      idxCell = '<span class="sg-muted">cartera vacía</span>'; retCell = '—'; covCell = '—';
    } else if (r.index == null) {
      idxCell = '<span class="sg-muted">sin precios base</span>'; retCell = '—';
      covCell = `<span class="sg-cov sg-cov-none">0%</span>`;
    } else {
      const p = sgPct(r.ret);
      idxCell = `<span class="sg-index">${r.index.toFixed(4).replace('.', ',')}</span>`;
      retCell = `<span class="${p.cls}">${p.txt}</span>`;
      const covPct = Math.round(r.coverage * 100);
      const covCls = covPct >= 100 ? 'sg-cov-full' : 'sg-cov-part';
      covCell = `<span class="sg-cov ${covCls}">${covPct}%</span>`;
    }
    rows += `<tr>
      <td><span class="activo-name">${t.label}</span></td>
      <td><span class="moneda-pill ${monClass}">${t.moneda}</span></td>
      <td class="right">${idxCell}</td>
      <td class="right">${retCell}</td>
      <td class="right">${covCell}</td>
    </tr>`;
  }
  return `<table class="activos-tabla sg-table">
    <thead><tr>
      <th>Cartera</th><th>Moneda</th>
      <th class="right">Índice (base 1,00)</th>
      <th class="right">Desde 1/6</th>
      <th class="right">Cobertura</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderSeguimiento() {
  const st = state.seguimiento.iol.status;
  let dot = 'status-dot', txt = 'Precios IOL sin cargar';
  if (st === 'loading') { dot += ' loading'; txt = 'Cargando precios IOL...'; }
  else if (st === 'ok') { txt = 'Precios IOL en vivo'; }
  else if (st === 'error') { dot += ' error'; txt = 'Error IOL'; }
  const last = state.seguimiento.iol.lastUpdate
    ? state.seguimiento.iol.lastUpdate.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })
    : '--:--';
  const anyMercado = sgUsedAssets().some(aid => { const a = ACTIVOS_BY_ID[aid]; return !a || a.type !== 'fci'; });

  return `

    <div id="sg-summary">${renderSgSummary()}</div>

const CLI_ALYCS = ["INVIU", "Balanz", "Galileo"];

function escCli(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function parseMontoCli(str) {
  if (str == null) return 0;
  let s = String(str).trim().replace(/[^\d.,-]/g, '');
  if (s === '') return 0;
  if (s.indexOf(',') > -1) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else {
    const parts = s.split('.');
    if (parts.length > 2) s = s.replace(/\./g, '');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function cliUID() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function clienteUSD(r, fx) {
  const m = Number(r.monto) || 0;
  if (r.moneda === 'USD') return m;
  if (fx > 0) return m / fx;
  return null;
}

function addCliente() {
  state.clientes.rows.push({ id: cliUID(), nombre: '', comitente: '', alyc: '', cartera: '', moneda: 'ARS', monto: 0, estado: 'Pendiente', comentario: '' });
  saveClientes(); render();
}

function updateCliente(id, field, value) {
  const r = state.clientes.rows.find(x => x.id === id);
  if (!r) return;
  if (field === 'monto') r.monto = parseMontoCli(value);
  else r[field] = value;
  saveClientes();
  renderClientesInto();
}

function toggleEstado(id) {
  const r = state.clientes.rows.find(x => x.id === id);
  if (!r) return;
  r.estado = (r.estado === 'OK') ? 'Pendiente' : 'OK';
  saveClientes();
  renderClientesInto();
}

function editComentario(id) {
  const r = state.clientes.rows.find(x => x.id === id);
  if (!r) return;
  const actual = r.comentario || '';
  const txt = prompt('Comentario para ' + (r.nombre || 'esta cuenta') + ' (ej: tiene ONs por afuera que no se tocan):', actual);
  if (txt === null) return; // canceló
  r.comentario = txt.trim();
  saveClientes();
  renderClientesInto();
}

function deleteCliente(id) {
  const r = state.clientes.rows.find(x => x.id === id);
  const nom = (r && r.nombre) ? r.nombre : 'este cliente';
  if (!confirm('¿Borrar a ' + nom + '?')) return;
  state.clientes.rows = state.clientes.rows.filter(x => x.id !== id);
  saveClientes(); render();
}

function setClientesFx(value) {
  state.clientes.fx = parseMontoCli(value);
  saveClientes();
  renderClientesInto();
}

function renderClientesInto() {
  const content = document.getElementById('content');
  if (content) content.innerHTML = renderClientes();
}

function toggleCliente(id) {

  state.clientes.expanded[id] = !state.clientes.expanded[id];
  renderClientesInto();
}

function carteraIdDe(r) {
  if (!r || !r.cartera) return null;
  if (ORDER.includes(r.cartera)) return r.cartera;
  const found = ORDER.find(id => state.templates[id] && state.templates[id].label === r.cartera);
  return found || null;
}

const PERFIL_ORDER = ["PRESERVACIÓN", "MODERADA", "AGRESIVA", "RETORNO TOTAL"];

function perfilDe(r) {
  const cid = carteraIdDe(r);

function renderClienteDetalle(r) {
  const cid = carteraIdDe(r);
  if (!cid) return `<div class="cli-det-empty">Asign&aacute; una cartera a este cliente para ver los fondos sugeridos.</div>`;
  const entries = ordenesEntries(cid);
  const cartLabel = state.templates[cid] ? state.templates[cid].label : cid;
  if (!entries.length) return `<div class="cli-det-empty">La cartera &ldquo;${escCli(cartLabel)}&rdquo; todav&iacute;a no tiene activos cargados.</div>`;

  const monto = Number(r.monto) || 0;
  const moneda = r.moneda === 'USD' ? 'USD' : 'ARS';
  let rows = '', lastCat = null, totalPct = 0, totalM = 0;
  entries.forEach(([aid, pct]) => {
    const a = ACTIVOS_BY_ID[aid];
    const name = a ? a.name : aid;
    const p = Number(pct) || 0;
    const m = monto * p / 100;
    totalPct += p; totalM += m;
    if (a && a.category !== lastCat) {
      const cat = CATEGORIES[a.category];
      rows += `<tr class="cli-det-cat"><td colspan="3"><span class="cli-dot" style="background:${cat.color};"></span>${cat.label}</td></tr>`;
      lastCat = a.category;
    }
    rows += `<tr>
      <td><span class="cli-dot" style="background:${getActivoColor(aid)};"></span>${escCli(name)}</td>
      <td class="cli-r">${p.toFixed(1)}%</td>
      <td class="cli-r cli-det-m">${monto > 0 ? fmtPesos(m, moneda) : '&mdash;'}</td>
    </tr>`;
  });

  let warn = '';
  if (Math.abs(totalPct - 100) >= 0.01) {
    warn = `<div class="cli-det-warn">&#9888; La cartera pondera ${totalPct.toFixed(1)}% (no 100%). Balance&aacute;la al 100% para asignar todo el monto.</div>`;
  }

  return `
    <div class="cli-det">
      <div class="cli-det-h">${escCli(cartLabel)} &middot; objetivo sobre ${monto > 0 ? fmtPesos(monto, moneda) : '(cargá el monto del cliente)'}</div>

          ${rows}

        </tbody>
      </table>
      ${warn}
    </div>`;
}
