<!DOCTYPE html>
<html lang="es" data-darkreader-mode="ignore">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark only">
<meta name="darkreader-lock">
<title>SilverCloud Advisors — Carteras Modelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
  }
  html {
    color-scheme: dark only;
    background: #0d1117;
  }
  body {
    color-scheme: dark only;
  }
  :root {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --bg-card: #1a2030;
    --bg-card-2: #1c2330;
    --border: #2a3343;
    --border-soft: #1e2533;
    --text: #d8dee9;
    --text-bright: #f0f6fc;
    --text-dim: #8b95a8;
    --text-light: #6b748a;
    /* Paleta SilverCloud oficial */
    --navy: #5b86c7;
    --navy-2: #4b73b0;
    --navy-3: #3c5f96;
    --navy-4: #2d4c7c;
    --navy-5: #243656;
    --violet: #a37bc7;
    --violet-2: #8e65b4;
    --violet-3: #785095;
    --violet-4: #5e3c79;
    --violet-5: #3f2854;
    --gray-light: #B5C1CC;
    --gray-2: #95a3b0;
    --gray-3: #7a8896;

    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;

    /* Categorías SC — Activos directos (tonos navy y derivados) */
    --c-liquidez: #B5C1CC;
    --c-lecap: #5b86c7;
    --c-dual: #4b73b0;
    --c-cer: #95a3b0;
    --c-hd: #2d4c7c;
    --c-equity-ar: #c95757;
    --c-equity-usa: #a37bc7;
    --c-etfs: #785095;

    /* Categorías SC — FCIs (tonos violet y derivados) */
    --c-fci-mm: #d4cee0;
    --c-fci-tasa: #95a3b0;
    --c-fci-cer: #c0bbd0;
    --c-fci-dlk: #8e65b4;
    --c-fci-usd: #5e3c79;
    --c-fci-acc: #d2a8ff;
    --c-fci-pymes: #c95757;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Open Sans', sans-serif; font-weight: 300; font-size: 14px; line-height: 1.6; padding: 24px; }
  .container { max-width: 1200px; margin: 0 auto; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); text-decoration: none; margin-bottom: 16px; transition: color 0.15s; font-weight: 400; }
  .back-link:hover { color: var(--navy); }
  .header { border-bottom: 2px solid var(--navy); padding-bottom: 20px; margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; }
  .header-brand h1 { margin: 0; font-family: 'Libre Baskerville', serif; font-style: italic; font-weight: 400; font-size: 26px; color: var(--text-bright); }
  .header-brand h1 strong { color: var(--navy); font-weight: 700; }
  .header-brand .brand-line { font-weight: 300; color: var(--text-dim); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; font-family: inherit; font-weight: 400; font-size: 11px; cursor: pointer; border-radius: 2px; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.8px; }
  .btn:hover { background: var(--navy); color: white; border-color: var(--navy); }
  .btn-warn:hover { background: var(--yellow); border-color: var(--yellow); color: #1a1a1a; }
  .btn-danger:hover { background: var(--red); border-color: var(--red); color: white; }
  .main-tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .main-tab { background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-dim); padding: 12px 18px; font-family: inherit; font-size: 12px; cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; margin-bottom: -1px; }
  .main-tab:hover { color: var(--text-bright); }
  .main-tab.active { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }
  .main-tab .edit-dot { color: var(--violet); margin-left: 6px; font-size: 10px; }
  .overview-section { margin-bottom: 32px; }
  .overview-section h3 { font-family: 'Libre Baskerville', serif; font-style: italic; color: var(--text-bright); font-size: 18px; font-weight: 400; margin: 0 0 18px 0; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .moneda-pill { font-style: normal; font-size: 10px; padding: 3px 10px; border-radius: 2px; font-weight: 600; letter-spacing: 1px; }
  .moneda-pill.ars { background: var(--violet); color: var(--bg); }
  .moneda-pill.usd { background: var(--navy); color: white; }
  .overview-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 800px) { .overview-grid { grid-template-columns: 1fr; } }
  .overview-section .overview-column {
    display: grid;
    grid-template-rows: repeat(3, 1fr);
    gap: 20px;
    align-items: stretch;
  }
  .overview-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 20px; cursor: pointer; transition: all 0.2s; text-align: center; display: flex; flex-direction: column; }
  .overview-card .legend { flex: 1; }
  .overview-card:hover { border-color: var(--navy); background: var(--bg-card-2); box-shadow: 0 4px 16px rgba(91, 134, 199, 0.15); transform: translateY(-2px); }
  .overview-card svg { width: 100%; max-width: 200px; height: auto; margin: 0 auto; display: block; }
  .overview-card .perfil { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; font-weight: 600; }
  .overview-card .nombre { font-family: 'Libre Baskerville', serif; font-size: 16px; color: var(--text-bright); font-weight: 400; margin-bottom: 14px; }
  .overview-card .empty { color: var(--text-light); font-size: 11px; margin-top: 10px; font-style: italic; }
  .legend { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 6px; text-align: left; max-height: 220px; overflow-y: auto; }
  .legend-item { display: flex; align-items: center; gap: 10px; font-size: 11px; }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-val { color: var(--text-bright); font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 28px; margin-bottom: 16px; }
  .portfolio-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .portfolio-title { flex: 1; min-width: 280px; }
  .portfolio-title h2 { font-family: 'Libre Baskerville', serif; font-style: italic; margin: 10px 0 0 0; font-size: 22px; color: var(--text-bright); font-weight: 400; }
  .portfolio-title .description { color: var(--text-dim); font-size: 13px; margin-top: 8px; max-width: 600px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 2px; font-size: 10px; font-weight: 600; letter-spacing: 1px; margin-right: 6px; text-transform: uppercase; }
  .badge-pesos { background: var(--violet); color: var(--bg); }
  .badge-usd { background: var(--navy); color: white; }
  .badge-conservador { background: var(--gray-light); color: #1a1a1a; }
  .badge-moderado { background: var(--yellow); color: var(--bg); }
  .badge-agresivo { background: var(--red); color: white; }
  .badge-edited { background: transparent; color: var(--violet); border: 1px solid var(--violet); margin-left: 6px; }
  .portfolio-actions { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  .main-grid { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 28px; margin-bottom: 20px; }
  @media (max-width: 800px) { .main-grid { grid-template-columns: 1fr; } }
  .donut-wrapper { display: flex; flex-direction: column; align-items: center; }
  .donut-wrapper svg { width: 100%; max-width: 320px; height: auto; }
  .meta-line { margin-top: 14px; text-align: center; font-size: 11px; color: var(--text-dim); line-height: 1.8; }
  .meta-line strong { color: var(--text-bright); font-weight: 600; }
  table.activos-tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.activos-tabla thead th { text-align: left; color: var(--text-dim); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 10px 6px; border-bottom: 1px solid var(--border); }
  table.activos-tabla thead th.right { text-align: right; }
  table.activos-tabla td { padding: 10px 6px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  table.activos-tabla td.right { text-align: right; font-variant-numeric: tabular-nums; }
  .activo-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; vertical-align: middle; }
  .activo-name { color: var(--text-bright); font-weight: 600; font-size: 13px; }
  .activo-cat { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; padding-left: 20px; }
  tr.cat-subheader td {
    padding: 14px 6px 6px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .cat-subheader-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
  }
  .pct-input { background: var(--bg); border: 1px solid var(--border); color: var(--text-bright); font-family: inherit; font-size: 14px; font-weight: 600; text-align: right; padding: 5px 10px; width: 70px; border-radius: 2px; transition: all 0.15s; font-variant-numeric: tabular-nums; }
  .pct-input:hover { border-color: var(--text-dim); }
  .pct-input:focus { outline: none; border-color: var(--navy); background: var(--bg-card-2); box-shadow: 0 0 0 2px rgba(91, 134, 199, 0.15); }
  .pct-suffix { color: var(--text-dim); font-size: 12px; margin-left: 3px; }
  .btn-remove { background: transparent; border: 1px solid transparent; color: var(--text-light); width: 24px; height: 24px; cursor: pointer; border-radius: 2px; font-size: 14px; line-height: 1; padding: 0; transition: all 0.15s; margin-left: 8px; }
  .btn-remove:hover { border-color: var(--red); color: var(--red); background: rgba(248, 81, 73, 0.1); }
  tr.add-row td { border-bottom: none; padding: 14px 6px; }
  .add-cta { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; background: var(--bg-soft); border: 1px dashed var(--border); border-radius: 4px; cursor: pointer; transition: all 0.15s; color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .add-cta:hover { border-color: var(--violet); color: var(--violet); background: rgba(163, 123, 199, 0.05); }
  .add-cta-icon { font-size: 16px; }
  tr.empty-row td { padding: 32px 12px; text-align: center; color: var(--text-dim); font-size: 13px; font-style: italic; border-bottom: none; }
  tr.total-row td { border-top: 2px solid var(--navy); border-bottom: none; padding-top: 14px; }
  .total-value { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 18px; color: var(--text-bright); }
  .total-value.error { color: var(--red); }
  .total-value.warning { color: var(--yellow); }
  .total-value.ok { color: var(--green); }
  .total-status { font-size: 10px; color: var(--text-dim); margin-top: 3px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .total-status.error { color: var(--red); }
  .total-status.warning { color: var(--yellow); }
  .total-status.ok { color: var(--green); }
  .editor-help { background: var(--bg-soft); border: 1px solid var(--border); border-left: 3px solid var(--navy); border-radius: 0 2px 2px 0; padding: 10px 14px; font-size: 11px; color: var(--text-dim); margin-top: 14px; line-height: 1.7; }
  .editor-help kbd { background: var(--bg-card); border: 1px solid var(--border); border-radius: 2px; padding: 2px 6px; font-size: 10px; color: var(--navy); font-weight: 600; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; width: 100%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-family: 'Libre Baskerville', serif; font-style: italic; color: var(--text-bright); font-size: 18px; font-weight: 400; margin: 0; }
  .modal-close { background: transparent; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; padding: 0; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 3px; }
  .modal-close:hover { color: var(--red); background: rgba(248, 81, 73, 0.1); }
  .modal-search { padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--bg-soft); }
  .modal-search input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; font-family: inherit; font-size: 13px; border-radius: 3px; }
  .modal-search input:focus { outline: none; border-color: var(--navy); }
  .modal-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--bg-soft); overflow-x: auto; flex-wrap: nowrap; }
  .modal-tab { background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-dim); padding: 10px 14px; font-family: inherit; font-size: 11px; cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap; margin-bottom: -1px; }
  .modal-tab:hover { color: var(--text-bright); }
  .modal-tab.active { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }
  .modal-tab .count { color: var(--text-light); font-size: 10px; margin-left: 4px; }
  .modal-body { flex: 1; overflow-y: auto; padding: 8px 0; }
  .activo-pick-item { padding: 10px 24px; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-soft); }
  .activo-pick-item:hover { background: var(--bg-card-2); }
  .activo-pick-item.disabled { opacity: 0.4; cursor: not-allowed; }
  .activo-pick-item.disabled:hover { background: transparent; }
  .activo-pick-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .activo-pick-info { flex: 1; min-width: 0; }
  .activo-pick-name { color: var(--text-bright); font-weight: 600; font-size: 13px; }
  .activo-pick-meta { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
  .activo-pick-cat { color: var(--text-light); font-size: 16px; flex-shrink: 0; padding: 0 4px; }
  .activo-pick-added { color: var(--green); font-size: 11px; font-weight: 600; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-subgroup-header { padding: 14px 24px 6px; color: var(--text-dim); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; background: var(--bg-soft); border-bottom: 1px solid var(--border-soft); border-top: 1px solid var(--border-soft); }

  /* Cards de categorías */
  .cat-section-title {
    padding: 16px 24px 8px;
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding: 0 24px 16px;
  }
  @media (max-width: 600px) { .cat-grid { grid-template-columns: 1fr; } }

  .cat-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .cat-card:hover {
    border-color: var(--violet);
    background: var(--bg-card-2);
  }
  .cat-card-empty {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .cat-card-empty:hover {
    border-color: var(--border);
    background: var(--bg);
  }
  .cat-card-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cat-card-info { flex: 1; min-width: 0; }
  .cat-card-name {
    color: var(--text-bright);
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
  }
  .cat-card-meta {
    color: var(--text-dim);
    font-size: 11px;
  }
  .cat-card-arrow {
    color: var(--text-light);
    font-size: 14px;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .cat-card:hover .cat-card-arrow { color: var(--violet); }

  /* Back button del modal */
  .modal-back {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    flex-shrink: 0;
  }
  .modal-back:hover { border-color: var(--violet); color: var(--violet); }
  .footer-note { color: var(--text-light); font-size: 10px; text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); }
  .footer-note .firm-name { font-family: 'Libre Baskerville', serif; font-style: italic; color: var(--navy); font-size: 11px; }

  /* === Análisis de Cartera === */
  .analysis-section {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .analysis-title {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    color: var(--text-bright);
    font-size: 18px;
    font-weight: 400;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .analysis-title-icon {
    font-size: 16px;
    opacity: 0.8;
  }
  .analysis-block {
    margin-bottom: 24px;
  }
  .analysis-block-header {
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .analysis-summary.editing { padding: 0; }
  .analysis-summary textarea {
    width: 100%;
    min-height: 100px;
    background: var(--bg);
    border: 1px solid var(--navy);
    color: var(--text-bright);
    font-family: inherit;
    font-size: 13px;
    line-height: 1.6;
    padding: 14px 16px;
    border-radius: 3px;
    resize: vertical;
  }
  .analysis-summary textarea:focus { outline: none; border-color: var(--violet); }
  .analysis-edit-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    justify-content: flex-end;
  }
  .analysis-edit-btn {
    background: transparent;
    border: none;
    color: var(--violet);
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    padding: 4px 8px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
    border-radius: 2px;
  }
  .analysis-edit-btn:hover { color: var(--text-bright); background: var(--bg-card-2); }
  .analysis-edit-btn.reset { color: var(--text-dim); }

  .bar-chart { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .bar-row .bar-label {
    flex: 0 0 160px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-row .bar-container {
    flex: 1;
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-row .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s;
  }
  .bar-row .bar-val {
    flex: 0 0 50px;
    text-align: right;
    color: var(--text-bright);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .aporte-list { display: flex; flex-direction: column; gap: 10px; }
  .aporte-item {
    background: var(--bg-soft);
    border: 1px solid var(--border-soft);
    border-radius: 3px;
    padding: 10px 14px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: start;
  }
  .aporte-item .aporte-dot {
    width: 8px;
    height: 8px;

const ACTIVOS_BY_ID = Object.fromEntries(ACTIVOS.map(a => [a.id, a]));

// ============================================
// Colores por activo - cada activo tiene un tono ÚNICO
// derivado del color base de su categoría, generado por HSL rotation
// ============================================
const ACTIVO_COLORS = (() => {
  // Categorías base en HSL para generar variaciones
  // hue, sat, lum base de cada categoría
  const CAT_HSL = {
    liquidez:        { h: 210, s: 15, l: 75 },  // gris claro
    lecap:           { h: 215, s: 50, l: 57 },  // navy claro
    dual:            { h: 215, s: 45, l: 48 },  // navy medio
    cer:             { h: 210, s: 12, l: 64 },  // gris azulado
    hd:              { h: 215, s: 50, l: 33 },  // navy oscuro
    equityAr:        { h: 0,   s: 50, l: 56 },  // rojo coral
    equityUsa:       { h: 275, s: 35, l: 63 },  // violet claro
    etfs:            { h: 275, s: 30, l: 45 },  // violet medio
    fciMM:           { h: 270, s: 22, l: 84 },  // violet pastel
    fciTasa:         { h: 210, s: 12, l: 64 },  // gris azulado
    fciCer:          { h: 270, s: 20, l: 78 },  // violet rosáceo
    fciDlk:          { h: 275, s: 30, l: 55 },  // violet medio claro
    fciUsd:          { h: 280, s: 33, l: 35 },  // violet oscuro
    fciAcciones:     { h: 275, s: 100, l: 82 }, // violet brillante
    fciPymes:        { h: 0,   s: 50, l: 56 },  // rojo coral
  };

  // Para cada categoría, generar N colores variados rotando hue + ajustando lightness
  const colors = {};
  const byCat = {};
  ACTIVOS.forEach(a => {
    if (!byCat[a.category]) byCat[a.category] = [];
    byCat[a.category].push(a.id);
  });

  Object.keys(byCat).forEach(cat => {
    const base = CAT_HSL[cat] || { h: 220, s: 30, l: 50 };
    const ids = byCat[cat];
    const n = ids.length;
    ids.forEach((id, i) => {
      // Rotación de hue ± 25° y variación de lightness ± 15
      const hueOffset = ((i / Math.max(n - 1, 1)) - 0.5) * 50;
      const lumOffset = ((i / Math.max(n - 1, 1)) - 0.5) * 25;
      const h = (base.h + hueOffset + 360) % 360;
      const l = Math.max(30, Math.min(85, base.l + lumOffset));
      colors[id] = `hsl(${h.toFixed(0)}, ${base.s}%, ${l.toFixed(0)}%)`;
    });
  });

  return colors;
})();

// Helper para obtener color de un activo (con fallback a categoría)
function getActivoColor(activoId) {
  if (ACTIVO_COLORS[activoId]) return ACTIVO_COLORS[activoId];
  const a = ACTIVOS_BY_ID[activoId];
  return a ? CATEGORIES[a.category]?.color : "#888";
}

  "p-agr": { label: "Pesos · Agresiva", perfil: "AGRESIVA", moneda: "ARS", badges: [["badge-pesos", "ARS"], ["badge-agresivo", "AGRESIVA"]], title: "Cartera Pesos · Agresiva", description: "Mandato en pesos con alta tolerancia al riesgo. Busca alpha vía duration, equity AR y posicionamiento ciclo electoral 2027.", horizon: "24+ meses", drawdown: "~20-25%", target: "CPI + 12/15%", blocks: {} },

  "u-mod": { label: "Dólar · Moderada", perfil: "MODERADA", moneda: "USD", badges: [["badge-usd", "USD"], ["badge-moderado", "MODERADA"]], title: "Cartera Dólar · Moderada", description: "Mandato en USD con tolerancia media al riesgo. Busca yield + appreciation vía exposición Argentina USD y equity USA selectivo.", horizon: "18-36 meses", drawdown: "~8-12%", target: "USD 7-9%", blocks: {} },
  "u-agr": { label: "Dólar · Agresiva", perfil: "AGRESIVA", moneda: "USD", badges: [["badge-usd", "USD"], ["badge-agresivo", "AGRESIVA"]], title: "Cartera Dólar · Agresiva", description: "Mandato en USD con alta tolerancia al riesgo. Maximiza alpha vía equity USA, equity AR y exposición soberana AR de mayor duration.", horizon: "36+ meses", drawdown: "~20-30%", target: "USD 12-15%", blocks: {} },
};

const ORDER = ["p-cons", "p-mod", "p-agr", "u-cons", "u-mod", "u-agr"];

let state = { current: "overview", templates: {}, modal: null, editingRationale: null };

function loadState() {
  try {
    const saved = localStorage.getItem("sc-carteras-modelo");
    if (saved) {
      state.templates = JSON.parse(saved);
      // Backfill metadata si falta (sin destruir carteras armadas)
      for (const id in TEMPLATES_BASE) {
        if (!state.templates[id]) {
          // Si no existe la cartera, copiar template base vacío
          state.templates[id] = JSON.parse(JSON.stringify(TEMPLATES_BASE[id]));
        } else {
          // Si existe, solo refrescar metadata (label, perfil, badges, etc.)
          // PERO mantener el blocks armado por el usuario
          for (const k of ["label","perfil","moneda","badges","title","description","horizon","drawdown","target"]) {
            if (state.templates[id][k] === undefined || TEMPLATES_BASE[id][k] !== undefined) {
              state.templates[id][k] = TEMPLATES_BASE[id][k];
            }
          }
          // Asegurar que blocks exista
          if (!state.templates[id].blocks) state.templates[id].blocks = {};
        }
      }
      saveState();
      return;
    }
  } catch (e) { console.warn(e); }
  // Solo si NO hay nada en localStorage, cargar base vacía
  state.templates = JSON.parse(JSON.stringify(TEMPLATES_BASE));
}

function saveState() {
  try { localStorage.setItem("sc-carteras-modelo", JSON.stringify(state.templates)); }
  catch (e) { console.warn(e); }
}

function isEdited(id) {
  const blocks = state.templates[id]?.blocks || {};
  return Object.keys(blocks).length > 0;
}

function resetPortfolio(id) {
  if (!confirm(`¿Resetear "${TEMPLATES_BASE[id].label}"?`)) return;
  state.templates[id] = JSON.parse(JSON.stringify(TEMPLATES_BASE[id]));
  saveState(); render();
}

function resetAll() {
  if (!confirm("¿Resetear las 6 carteras?")) return;
  state.templates = JSON.parse(JSON.stringify(TEMPLATES_BASE));
  saveState(); render();
}

function exportAllJSON() {
  const blob = new Blob([JSON.stringify(state.templates, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `silvercloud-carteras-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm("¿Reemplazar las carteras actuales?")) return;
      state.templates = data;
      saveState(); render();
    } catch (err) { alert("Error: " + err.message); }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function buildDonut(blocks, opts = {}) {
  const { size = 320, showCenter = true } = opts;
  const entries = Object.entries(blocks).filter(([k, v]) => Number(v) > 0);
  const total = entries.reduce((s, [, v]) => s + Number(v), 0);
  const cx = size/2, cy = size/2;
  const rOut = size * 0.41;
  const rIn = size * 0.25;
  if (total === 0) {
    return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
      <circle cx="${cx}" cy="${cy}" r="${rOut}" fill="none" stroke="#2a3343" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="11" fill="#6b748a">SIN ACTIVOS</text>
    </svg>`;
  }
  let acc = -90;
  const paths = entries.map(([activoId, val]) => {
    const sweep = (Number(val) / total) * 360;
    const start = acc, end = acc + sweep;
    acc = end;
    const r1 = (start * Math.PI) / 180, r2 = (end * Math.PI) / 180;
    const x1 = cx + rOut * Math.cos(r1), y1 = cy + rOut * Math.sin(r1);
    const x2 = cx + rOut * Math.cos(r2), y2 = cy + rOut * Math.sin(r2);
    const x3 = cx + rIn * Math.cos(r2), y3 = cy + rIn * Math.sin(r2);
    const x4 = cx + rIn * Math.cos(r1), y4 = cy + rIn * Math.sin(r1);
    const largeArc = sweep > 180 ? 1 : 0;
    const color = getActivoColor(activoId);
    if (entries.length === 1) {
      return `<path d="M ${cx},${cy-rOut} A ${rOut},${rOut} 0 1,1 ${cx-0.01},${cy-rOut} L ${cx-0.01},${cy-rIn} A ${rIn},${rIn} 0 1,0 ${cx},${cy-rIn} Z" fill="${color}"/>`;
    }
    return `<path d="M ${x1.toFixed(2)},${y1.toFixed(2)} A ${rOut},${rOut} 0 ${largeArc},1 ${x2.toFixed(2)},${y2.toFixed(2)} L ${x3.toFixed(2)},${y3.toFixed(2)} A ${rIn},${rIn} 0 ${largeArc},0 ${x4.toFixed(2)},${y4.toFixed(2)} Z" fill="${color}"/>`;
  });
  const totalColor = Math.abs(total - 100) < 0.01 ? "#3fb950" : (total > 100 ? "#f85149" : "#d29922");
  let center = "";
  if (showCenter) {
    center = `
      <circle cx="${cx}" cy="${cy}" r="${rIn - 2}" fill="var(--bg-card)"/>
      <text x="${cx}" y="${cy - 8}" text-anchor="middle" font-size="${size*0.034}" fill="#8b95a8" style="letter-spacing: 1px;">TOTAL</text>
      <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="${size*0.075}" font-weight="700" fill="${totalColor}" style="font-family: 'Libre Baskerville', serif;">${total.toFixed(1)}%</text>
    `;
  }
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${paths.join('')}${center}</svg>`;
}

function buildLegend(blocks) {
  const items = Object.entries(blocks)
    .filter(([k, v]) => Number(v) > 0)
    .sort((a, b) => Number(b[1]) - Number(a[1]))
    .map(([activoId, val]) => {
      const activo = ACTIVOS_BY_ID[activoId];
      if (!activo) return "";
      const color = getActivoColor(activoId);
      return `<div class="legend-item">
        <span class="legend-dot" style="background: ${color};"></span>
        <span class="legend-name">${activo.name}</span>
        <span class="legend-val">${Number(val)}%</span>
      </div>`;
    }).join("");
  return `<div class="legend">${items}</div>`;
}

function renderOverviewCard(id) {
  const t = state.templates[id];
  const edited = isEdited(id);
  const isEmpty = !edited;
  return `<div class="overview-card" onclick="selectTab('${id}')">
    <div class="perfil">${t.perfil}</div>
    <div class="nombre">${t.label.split('·')[1].trim()}${edited ? ' <span style="color: var(--violet); font-size: 11px;">●</span>' : ''}</div>
    ${buildDonut(t.blocks, { size: 200 })}
    ${isEmpty ? '<div class="empty">Click para armar la cartera</div>' : buildLegend(t.blocks)}
  </div>`;
}

function renderOverview() {
  const arsCards = ORDER.filter(id => id.startsWith("p-")).map(renderOverviewCard).join("");
  const usdCards = ORDER.filter(id => id.startsWith("u-")).map(renderOverviewCard).join("");
  return `<div class="overview-grid">
    <div class="overview-section">
      <h3>Pesos <span class="moneda-pill ars">ARS</span></h3>
      <div class="overview-column">${arsCards}</div>
    </div>
    <div class="overview-section">
      <h3>Dólar <span class="moneda-pill usd">USD</span></h3>
      <div class="overview-column">${usdCards}</div>
    </div>
  </div>`;
}

function buildTable(id) {
  const t = state.templates[id];
  const blocks = t.blocks;
  const entries = Object.entries(blocks);
  let rowsHtml;
  if (entries.length === 0) {
    rowsHtml = `<tr class="empty-row"><td colspan="2">
      Esta cartera está vacía. Click en <strong style="color: var(--violet);">"+ Agregar activo"</strong> abajo para empezar.
    </td></tr>`;
  } else {
    const catOrder = Object.keys(CATEGORIES);
    entries.sort((a, b) => {
      const ca = ACTIVOS_BY_ID[a[0]]?.category;
      const cb = ACTIVOS_BY_ID[b[0]]?.category;
      const oa = catOrder.indexOf(ca);
      const ob = catOrder.indexOf(cb);
      if (oa !== ob) return oa - ob;
      return Number(b[1]) - Number(a[1]);
    });
    rowsHtml = "";
    let lastCategory = null;
    entries.forEach(([activoId, val]) => {
      const activo = ACTIVOS_BY_ID[activoId];
      if (!activo) {
        rowsHtml += `<tr><td>
          <span class="activo-dot" style="background: #888;"></span>
          <span class="activo-name">${activoId}</span>
          <span style="color: var(--red); font-size: 10px; margin-left: 8px;">⚠ ID desconocido</span>
        </td>
        <td class="right">
          <input type="number" class="pct-input" value="${val}" min="0" max="100" step="0.5"
                 onchange="updateActivo('${id}', '${activoId}', this.value)"
                 onkeydown="if(event.key==='Enter')this.blur();">
          <span class="pct-suffix">%</span>
          <button class="btn-remove" onclick="removeActivo('${id}', '${activoId}')" title="Quitar">×</button>
        </td></tr>`;
        return;
      }
      const cat = CATEGORIES[activo.category];
      // Subheader cuando cambia de categoría
      if (activo.category !== lastCategory) {
        rowsHtml += `<tr class="cat-subheader"><td colspan="2">
          <span class="cat-subheader-dot" style="background: ${cat.color};"></span>
          ${cat.label}
        </td></tr>`;
        lastCategory = activo.category;
      }
      const subgroup = activo.subgroup ? ` · ${activo.subgroup}` : '';
      rowsHtml += `<tr>
        <td>
          <span class="activo-dot" style="background: ${getActivoColor(activoId)};"></span>
          <span class="activo-name">${activo.name}</span>
          ${activo.subgroup ? `<div class="activo-cat">${activo.subgroup}</div>` : ''}
        </td>
        <td class="right">
          <input type="number" class="pct-input" value="${val}" min="0" max="100" step="0.5"
                 onchange="updateActivo('${id}', '${activoId}', this.value)"
                 onkeydown="if(event.key==='Enter')this.blur();">
          <span class="pct-suffix">%</span>
          <button class="btn-remove" onclick="removeActivo('${id}', '${activoId}')" title="Quitar">×</button>
        </td>
      </tr>`;
    });
  }
  const total = entries.reduce((s, [, v]) => s + (Number(v) || 0), 0);
  const totalStatus = Math.abs(total - 100) < 0.01
    ? { cls: "ok", msg: "✓ Cartera balanceada" }
    : total > 100 ? { cls: "error", msg: `Excede ${(total - 100).toFixed(1)}%` }
    : entries.length === 0 ? { cls: "warning", msg: "Cartera vacía" }
    : { cls: "warning", msg: `Falta ${(100 - total).toFixed(1)}%` };
  return `<table class="activos-tabla">
    <thead><tr><th>Activo</th><th class="right">Ponderación</th></tr></thead>
    <tbody>
      ${rowsHtml}
      <tr class="add-row"><td colspan="2">
        <div class="add-cta" onclick="openAddModal('${id}')">
          <span class="add-cta-icon">+</span>
          <span>Agregar activo</span>
        </div>
      </td></tr>
      <tr class="total-row">
        <td>
          <strong style="color: var(--text-bright); font-family: 'Libre Baskerville', serif; font-size: 14px; letter-spacing: 1px;">TOTAL</strong>
          <div class="total-status ${totalStatus.cls}">${totalStatus.msg}</div>
        </td>
        <td class="right"><span class="total-value ${totalStatus.cls}">${total.toFixed(1)}%</span></td>
      </tr>
    </tbody>
  </table>
  <div class="editor-help">
    Click en <kbd>+ Agregar activo</kbd> para sumar uno · Click en <kbd>%</kbd> para editar peso · <kbd>×</kbd> quita el activo
  </div>`;
}

function updateActivo(portfolioId, activoId, value) {
  const num = parseFloat(value);
  if (isNaN(num) || num < 0) return;
  state.templates[portfolioId].blocks[activoId] = num;
  saveState(); render();
}

function removeActivo(portfolioId, activoId) {
  const val = state.templates[portfolioId].blocks[activoId] || 0;
  const activo = ACTIVOS_BY_ID[activoId];
  const name = activo ? activo.name : activoId;
  if (val > 0 && !confirm(`Quitar "${name}" (${val}%)?`)) return;
  delete state.templates[portfolioId].blocks[activoId];
  saveState(); render();
}

function openAddModal(portfolioId) {
  state.modal = { portfolioId, view: "categories", category: null, search: "" };
  render();
}

function openModalCategory(catKey) {
  if (state.modal) {
    state.modal.view = "list";
    state.modal.category = catKey;
    render();
  }
}

function backToCategories() {
  if (state.modal) {
    state.modal.view = "categories";
    state.modal.category = null;
    state.modal.search = "";
    render();
  }
}

function closeAddModal() {
  state.modal = null;
  render();
}

function setModalSearch(value) {
  if (state.modal) {
    state.modal.search = value;
    // Si hay búsqueda, cambiamos a vista de lista (filtra todo)
    if (value.trim().length > 0 && state.modal.view === "categories") {
      state.modal.view = "search";
      state.modal.category = null;
    } else if (value.trim().length === 0 && state.modal.view === "search") {
      state.modal.view = "categories";
    }
    renderModal();
  }
}

function addActivo(activoId) {
  const m = state.modal;
  if (!m) return;
  const blocks = state.templates[m.portfolioId].blocks;
  if (blocks[activoId] !== undefined) return;
  blocks[activoId] = 0;
  saveState();
  render();
}

function renderModalItem(a, blocks) {
  const cat = CATEGORIES[a.category];
  const isAdded = blocks[a.id] !== undefined;
  const meta = a.type === "fci"
    ? `${a.sociedad} · ${a.moneda} · ${a.liquidez} · ${a.objetivo}`
    : `${cat.label}${a.subgroup ? ' · ' + a.subgroup : ''}`;
  const onClick = isAdded ? '' : `onclick="addActivo('${a.id}')"`;
  return `
    <div class="activo-pick-item ${isAdded ? 'disabled' : ''}" ${onClick}>
      <span class="activo-pick-dot" style="background: ${cat.color};"></span>
      <div class="activo-pick-info">
        <div class="activo-pick-name">${a.name}</div>
        <div class="activo-pick-meta">${meta}</div>
      </div>
      ${isAdded ? '<span class="activo-pick-added">✓ Ya agregado</span>' : '<span class="activo-pick-cat">+</span>'}
    </div>
  `;
}

function renderModal() {
  const container = document.getElementById("modal-container");
  if (!state.modal) {
    container.innerHTML = "";
    return;
  }
  const { portfolioId, view, category, search } = state.modal;
  const portfolio = state.templates[portfolioId];
  const blocks = portfolio.blocks;
  const portfolioName = portfolio.title;
  const searchLower = search.toLowerCase().trim();

  let body = "";
  let backHtml = "";

  if (view === "categories") {
    // Vista 1: Cards de categorías
    const cards = Object.keys(CATEGORIES).map(catKey => {
      const cat = CATEGORIES[catKey];
      const count = ACTIVOS.filter(a => a.category === catKey).length;
      if (count === 0) return "";
      const usedCount = ACTIVOS.filter(a => a.category === catKey && blocks[a.id] !== undefined).length;
      return `
        <div class="cat-card" onclick="openModalCategory('${catKey}')">
          <div class="cat-card-dot" style="background: ${cat.color};"></div>
          <div class="cat-card-info">
            <div class="cat-card-name">${cat.label}</div>
            <div class="cat-card-meta">${count} activo${count === 1 ? '' : 's'}${usedCount > 0 ? ` · <span style="color: var(--violet);">${usedCount} ya en cartera</span>` : ''}</div>
          </div>
          <div class="cat-card-arrow">→</div>
        </div>
      `;
    }).join("");

    body = `
      <div class="cat-section-title">Activos Directos</div>
      <div class="cat-grid">
        ${Object.keys(CATEGORIES).filter(k => CATEGORIES[k].group === "directo").map(catKey => {
          const cat = CATEGORIES[catKey];
          const count = ACTIVOS.filter(a => a.category === catKey).length;
          const usedCount = ACTIVOS.filter(a => a.category === catKey && blocks[a.id] !== undefined).length;
          return `
            <div class="cat-card" onclick="openModalCategory('${catKey}')">
              <div class="cat-card-dot" style="background: ${cat.color};"></div>
              <div class="cat-card-info">
                <div class="cat-card-name">${cat.label}</div>
                <div class="cat-card-meta">${count} activo${count === 1 ? '' : 's'}${usedCount > 0 ? ` · <span style="color: var(--violet);">${usedCount} en cartera</span>` : ''}</div>
              </div>
              <div class="cat-card-arrow">→</div>
            </div>
          `;
        }).join("")}
      </div>
      <div class="cat-section-title">Fondos Comunes (FCI)</div>
      <div class="cat-grid">
        ${Object.keys(CATEGORIES).filter(k => CATEGORIES[k].group === "fci").map(catKey => {
          const cat = CATEGORIES[catKey];
          const count = ACTIVOS.filter(a => a.category === catKey).length;
          const usedCount = ACTIVOS.filter(a => a.category === catKey && blocks[a.id] !== undefined).length;
          return `
            <div class="cat-card ${count === 0 ? 'cat-card-empty' : ''}" ${count > 0 ? `onclick="openModalCategory('${catKey}')"` : ''}>
              <div class="cat-card-dot" style="background: ${cat.color};"></div>
              <div class="cat-card-info">
                <div class="cat-card-name">${cat.label}</div>
                <div class="cat-card-meta">${count === 0 ? 'Sin fondos cargados aún' : `${count} fondo${count === 1 ? '' : 's'}${usedCount > 0 ? ` · <span style="color: var(--violet);">${usedCount} en cartera</span>` : ''}`}</div>
              </div>
              ${count > 0 ? '<div class="cat-card-arrow">→</div>' : ''}
            </div>
          `;
        }).join("")}
      </div>
    `;

  } else if (view === "search") {
    // Vista 2: Resultados de búsqueda (filtra todo)
    const filtered = ACTIVOS.filter(a =>
      a.name.toLowerCase().includes(searchLower) ||
      a.id.toLowerCase().includes(searchLower) ||
      (a.sociedad && a.sociedad.toLowerCase().includes(searchLower)) ||
      (a.objetivo && a.objetivo.toLowerCase().includes(searchLower)) ||
      CATEGORIES[a.category].label.toLowerCase().includes(searchLower)
    );

    if (filtered.length === 0) {
      body = `<div style="padding: 40px 24px; text-align: center; color: var(--text-dim); font-style: italic;">No hay activos que coincidan con "${search}".</div>`;
    } else {
      // Agrupar por categoría
      const grouped = {};
      filtered.forEach(a => {
        if (!grouped[a.category]) grouped[a.category] = [];
        grouped[a.category].push(a);
      });
      Object.keys(CATEGORIES).forEach(catKey => {
        const arr = grouped[catKey];
        if (!arr) return;
        const cat = CATEGORIES[catKey];
        body += `<div class="modal-subgroup-header">${cat.label} <span style="color: var(--text-light); font-weight: 400; margin-left: 6px;">· ${arr.length}</span></div>`;
        body += arr.map(a => renderModalItem(a, blocks)).join("");
      });
    }

  } else if (view === "list") {
    // Vista 3: Lista de activos de una categoría
    const cat = CATEGORIES[category];
    const catActivos = ACTIVOS.filter(a => a.category === category);
    backHtml = `<button class="modal-back" onclick="backToCategories()">← Categorías</button>`;

    if (cat.subgroups) {
      cat.subgroups.forEach(sg => {
        const sgActivos = catActivos.filter(a => a.subgroup === sg);
        if (sgActivos.length === 0) return;
        body += `<div class="modal-subgroup-header">${sg} <span style="color: var(--text-light); font-weight: 400; margin-left: 6px;">· ${sgActivos.length}</span></div>`;
        body += sgActivos.map(a => renderModalItem(a, blocks)).join("");
      });
      const sinSg = catActivos.filter(a => !a.subgroup);
      if (sinSg.length > 0) {
        body += sinSg.map(a => renderModalItem(a, blocks)).join("");
      }
    } else {
      body += catActivos.map(a => renderModalItem(a, blocks)).join("");
    }
  }

  // Header dinámico
  let titleText, subtitleText;
  if (view === "categories") {
    titleText = "Agregar activo";
    subtitleText = `a ${portfolioName}`;
  } else if (view === "search") {
    titleText = `Búsqueda: "${search}"`;
    subtitleText = `a ${portfolioName}`;
  } else if (view === "list") {
    titleText = CATEGORIES[category].label;
    subtitleText = `a ${portfolioName}`;
  }

  container.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeAddModal()">
      <div class="modal">
        <div class="modal-header">
          <div style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;">
            ${backHtml}
            <div style="min-width: 0;">
              <div class="modal-title">${titleText}</div>
              <div style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${subtitleText}</div>
            </div>
          </div>
          <button class="modal-close" onclick="closeAddModal()">×</button>
        </div>
        <div class="modal-search">
          <input type="text" placeholder="Buscar por ticker, nombre, sociedad..." value="${search}" oninput="setModalSearch(this.value)" autofocus>
        </div>
        <div class="modal-body">${body}</div>
      </div>
    </div>
  `;
}

function generateAutoSummary(portfolioId) {
  const t = state.templates[portfolioId];
  const blocks = t.blocks;
  const entries = Object.entries(blocks).filter(([, v]) => Number(v) > 0);
  if (entries.length === 0) return "Cartera vacía — agregá activos para generar el resumen.";

  const total = entries.reduce((s, [, v]) => s + Number(v), 0);

  // Agrupar por categoría
  const byCat = {};
  entries.forEach(([id, val]) => {
    const a = ACTIVOS_BY_ID[id];
    if (!a) return;
    if (!byCat[a.category]) byCat[a.category] = 0;
    byCat[a.category] += Number(val);
  });
  const sortedCats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

  // Helpers
  const pct = (val) => ((val / total) * 100).toFixed(0);
  const moneda = t.moneda;
  const perfil = (t.perfil || "").toLowerCase();

  // Clasificación por tipo de activo
  const rfCats = ["liquidez","lecap","dual","cer","hd","fciMM","fciTasa","fciCer","fciDlk","fciUsd","fciPymes"];
  const equityCats = ["equityAr","equityUsa","etfs","fciAcciones"];
  const rfTotal = sortedCats.filter(([k]) => rfCats.includes(k)).reduce((s, [, v]) => s + v, 0);
  const equityTotal = sortedCats.filter(([k]) => equityCats.includes(k)).reduce((s, [, v]) => s + v, 0);
  const rfPct = pct(rfTotal);
  const equityPct = pct(equityTotal);

  const fciCats = Object.keys(CATEGORIES).filter(k => CATEGORIES[k].group === "fci");
  const fciTotal = sortedCats.filter(([k]) => fciCats.includes(k)).reduce((s, [, v]) => s + v, 0);
  const directoTotal = total - fciTotal;
  const fciPct = pct(fciTotal);
  const directoPct = pct(directoTotal);

  // Listado de activos con nombre
  const activosByCategory = {};
  entries.forEach(([id, val]) => {
    const a = ACTIVOS_BY_ID[id];
    if (!a) return;
    if (!activosByCategory[a.category]) activosByCategory[a.category] = [];
    activosByCategory[a.category].push({ id, name: a.name, val: Number(val), subgroup: a.subgroup });
  });

  // === PÁRRAFO 1: Objetivo ===
  let p1;
  if (moneda === "USD") {
    if (perfil.includes("preservación") || perfil.includes("conservador")) {
      p1 = `Esta cartera Dólar conservadora persigue la preservación del capital en moneda dura combinada con yield positivo, minimizando volatilidad y manteniendo liquidez adecuada para horizontes de mediano plazo.`;
    } else if (perfil.includes("moderada")) {
      p1 = `Esta cartera Dólar moderada busca rendimiento ajustado por riesgo en moneda dura mediante una combinación equilibrada de renta fija USD y exposición selectiva a equity, apuntando a yield superior a Treasuries con tolerancia a drawdowns acotados.`;
    } else if (perfil.includes("agresiva")) {
      p1 = `Esta cartera Dólar agresiva persigue apreciación de capital en moneda dura mediante una combinación de renta fija USD activamente gestionada y exposición a equity internacional, asumiendo mayor volatilidad a cambio de retornos esperados superiores.`;
    } else {
      p1 = `Esta cartera Dólar busca generar retorno en moneda dura combinando renta fija (${rfPct}%) y exposición equity (${equityPct}%).`;
    }
  } else {
    if (perfil.includes("preservación") || perfil.includes("conservador")) {
      p1 = `Esta cartera Pesos conservadora prioriza la preservación del poder adquisitivo frente a la inflación argentina, combinando instrumentos de tasa fija de corta duración con cobertura CER y participación parcial en USD para mitigar riesgo de devaluación.`;
    } else if (perfil.includes("moderada")) {
      p1 = `Esta cartera Pesos moderada apunta a ganarle a la inflación con un perfil de riesgo controlado, diversificando entre tasa fija pesos, cobertura inflacionaria CER, dolarización táctica y exposición selectiva a equity para captar upside de mediano plazo.`;
    } else if (perfil.includes("agresiva")) {
      p1 = `Esta cartera Pesos agresiva busca generar alpha sustancial sobre la inflación mediante duration en CER, exposición soberana USD, equity argentino y posicionamiento estratégico ante el ciclo electoral 2027, asumiendo volatilidad elevada.`;
    } else {
      p1 = `Esta cartera Pesos busca rendimiento real positivo combinando renta fija (${rfPct}%) y exposición equity (${equityPct}%).`;
    }
  }

  // === PÁRRAFO 2: Núcleo de la posición ===
  const top1 = sortedCats[0];
  const top1Cat = CATEGORIES[top1[0]];
  const top1Pct = pct(top1[1]);
  let p2 = `El núcleo de la cartera (${top1Pct}%) se construye con `;

  // Detalle del primer bloque
  const top1Activos = activosByCategory[top1[0]] || [];
  if (top1[0] === "hd") {
    p2 += `bonos Hard-Dollar argentinos. `;
    const sobs = top1Activos.filter(a => a.subgroup === "Soberanos").map(a => a.name);
    const bcra = top1Activos.filter(a => a.subgroup === "BCRA").map(a => a.name);
    const prov = top1Activos.filter(a => a.subgroup === "Provinciales").map(a => a.name);
    const corp = top1Activos.filter(a => a.subgroup === "Corporativos").map(a => a.name);
    const detalles = [];
    if (sobs.length) detalles.push(`soberanos (${sobs.join(", ")})`);
    if (bcra.length) detalles.push(`BOPREAL del BCRA (${bcra.join(", ")})`);
    if (prov.length) detalles.push(`provinciales (${prov.slice(0,3).join(", ")}${prov.length > 3 ? "..." : ""})`);
    if (corp.length) detalles.push(`corporativos en USD (${corp.slice(0,3).join(", ")}${corp.length > 3 ? "..." : ""})`);
    if (detalles.length) p2 += `Incluye ${detalles.join(", ")}, ofreciendo yield USD diferencial respecto a Treasuries con exposición al riesgo soberano argentino.`;
    else p2 += `Ofrece yield USD diferencial respecto a Treasuries.`;
  } else if (top1[0] === "fciUsd") {
    p2 += `FCIs en USD que delegan la selección de bonos corporativos LatAm e instrumentos de yield a equipos profesionales. `;
    const names = top1Activos.map(a => a.name).slice(0, 3);
    if (names.length) p2 += `Posiciones principales: ${names.join(", ")}. `;
    p2 += `Esta gestión activa permite capturar oportunidades en mercados High Yield sin la operatoria directa de bonos individuales.`;
  } else if (top1[0] === "cer") {
    p2 += `bonos CER argentinos. Estos instrumentos ajustan capital por inflación oficial (CPI), brindando cobertura directa contra la pérdida de poder adquisitivo del peso. `;
    const names = top1Activos.map(a => a.name).slice(0, 4);
    if (names.length) p2 += `Posiciones: ${names.join(", ")}.`;
  } else if (top1[0] === "lecap") {
    p2 += `LECAPs y BONCAPs, letras del Tesoro a tasa fija. Ofrecen visibilidad de rendimiento en pesos con duration corta, mitigando riesgo de tasa. `;
    const names = top1Activos.map(a => a.name).slice(0, 4);
    if (names.length) p2 += `Posiciones: ${names.join(", ")}.`;
  } else if (top1[0] === "fciCer") {
    p2 += `FCIs CER que delegan la gestión de la cobertura inflacionaria a sociedades gerentes especializadas. `;
    const names = top1Activos.map(a => a.name).slice(0, 3);
    if (names.length) p2 += `Selección: ${names.join(", ")}. `;
    p2 += `Buscan superar el CPI con gestión activa de duration y curva.`;
  } else if (top1[0] === "fciTasa") {
    p2 += `FCIs de tasa fija en pesos, vehículos de bajo riesgo con benchmark Badlar. `;
    const names = top1Activos.map(a => a.name).slice(0, 3);
    if (names.length) p2 += `Selección: ${names.join(", ")}. `;
    p2 += `Aportan rendimiento devengado con liquidez T+1.`;
  } else if (top1[0] === "fciMM") {
    p2 += `FCIs Money Market, instrumentos de liquidez inmediata T+0 que ofrecen rendimiento devengado diario con riesgo mínimo. `;
    const names = top1Activos.map(a => a.name).slice(0, 3);
    if (names.length) p2 += `Selección: ${names.join(", ")}.`;
  } else if (top1[0] === "equityUsa") {
    p2 += `acciones USA / CEDEARs locales. Permiten captar el dinamismo del mercado norteamericano operando localmente en pesos. `;
    const names = top1Activos.map(a => a.name).slice(0, 5);
    if (names.length) p2 += `Posiciones: ${names.join(", ")}.`;
  } else if (top1[0] === "etfs") {
    p2 += `ETFs e índices que aportan diversificación amplia y de bajo costo a sectores y mercados específicos. `;
    const names = top1Activos.map(a => a.name).slice(0, 5);
    if (names.length) p2 += `Posiciones: ${names.join(", ")}.`;
  } else if (top1[0] === "equityAr") {
    p2 += `acciones del Merval argentino. Posicionamiento direccional al equity local, beneficiándose del ciclo macro y reformas estructurales. `;
    const names = top1Activos.map(a => a.name).slice(0, 5);
    if (names.length) p2 += `Posiciones: ${names.join(", ")}.`;
  } else if (top1[0] === "fciAcciones") {
    p2 += `FCIs de renta variable con gestión activa value. `;
    const names = top1Activos.map(a => a.name).slice(0, 3);
    if (names.length) p2 += `Selección: ${names.join(", ")}.`;
  } else if (top1[0] === "fciDlk") {
    p2 += `FCIs Dólar Linked, vehículos que siguen la evolución del TC oficial. `;
    const names = top1Activos.map(a => a.name).slice(0, 3);
    if (names.length) p2 += `Selección: ${names.join(", ")}. `;
    p2 += `Cobertura ante devaluación del peso oficial.`;
  } else if (top1[0] === "dual") {
    p2 += `bonos duales (TT), que combinan tasa fija con opción CER, ofreciendo upside ante aceleración inflacionaria. `;
    const names = top1Activos.map(a => a.name).slice(0, 4);
    if (names.length) p2 += `Posiciones: ${names.join(", ")}.`;
  } else if (top1[0] === "fciPymes") {
    p2 += `FCIs Pymes que invierten en cheques de pago diferido y ON Pymes, instrumentos de mayor yield con liquidez ${`controlada`}. `;
    const names = top1Activos.map(a => a.name).slice(0, 3);
    if (names.length) p2 += `Selección: ${names.join(", ")}.`;
  } else {
    p2 += `${top1Cat.label}.`;
  }

  // === PÁRRAFO 3: Otros bloques importantes ===
  let p3 = "";
  const otros = sortedCats.slice(1, 4); // siguientes 3 bloques
  if (otros.length > 0) {
    const partes = otros.map(([catKey, val]) => {
      const cat = CATEGORIES[catKey];
      const catPct = pct(val);
      const activos = activosByCategory[catKey] || [];
      const names = activos.map(a => a.name).slice(0, 3).join(", ");

      // Descripción breve por categoría
      let desc = "";
      switch(catKey) {
        case "liquidez": desc = `liquidez para necesidades operativas`; break;
        case "lecap": desc = `tasa fija pesos vía LECAPs/BONCAPs (${names})`; break;
        case "dual": desc = `bonos duales (${names}) con opción inflacionaria`; break;
        case "cer": desc = `cobertura CER (${names}) contra inflación`; break;
        case "hd": desc = `bonos Hard-Dollar argentinos (${names})`; break;
        case "equityAr": desc = `equity argentino (${names})`; break;
        case "equityUsa": desc = `CEDEARs USA / LatAm (${names}) para alpha selectivo`; break;
        case "etfs": desc = `ETFs (${names}) para diversificación pasiva de bajo costo`; break;
        case "fciMM": desc = `FCIs Money Market para liquidez`; break;
        case "fciTasa": desc = `FCIs tasa fija pesos`; break;
        case "fciCer": desc = `FCIs CER para cobertura inflacionaria delegada`; break;
        case "fciDlk": desc = `FCIs Dólar Linked para cobertura devaluación`; break;
        case "fciUsd": desc = `FCIs USD para yield delegado en moneda dura`; break;
        case "fciAcciones": desc = `FCIs de acciones con gestión value`; break;
        case "fciPymes": desc = `FCIs Pymes para yield diferencial`; break;
        default: desc = cat.label;
      }
      return `${catPct}% en ${desc}`;
    });

    if (partes.length === 1) {
      p3 = `Complementariamente, se incluye ${partes[0]}, aportando diversificación al núcleo principal.`;
    } else {
      const last = partes.pop();
      p3 = `Complementariamente, la cartera incluye ${partes.join("; ")} y ${last}, aportando diversificación táctica al núcleo principal.`;
    }
  }

  // === PÁRRAFO 4: Perfil cliente / Gestión ===
  let p4;
  const horizonte = t.horizon || "el horizonte definido";
  const dd = t.drawdown || "el drawdown esperado";
  const target = t.target || "el target definido";

  let gestionDesc = "";
  if (fciTotal > 70) gestionDesc = `con gestión predominantemente delegada (${fciPct}% vía FCIs)`;
  else if (fciTotal > 40) gestionDesc = `con balance entre selección directa de activos y gestión delegada (FCIs ${fciPct}%)`;
  else if (fciTotal > 0) gestionDesc = `con gestión predominantemente activa en activos directos, complementada con FCIs (${fciPct}%)`;
  else gestionDesc = `con gestión 100% activa en activos directos`;

  p4 = `Perfil recomendado: inversor con mandato ${moneda}, horizonte ${horizonte}, tolerancia a drawdowns de ${dd} y objetivo de rendimiento ${target}, ${gestionDesc}.`;

  return [p1, p2, p3, p4].filter(x => x).join("\n\n");
}

function getActivoAporte(activoId) {
  const a = ACTIVOS_BY_ID[activoId];
  if (!a) return null;
  // Prioridad 1: campo "aporte" explícito en el activo
  if (a.aporte) return a.aporte;
  // Prioridad 2: tabla APORTES por ticker
  if (APORTES[activoId]) return APORTES[activoId];
  // Prioridad 3: para FCIs usar "objetivo"
  if (a.type === "fci" && a.objetivo) return a.objetivo;
  return null;
}

function buildAnalysis(portfolioId) {
  const t = state.templates[portfolioId];
  const blocks = t.blocks;
  const entries = Object.entries(blocks).filter(([, v]) => Number(v) > 0);

  if (entries.length === 0) {
    return `<div class="analysis-section">
      <div class="analysis-title"><span class="analysis-title-icon">📊</span> Análisis de cartera</div>
      <div style="color: var(--text-dim); font-style: italic; padding: 20px; text-align: center;">
        Agregá activos a la cartera para ver el análisis.
      </div>
    </div>`;
  }

  const total = entries.reduce((s, [, v]) => s + Number(v), 0);

  // -- SUMMARY (auto o editado) --
  const userRationale = t.rationale;
  const autoSummary = generateAutoSummary(portfolioId);
  const isEditing = state.editingRationale === portfolioId;
  const summaryText = userRationale || autoSummary;

  let summaryHtml;
  if (isEditing) {
    summaryHtml = `<div class="analysis-summary editing">
      <textarea id="rationale-edit-${portfolioId}" placeholder="Escribí el racional de la cartera...">${userRationale || autoSummary}</textarea>
      <div class="analysis-edit-actions">
        <button class="analysis-edit-btn reset" onclick="resetRationale('${portfolioId}')">Auto-generar</button>
        <button class="analysis-edit-btn" onclick="cancelEditRationale()">Cancelar</button>
        <button class="analysis-edit-btn" onclick="saveRationale('${portfolioId}')">💾 Guardar</button>
      </div>
    </div>`;
  } else {
    const editBtn = `<button class="analysis-edit-btn" onclick="startEditRationale('${portfolioId}')">✎ ${userRationale ? 'Editar' : 'Editar racional'}</button>`;
    const sourceTag = userRationale
      ? '<span style="color: var(--violet); font-size: 9px;">EDITADO MANUALMENTE</span>'
      : '<span style="color: var(--text-light); font-size: 9px;">AUTO-GENERADO</span>';
    summaryHtml = `
      <div class="analysis-block-header">
        <span>Resumen ejecutivo</span>
        <span style="display:flex;align-items:center;gap:10px;">${sourceTag}${editBtn}</span>
      </div>
      <div class="analysis-summary">${summaryText}</div>
    `;
  }

  // -- COMPOSITION por categoría --
  const byCat = {};
  entries.forEach(([id, val]) => {
    const a = ACTIVOS_BY_ID[id];
    if (!a) return;
    if (!byCat[a.category]) byCat[a.category] = 0;
    byCat[a.category] += Number(val);
  });
  const sortedCats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const barsHtml = sortedCats.map(([catKey, val]) => {
    const cat = CATEGORIES[catKey];
    if (!cat) return "";
    const pct = (val / total) * 100;
    return `<div class="bar-row">
      <span class="bar-label">${cat.label}</span>
      <div class="bar-container"><div class="bar-fill" style="width: ${pct.toFixed(1)}%; background: ${cat.color};"></div></div>
      <span class="bar-val">${val.toFixed(1)}%</span>
    </div>`;
  }).join("");

  // -- APORTE POR ACTIVO --
  // Ordenado igual que la tabla (por categoría + peso)
  const catOrder = Object.keys(CATEGORIES);
  const sortedEntries = [...entries].sort((a, b) => {
    const ca = ACTIVOS_BY_ID[a[0]]?.category;
    const cb = ACTIVOS_BY_ID[b[0]]?.category;
    const oa = catOrder.indexOf(ca);
    const ob = catOrder.indexOf(cb);
    if (oa !== ob) return oa - ob;
    return Number(b[1]) - Number(a[1]);
  });
  const aporteHtml = sortedEntries.map(([id, val]) => {
    const a = ACTIVOS_BY_ID[id];
    if (!a) {
      return `<div class="aporte-item">
        <span class="aporte-dot" style="background:#888;"></span>
        <div class="aporte-content">
          <div class="aporte-head">${id}</div>
          <div class="aporte-empty">⚠ Activo no encontrado en catálogo</div>
        </div>
        <span class="aporte-pct">${val}%</span>
      </div>`;
    }
    const cat = CATEGORIES[a.category];
    const aporte = getActivoAporte(id);
    const catLabel = `${cat.label}${a.subgroup ? ' · ' + a.subgroup : ''}`;
    return `<div class="aporte-item">
      <span class="aporte-dot" style="background: ${getActivoColor(id)};"></span>
      <div class="aporte-content">
        <div class="aporte-head">${a.name}</div>
        <div class="aporte-cat">${catLabel}</div>
        ${aporte ? `<div class="aporte-text">${aporte}</div>` : `<div class="aporte-empty">Sin descripción cargada</div>`}
      </div>
      <span class="aporte-pct">${val}%</span>
    </div>`;
  }).join("");

  // -- TITULAR RF/Equity --
  const equityCats = ["equityAr","equityUsa","etfs","fciAcciones"];
  const equityTotal = sortedCats.filter(([k]) => equityCats.includes(k)).reduce((s, [, v]) => s + v, 0);
  const equityPct = ((equityTotal / total) * 100).toFixed(0);
  const rfPct = (100 - Number(equityPct)).toFixed(0);

  const splitHtml = `
    <div class="split-bar">
      <div class="split-side rf" style="flex: ${rfPct};">
        <div class="split-pct">${rfPct}%</div>
        <div class="split-label">Renta Fija</div>
      </div>
      <div class="split-side eq" style="flex: ${equityPct};">
        <div class="split-pct">${equityPct}%</div>
        <div class="split-label">Equity</div>
      </div>
    </div>
  `;

  return `<div class="analysis-section">
    <div class="analysis-title"><span class="analysis-title-icon">📊</span> Análisis de cartera</div>

    ${splitHtml}

    <div class="analysis-block">
      ${summaryHtml}
    </div>

    <div class="analysis-block">
      <div class="analysis-block-header"><span>Composición por categoría</span></div>
      <div class="bar-chart">${barsHtml}</div>
    </div>

    <div class="analysis-block">
      <div class="analysis-block-header"><span>Aporte por activo</span></div>
      <div class="aporte-list">${aporteHtml}</div>
    </div>
  </div>`;
}

function startEditRationale(portfolioId) {
  state.editingRationale = portfolioId;
  render();
  // Foco al textarea
  setTimeout(() => {
    const el = document.getElementById(`rationale-edit-${portfolioId}`);
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 50);
}

function cancelEditRationale() {
  state.editingRationale = null;
  render();
}

function saveRationale(portfolioId) {
  const el = document.getElementById(`rationale-edit-${portfolioId}`);
  if (!el) return;
  const text = el.value.trim();
  if (text) {
    state.templates[portfolioId].rationale = text;
  } else {
    delete state.templates[portfolioId].rationale;
  }
  state.editingRationale = null;
  saveState();
  render();
}

function resetRationale(portfolioId) {
  if (!confirm("¿Volver al resumen auto-generado? Se perderá tu texto editado.")) return;
  delete state.templates[portfolioId].rationale;
  const el = document.getElementById(`rationale-edit-${portfolioId}`);
  if (el) el.value = generateAutoSummary(portfolioId);
  saveState();
}

function renderPortfolio(id) {
  const t = state.templates[id];
  const edited = isEdited(id);
  const editedBadge = edited ? `<span class="badge badge-edited">✎ EN USO</span>` : "";
  return `<div class="card">
    <div class="portfolio-header">
      <div class="portfolio-title">
        <div>
          ${t.badges.map(([cls, txt]) => `<span class="badge ${cls}">${txt}</span>`).join("")}
          ${editedBadge}
        </div>
        <h2>${t.title}</h2>
        <div class="description">${t.description}</div>
      </div>
      <div class="portfolio-actions">
        <button class="btn" onclick="selectTab('overview')">← Overview</button>
        ${edited ? `<button class="btn btn-warn" onclick="resetPortfolio('${id}')">↺ Reset</button>` : ""}
      </div>
    </div>
    <div class="main-grid">
      <div class="donut-wrapper">
        ${buildDonut(t.blocks)}
        <div class="meta-line">
          <strong>Horizonte:</strong> ${t.horizon} ·
          <strong>DD:</strong> ${t.drawdown} ·
          <strong>Target:</strong> ${t.target}
        </div>
      </div>
      <div>${buildTable(id)}</div>
    </div>
    ${buildAnalysis(id)}
  </div>`;
}

function renderTabs() {
  const tabsHtml = [
    `<button class="main-tab ${state.current === 'overview' ? 'active' : ''}" onclick="selectTab('overview')">⊞ Overview</button>`,
    ...ORDER.map(id => {
      const t = state.templates[id];
      const edited = isEdited(id);
      return `<button class="main-tab ${state.current === id ? 'active' : ''}" onclick="selectTab('${id}')">
        ${t.moneda} · ${t.perfil}${edited ? ' <span class="edit-dot">●</span>' : ''}
      </button>`;
    })
  ].join("");
  document.getElementById("main-tabs").innerHTML = tabsHtml;
}

function selectTab(tab) {
  state.current = tab;
  state.modal = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  renderTabs();
  const content = document.getElementById("content");
  if (state.current === "overview") {
    content.innerHTML = renderOverview();
  } else {
    content.innerHTML = renderPortfolio(state.current);
  }
  renderModal();
}

loadState();
render();
</script>
