<style>
:root{
  --cream:#fdfbf7; --navy:#1e2d3d; --gold:#c9a84c; --gray:#B5C1CC;
  --ink:#1e2d3d; --muted:#7b8794; --line:#e3ded4; --pos:#2e7d5b; --neg:#b3453a;
  --c-liquidez:#b9c3cd; --c-lecap:#4a7ec4; --c-dual:#3f6bb0; --c-cer:#98a5b2;
  --c-hd:#2a4a7f; --c-equity-ar:#c45a52; --c-equity-usa:#9a7fc0; --c-etfs:#6a4f95;
  --c-fci-mm:#d7cfe6; --c-fci-tasa:#98a5b2; --c-fci-cer:#c9bfdd; --c-fci-dlk:#8f6fbe;
  --c-fci-usd:#5b3f78; --c-fci-acc:#e0c9f5; --c-fci-pymes:#a89ac4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8e4dc;color:var(--ink);font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums}

/* ── Barra de control (no imprime) ── */
.bar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.bar .brand{font-style:italic;font-size:15px;letter-spacing:.5px;margin-right:8px;color:var(--gold)}
.tab{background:transparent;border:1px solid rgba(255,255,255,.25);color:#dfe5ea;padding:5px 10px;border-radius:3px;cursor:pointer;font:400 11px/1.2 'Space Mono',monospace;letter-spacing:.3px;white-space:nowrap}
.tab:hover{border-color:var(--gold);color:#fff}
.tab.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.tab.notrack{opacity:.55}
.spacer{flex:1}
.btn{background:var(--gold);border:0;color:var(--navy);padding:6px 14px;border-radius:3px;cursor:pointer;font:700 11px/1.2 'Space Mono',monospace}
.fbdot{font:400 10px/1.2 'Space Mono',monospace;color:var(--gray);display:flex;align-items:center;gap:6px}
.fbdot i{width:7px;height:7px;border-radius:50%;background:#e0a52e;display:inline-block}
.fbdot.ok i{background:#3fb27f} .fbdot.err i{background:#c85a4e}

/* ── Hoja A4 ── */
.sheet{width:210mm;min-height:297mm;margin:18px auto;background:var(--cream);padding:14mm 14mm 10mm;box-shadow:0 6px 30px rgba(0,0,0,.18);position:relative}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:9px;margin-bottom:12px}
.hdr h1{font-style:italic;font-weight:400;font-size:23px;color:var(--navy);line-height:1.2}
.hdr .sub{font:400 9.5px/1.5 'Space Mono',monospace;color:var(--muted);margin-top:3px;letter-spacing:.4px}
.logo{text-align:right}
.logo .n{font-style:italic;font-size:17px;color:var(--navy);letter-spacing:.5px}
.logo .c{font:400 8px/1.4 'Space Mono',monospace;color:var(--muted);letter-spacing:.6px;margin-top:2px}
.badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.bdg{font:700 8px/1 'Space Mono',monospace;letter-spacing:.7px;padding:4px 7px;border-radius:2px;border:1px solid var(--navy);color:var(--navy)}
.bdg.gold{background:var(--gold);border-color:var(--gold)}
.bdg.navy{background:var(--navy);color:var(--cream)}

h2.sec{font-style:italic;font-weight:400;font-size:13px;color:var(--navy);margin:14px 0 7px;padding-bottom:3px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
h2.sec span{font:400 8px/1 'Space Mono',monospace;color:var(--muted);letter-spacing:.5px;font-style:normal}
.desc{font-size:10.5px;line-height:1.55;color:#3d4b5a;text-align:justify}

.mandate{display:flex;gap:8px;margin-top:9px}
.mcell{border:1px solid var(--line);border-left:2px solid var(--gold);padding:6px 10px;background:#fff;min-width:190px}
.mcell .k{font:400 7.5px/1 'Space Mono',monospace;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.mcell .v{font:700 11px/1.3 'Space Mono',monospace;color:var(--navy);margin-top:3px}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:9px 0 4px}
.kpi{border:1px solid var(--line);background:#fff;padding:6px 5px;text-align:center}
.kpi .k{font:400 7px/1.1 'Space Mono',monospace;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;min-height:18px;display:flex;align-items:center;justify-content:center}
.kpi .v{font:700 13px/1.2 'Space Mono',monospace;color:var(--navy);margin-top:3px}
.kpi .v.pos{color:var(--pos)} .kpi .v.neg{color:var(--neg)}

table{width:100%;border-collapse:collapse;font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums}
th,td{padding:4px 5px;text-align:right;font-size:9px;border-bottom:1px solid var(--line)}
th{font-weight:700;font-size:7.5px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--navy);background:transparent}
td.l,th.l{text-align:left}
tr.tot td{border-top:1px solid var(--navy);border-bottom:0;font-weight:700;color:var(--navy)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .zero{color:var(--muted)}
.grid td{font-size:8px;padding:3px 2px}
.grid th{font-size:7px;padding:3px 2px}
.grid td.yr{font-weight:700;color:var(--navy);text-align:left;font-size:8.5px}
.grid td.an{font-weight:700;border-left:1px solid var(--navy)}
.grid td.na{color:#cfc9bd}

.chartbox{background:#fff;border:1px solid var(--line);padding:8px 10px 4px;margin-top:6px}
.chartbox .cap{font:400 7.5px/1.3 'Space Mono',monospace;color:var(--muted);letter-spacing:.3px;margin-top:2px}

.compo{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.donutbox{background:#fff;border:1px solid var(--line);padding:8px}
.donutbox .cap{text-align:center;font:700 8px/1 'Space Mono',monospace;color:var(--cream);letter-spacing:.8px;background:var(--navy);border-radius:20px;padding:5px 0;margin-bottom:6px}
.donut{display:flex;gap:8px;align-items:center}
.donut svg{width:44%;height:auto;flex:none}
.leg{flex:1;display:flex;flex-direction:column;gap:3px}
.leg div{display:flex;align-items:center;gap:5px;font:400 8px/1.3 'Space Mono',monospace;color:#3d4b5a}
.leg i{width:8px;height:8px;flex:none;border:1px solid rgba(0,0,0,.15)}
.leg b{color:var(--navy);margin-left:auto;font-weight:700}
.catrow td.sw{width:14px;padding-right:0}
.sw i{display:inline-block;width:8px;height:8px;border:1px solid rgba(0,0,0,.15)}
.subline td{color:#55616e;font-size:8.5px;border-bottom:1px dotted var(--line)}
.subline td.l{padding-left:16px}

.empty{border:1px dashed var(--gray);padding:16px;text-align:center;color:var(--muted);font:400 10px/1.5 'Space Mono',monospace;background:#fff}
.foot{position:absolute;bottom:8mm;left:14mm;right:14mm;border-top:1px solid var(--line);padding-top:6px;font-size:7px;line-height:1.5;color:var(--muted);text-align:justify;font-family:Georgia,serif}
.note{font-size:8px;color:var(--muted);margin-top:5px;line-height:1.4;font-family:Georgia,serif;font-style:italic}

@media print{
  body{background:#fff}
  .bar{display:none}
  .sheet{margin:0;box-shadow:none;width:auto;min-height:auto;page-break-after:always}
  @page{size:A4;margin:0}
}
</style>
</head>

  "p-cons":  { label:"Pesos · Preservación", title:"Cartera Pesos · Preservación de Capital", moneda:"ARS", badges:["ARS","PRESERVACIÓN"], horizon:"6-12 meses", drawdown:"~5%", target:"CPI + 3/5%", description:"Mandato en pesos para cliente con baja tolerancia al riesgo. Prioriza preservación del poder de compra contra inflación + cobertura USD parcial." },

  "p-agr":   { label:"Pesos · Agresiva", title:"Cartera Pesos · Agresiva", moneda:"ARS", badges:["ARS","AGRESIVA"], horizon:"24+ meses", drawdown:"~20-25%", target:"CPI + 12/15%", description:"Mandato en pesos con alta tolerancia al riesgo. Busca alpha vía duration, equity AR y posicionamiento ciclo electoral 2027." },

  "u-mod":   { label:"Dólar · Moderada", title:"Cartera Dólar · Moderada", moneda:"USD", badges:["USD","MODERADA"], horizon:"18-36 meses", drawdown:"~8-12%", target:"USD 7-9%", description:"Mandato en USD con tolerancia media al riesgo. Busca yield + appreciation vía exposición Argentina USD y equity USA selectivo." },
  "u-agr":   { label:"Dólar · Agresiva", title:"Cartera Dólar · Agresiva", moneda:"USD", badges:["USD","AGRESIVA"], horizon:"36+ meses", drawdown:"~20-30%", target:"USD 12-15%", description:"Mandato en USD con alta tolerancia al riesgo. Maximiza alpha vía equity USA, equity AR y exposición soberana AR de mayor duration." },

  "rt-5050": { label:"Retorno Total · 50/50", title:"Cartera Retorno Total · 50/50", moneda:"MIX", badges:["50% USD","50% ARS","RETORNO TOTAL"], horizon:"24+ meses", drawdown:"~15-20%", target:"Real positivo + USD 7-9%", description:"Mandato mixto balanceado (50% USD / 50% ARS). Equilibra renta variable argentina vía FCI de acciones (Galileo Multimercado IV) con FCI USD para cobertura y yield en moneda dura." },
};
const ORDER = ["p-cons","p-mod","p-agr","p-vivir","u-cons","u-mod","u-agr","rt-7030","rt-5050"];
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

let CURRENT = "p-cons";
let BLOCKS = null;   // desde Firestore

/* ══════════════ CÁLCULO ══════════════ */
function comp(arr){ let p=1; for(const r of arr) p *= (1 + r/100); return (p-1)*100; }

// { "2020-01": 8.33, ... } → [["2020-01", 8.33], ...] ordenado
function serieDe(id){
  const o = RETORNOS[id];
  if(!o) return [];
  return Object.keys(o)
    .filter(k => o[k] !== null && o[k] !== undefined && o[k] !== "")
    .sort()
    .map(k => [k, +o[k]]);
}
const tieneTrack = id => serieDe(id).length > 0;

function stats(id){
  const serie = serieDe(id);
  if(!serie.length) return null;

  // Años presentes
  const byYear = {};
  serie.forEach(([ym,v]) => { const y = +ym.slice(0,4); (byYear[y] = byYear[y] || []).push(v); });
  const years = Object.keys(byYear).map(Number).sort((a,b)=>a-b);

  // Grilla año × mes
  const grid = {};
  serie.forEach(([ym,v]) => { const y=+ym.slice(0,4), m=+ym.slice(5,7); (grid[y]=grid[y]||{})[m]=v; });

  const anual = {};
  years.forEach(y => anual[y] = comp(byYear[y]));

  const last = serie[serie.length-1][0];
  const lastY = +last.slice(0,4);
  const ytdClosed = years[years.length-1] === lastY && byYear[lastY].length < 12;

  // Índice base 100
  const idx = [{ ym: "inicio", v: 100 }];
  let acc = 100;
  serie.forEach(([ym,r]) => { acc *= (1 + r/100); idx.push({ ym, v: acc }); });

  // Máximo drawdown mensual
  let peak = 100, mdd = 0;
  idx.forEach(p => { if(p.v > peak) peak = p.v; const dd = (p.v/peak - 1)*100; if(dd < mdd) mdd = dd; });

  const vals = serie.map(s => s[1]);
  const best = Math.max(...vals), worst = Math.min(...vals);
  const posPct = vals.filter(v => v > 0).length / vals.length * 100;
  const totalRet = acc - 100;
  const annualized = (Math.pow(acc/100, 12/vals.length) - 1) * 100;

  // Desvío mensual → anualizado
  const mean = vals.reduce((a,b)=>a+b,0) / vals.length;
  const sd = Math.sqrt(vals.reduce((a,b)=>a+Math.pow(b-mean,2),0) / (vals.length-1));
  const volAnn = sd * Math.sqrt(12);

  return { serie, years, grid, anual, idx, mdd, best, worst, posPct, totalRet, annualized, volAnn,
           n: vals.length, last, lastY, ytdClosed, ytd: anual[lastY] };
}

/* ══════════════ FORMATO ══════════════ */
const cls = v => v > 0.0001 ? "pos" : v < -0.0001 ? "neg" : "zero";
function pct(v, d){
  if(v === undefined || v === null || isNaN(v)) return "—";
  d = (d === undefined) ? (Math.abs(v) >= 100 ? 0 : 1) : d;
  return (v > 0 ? "+" : "") + v.toFixed(d) + "%";
}
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ══════════════ GRÁFICO Crecimiento de $100 ══════════════ */
function chart(st, moneda){
  const W = 640, H = 150, PL = 42, PR = 8, PT = 8, PB = 16;
  const pts = st.idx;
  const vs = pts.map(p => p.v);
  const maxV = Math.max(...vs), minV = Math.min(...vs);
  const useLog = (maxV / minV) > 12;          // ARS: escala log, si no es una pared vertical

  const f = useLog ? Math.log10 : (x => x);
  const lo = f(minV * 0.97), hi = f(maxV * 1.03);
  const x = i => PL + (i / (pts.length - 1)) * (W - PL - PR);
  const y = v => PT + (1 - (f(v) - lo) / (hi - lo)) * (H - PT - PB);

  const line = pts.map((p,i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const area = line + " L" + x(pts.length-1).toFixed(1) + " " + (H-PB) + " L" + x(0).toFixed(1) + " " + (H-PB) + " Z";

  // Ticks Y
  let ticks = [];
  if(useLog){
    for(let e = Math.floor(lo); e <= Math.ceil(hi); e++){
      const v = Math.pow(10, e);
      if(f(v) >= lo && f(v) <= hi) ticks.push(v);
    }
    if(ticks.length < 3) ticks = [minV, Math.sqrt(minV*maxV), maxV];
  } else {
    for(let k = 0; k <= 4; k++) ticks.push(minV + (maxV - minV) * k / 4);
  }

  // Marcas de año (enero)
  const yearMarks = [];
  pts.forEach((p,i) => { if(p.ym !== "inicio" && p.ym.slice(5,7) === "01") yearMarks.push({ i, y: p.ym.slice(0,4) }); });

  const nf = v => v >= 1000 ? Math.round(v).toLocaleString("es-AR") : v.toFixed(0);

  return `
  <div class="chartbox">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--gold)" stop-opacity=".28"/>
        <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
      </linearGradient></defs>
      ${ticks.map(t => `<line x1="${PL}" x2="${W-PR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
        <text x="${PL-5}" y="${(y(t)+3).toFixed(1)}" text-anchor="end" font-family="'Space Mono',monospace" font-size="7" fill="var(--muted)">${nf(t)}</text>`).join("")}
      ${yearMarks.map(m => `<line x1="${x(m.i).toFixed(1)}" x2="${x(m.i).toFixed(1)}" y1="${PT}" y2="${H-PB}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="${x(m.i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="var(--muted)">${m.y}</text>`).join("")}
      <path d="${area}" fill="url(#g)"/>
      <path d="${line}" fill="none" stroke="var(--navy)" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(pts[pts.length-1].v).toFixed(1)}" r="2.6" fill="var(--gold)" stroke="var(--navy)" stroke-width="1"/>
    </svg>
    <div class="cap">Crecimiento de ${moneda === "USD" ? "USD" : "$"} 100 invertidos en ${st.serie[0][0]} · valor final ${moneda === "USD" ? "USD" : "$"} ${Math.round(st.idx[st.idx.length-1].v).toLocaleString("es-AR")}${useLog ? " · escala logarítmica" : ""}</div>
  </div>`;
}

/* ══════════════ COMPOSICIÓN (Firestore) ══════════════ */
function composicion(id){
  if(BLOCKS === null) return `<div class="empty">Cargando composición desde Firestore…</div>`;
  const blocks = (BLOCKS[id] && BLOCKS[id].blocks) || {};
  const items = Object.entries(blocks).filter(([,p]) => +p > 0);
  if(!items.length) return `<div class="empty">Esta cartera no tiene tenencias cargadas en <b>carteras-modelo.html</b>.<br>Cargalas ahí y este factsheet se actualiza solo.</div>`;

  const total = items.reduce((a,[,p]) => a + (+p), 0);

  // Agrupar por categoría
  const byCat = {};
  items.forEach(([aid, p]) => {
    const a = ACTIVOS_BY_ID[aid];
    const cat = a ? a.category : "otros";
    (byCat[cat] = byCat[cat] || []).push({ id: aid, name: a ? a.name : aid, pct: +p, obj: a && a.objetivo ? a.objetivo : "" });
  });

  const cats = CAT_ORDER.filter(c => byCat[c]);
  const catTot = c => byCat[c].reduce((a, x) => a + x.pct, 0);

  // ── Donut por clase de activo ──
  const R = 44, SW = 24, C = 2 * Math.PI * R;
  let off = 0;
  const segs = cats.map(c => {
    const len = (catTot(c) / total) * C;
    const s = `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${CATEGORIES[c].color}" stroke-width="${SW}"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 80 80)"><title>${CATEGORIES[c].label} · ${(catTot(c)/total*100).toFixed(1)}%</title></circle>`;
    off += len;
    return s;
  }).join("");

  const legend = cats.map(c =>
    `<div><i style="background:${CATEGORIES[c].color}"></i>${CATEGORIES[c].label}<b>${(catTot(c)/total*100).toFixed(1)}%</b></div>`
  ).join("");

  const donut = `
    <div class="donutbox">
      <div class="cap">COMPOSICIÓN DE LA CARTERA</div>
      <div class="donut">
        <svg viewBox="0 0 160 160">
          ${segs}
          <text x="80" y="76" text-anchor="middle" font-family="'Space Mono',monospace" font-size="17" font-weight="700" fill="var(--navy)">${items.length}</text>
          <text x="80" y="90" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="var(--muted)">ACTIVOS</text>
        </svg>
        <div class="leg">${legend}</div>
      </div>
    </div>`;

  const holdRows = cats.map(c => {
    const head = `<tr class="catrow"><td class="sw"><i style="background:${CATEGORIES[c].color}"></i></td><td class="l"><b>${CATEGORIES[c].label}</b></td><td><b>${(catTot(c)/total*100).toFixed(1)}%</b></td></tr>`;
    const rows = byCat[c].sort((a,b) => b.pct - a.pct).map(h =>
      `<tr class="subline"><td></td><td class="l">${esc(h.name)}</td><td>${(h.pct/total*100).toFixed(1)}%</td></tr>`).join("");
    return head + rows;
  }).join("");

  const nAct = items.length;
  const warn = Math.abs(total - 100) > 0.5
    ? `<div class="note">⚠ Las ponderaciones cargadas suman ${total.toFixed(1)}%, no 100%. Los porcentajes de arriba están normalizados. Revisá la cartera en carteras-modelo.html.</div>` : "";

  return `
    <div class="compo">
      <div>
        <table>
          <thead><tr><th class="l" colspan="2">Tenencias (${nAct})</th><th>Peso</th></tr></thead>
          <tbody>${holdRows}
            <tr class="tot"><td></td><td class="l">Total</td><td>100,0%</td></tr>
          </tbody>
        </table>
      </div>
      <div>${donut}</div>
    </div>${warn}`;
}

/* ══════════════ RENDER ══════════════ */
function render(){
  const id = CURRENT, m = META[id], st = stats(id);
  const cur = m.moneda === "USD" ? "USD" : m.moneda === "MIX" ? "MIX" : "ARS";
  const fb = (BLOCKS && BLOCKS[id]) || {};
  const fbDesc = fb.description || m.description;
  const fbHor  = fb.horizon || m.horizon;

  // Tabla de anuales
  let perf = "";
  if(st){
    const yrs = st.years;
    const head = yrs.map(y => `<th>${y}${(y === st.lastY && st.ytdClosed) ? " YTD" : ""}</th>`).join("");
    const row  = yrs.map(y => `<td class="${cls(st.anual[y])}">${pct(st.anual[y])}</td>`).join("");

    const gridRows = yrs.map(y => {
      const cells = MESES.map((_, i) => {
        const v = st.grid[y] && st.grid[y][i+1];
        return (v === undefined)
          ? `<td class="na">·</td>`
          : `<td class="${cls(v)}">${v.toFixed(1)}</td>`;
      }).join("");
      return `<tr><td class="yr">${y}</td>${cells}<td class="an ${cls(st.anual[y])}">${pct(st.anual[y], 1)}</td></tr>`;
    }).join("");

    perf = `
    <h2 class="sec">Rendimiento <span>${st.serie[0][0]} — ${st.last} · ${st.n} meses</span></h2>

    <table>
      <thead><tr><th class="l">Retorno anual</th>${head}</tr></thead>
      <tbody><tr>
        <td class="l" style="color:var(--muted)">${cur === "USD" ? "En dólares" : "En pesos"}</td>
        ${row}
      </tr></tbody>
    </table>

    <div class="kpis">
      <div class="kpi"><div class="k">Acumulado</div><div class="v ${cls(st.totalRet)}">${pct(st.totalRet, 0)}</div></div>
      <div class="kpi"><div class="k">Anualizado</div><div class="v ${cls(st.annualized)}">${pct(st.annualized, 1)}</div></div>
      <div class="kpi"><div class="k">Volatilidad anual.</div><div class="v">${st.volAnn.toFixed(1)}%</div></div>
      <div class="kpi"><div class="k">Máx. caída</div><div class="v neg">${st.mdd.toFixed(1)}%</div></div>
      <div class="kpi"><div class="k">Mejor / peor mes</div><div class="v" style="font-size:10px"><span class="pos">${pct(st.best,1)}</span> / <span class="neg">${pct(st.worst,1)}</span></div></div>
      <div class="kpi"><div class="k">Meses positivos</div><div class="v">${st.posPct.toFixed(0)}%</div></div>
    </div>

    ${chart(st, cur)}

    <h2 class="sec">Retornos mensuales <span>% · ${cur === "USD" ? "en dólares" : "en pesos"}</span></h2>
    <table class="grid">
      <thead><tr><th class="l">Año</th>${MESES.map(x => `<th>${x}</th>`).join("")}<th style="border-left:1px solid var(--navy)">Año</th></tr></thead>
      <tbody>${gridRows}</tbody>
    </table>`;
  } else {
    perf = `
    <h2 class="sec">Rendimiento</h2>
    <div class="empty">Todavía no hay track record cargado para esta cartera.<br>
    Cargá los meses en la pestaña <b>Rendimientos</b> de carteras-modelo y esta hoja se completa sola.</div>`;
  }

  document.getElementById("app").innerHTML = `
  <div class="sheet">
    <div class="hdr">
      <div>
        <h1>${esc(m.title)}</h1>
        <div class="sub">CARTERA MODELO · ${esc(m.moneda)}</div>
        <div class="badges">${m.badges.map((b,i) => `<span class="bdg ${i === 0 ? "navy" : "gold"}">${esc(b)}</span>`).join("")}</div>
      </div>
      <div class="logo">
        <div class="n">SilverCloud</div>
        <div class="c">ADVISORS · CNV Nº 474</div>
        <div class="c" style="margin-top:6px">${new Date().toLocaleDateString("es-AR", { day:"2-digit", month:"short", year:"numeric" })}</div>
      </div>
    </div>

    <h2 class="sec">Mandato</h2>
    <div class="desc">${esc(fbDesc)}</div>
    <div class="mandate">
      <div class="mcell"><div class="k">Horizonte</div><div class="v">${esc(fbHor)}</div></div>
    </div>

    ${perf}

    <h2 class="sec">Composición actual <span>en vivo · carteras-modelo</span></h2>
    ${composicion(id)}

    <div class="foot">
      <b>Advertencias.</b> ${esc(FUENTE)} Los rendimientos corresponden a la <b>cartera modelo</b> y no a una cuenta individual: el retorno efectivo de cada cliente difiere según el momento de suscripción, los flujos de fondos, los costos de transacción y los impuestos aplicables, ninguno de los cuales está descontado en las cifras presentadas. La composición mostrada es la vigente a la fecha de emisión de este documento y no necesariamente coincide con la que generó el track record histórico, ya que las carteras se rebalancean periódicamente. <b>Los rendimientos pasados no garantizan resultados futuros.</b> Este documento es de carácter informativo y no constituye una oferta, invitación ni recomendación personalizada de inversión. SilverCloud Advisors · Agente Asesor Global de Inversiones registrado ante la CNV bajo el Nº 474.
    </div>
  </div>`;
}

/* ══════════════ TABS ══════════════ */
function tabs(){
  document.getElementById("tabs").innerHTML = ORDER.map(id =>
    `<button class="tab ${id === CURRENT ? "on" : ""} ${tieneTrack(id) ? "" : "notrack"}" onclick="sel('${id}')">${esc(META[id].label)}${tieneTrack(id) ? "" : " ·"}</button>`
  ).join("");
}
function sel(id){ CURRENT = id; tabs(); render(); window.scrollTo(0,0); }
window.sel = sel;

/* ══════════════ FIRESTORE (solo lectura) ══════════════ */
function fbStatus(state, txt){
  const d = document.getElementById("fbdot");
  d.className = "fbdot " + state;
  document.getElementById("fbtxt").textContent = txt;
}
function initSync(){
  if(!window.SC_FB){ fbStatus("err", "sin Firebase · serie local"); BLOCKS = {}; render(); return; }
  const { db, doc, getDoc, onSnapshot } = window.SC_FB;

  let okCart = false, okRend = false;
  const marcar = () => {
    if(okCart && okRend) fbStatus("ok", "en vivo");
    else if(okCart || okRend) fbStatus("", "cargando…");
  };

  // ── Composición ──
  const cartRef = doc(db, "silvercloud", "carteras");
  const applyCart = snap => {
    BLOCKS = (snap.exists() && snap.data().data) || {};
    okCart = true; marcar(); render();
  };
  const failCart = () => { BLOCKS = BLOCKS || {}; fbStatus("err", "sin conexión"); render(); };
  getDoc(cartRef).then(applyCart).catch(failCart);
  try { onSnapshot(cartRef, applyCart, failCart); } catch(e){ failCart(); }

  // ── Track record ──
  const rendRef = doc(db, "silvercloud", "rendimientos");
  const applyRend = snap => {
    const data = snap.exists() && snap.data().data;
    if(data && Object.keys(data).length){
      RETORNOS = data;
      RET_ORIGEN = "firestore";
    } else {
      RETORNOS = retFromFallback();
      RET_ORIGEN = "fallback";
    }
    okRend = true; marcar(); tabs(); render();
  };
  const failRend = () => {
    RETORNOS = retFromFallback();
    RET_ORIGEN = "fallback";
    fbStatus("err", "serie local");
    tabs(); render();
  };
  getDoc(rendRef).then(applyRend).catch(failRend);
  try { onSnapshot(rendRef, applyRend, failRend); } catch(e){ failRend(); }
}
window.addEventListener("sc-firebase-ready", initSync);
if(window.SC_FB) initSync();

tabs();
render();
</script>
